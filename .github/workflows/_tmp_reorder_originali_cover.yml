name: TMP Reorder Originali Cover

on:
  push:
    branches:
      - lab/musiclab-playback-403-recovery-01
    paths:
      - .github/workflows/_tmp_reorder_originali_cover.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0
      - name: Reorder quick actions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt')
          t = p.read_text()
          start = t.index('                actions =\n')
          end = t.index('                columns =', start)
          replacement = '''                actions =
                    listOfNotNull(
                        if (!isListenTogetherGuest) {
                            NewAction(
                                icon = {
                                    Icon(
                                        painter = painterResource(R.drawable.radio),
                                        contentDescription = null,
                                        modifier = Modifier.size(32.dp),
                                        tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                    )
                                },
                                text = stringResource(R.string.start_radio),
                                onClick = {
                                    Toast.makeText(context, startingRadioText, Toast.LENGTH_SHORT).show()
                                    playerConnection.startRadioSeamlessly()
                                    onDismiss()
                                },
                            )
                        } else {
                            null
                        },
                        NewAction(
                            icon = {
                                Icon(
                                    painter = painterResource(R.drawable.playlist_add),
                                    contentDescription = null,
                                    modifier = Modifier.size(32.dp),
                                    tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                )
                            },
                            text = stringResource(R.string.add_to_playlist),
                            onClick = { showChoosePlaylistDialog = true },
                        ),
                        NewAction(
                            icon = {
                                Icon(
                                    painter = painterResource(R.drawable.link),
                                    contentDescription = null,
                                    modifier = Modifier.size(32.dp),
                                    tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                )
                            },
                            text = stringResource(R.string.copy_link),
                            onClick = {
                                val clipboard = context.getSystemService(android.content.Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                                val clip = android.content.ClipData.newPlainText(
                                    "Song Link",
                                    "https://music.youtube.com/watch?v=${mediaMetadata.id}",
                                )
                                clipboard.setPrimaryClip(clip)
                                android.widget.Toast
                                    .makeText(context, R.string.link_copied, android.widget.Toast.LENGTH_SHORT)
                                    .show()
                                onDismiss()
                            },
                        ),
                    ) +
                        (if (com.metrolist.spotify.Spotify.isAuthenticated()) {
                            listOf(
                                NewAction(
                                    icon = {
                                        Icon(
                                            painter = painterResource(R.drawable.spotify),
                                            contentDescription = null,
                                            modifier = Modifier.size(32.dp),
                                            tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                        )
                                    },
                                    text = stringResource(R.string.spotify_add_to_playlist),
                                    onClick = { showAddToSpotifyPlaylist = true },
                                ),
                            )
                        } else {
                            emptyList()
                        }) +
                        listOf(
                            NewAction(
                                icon = {
                                    Icon(
                                        painter = painterResource(R.drawable.album),
                                        contentDescription = null,
                                        modifier = Modifier.size(32.dp),
                                        tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                    )
                                },
                                text = "Originali",
                                onClick = {
                                    val opened = com.metrolist.music.ui.component.OriginalVersionNavigationBridge.open(
                                        com.metrolist.music.ui.component.OriginalVersionRequest(
                                            title = mediaMetadata.title,
                                            artist = mediaMetadata.artists.firstOrNull()?.name.orEmpty(),
                                            durationSec = mediaMetadata.duration,
                                            currentYouTubeId = mediaMetadata.id,
                                        ),
                                    )
                                    if (opened) {
                                        playerBottomSheetState.collapseSoft()
                                        onDismiss()
                                    }
                                },
                            ),
                            NewAction(
                                icon = {
                                    Icon(
                                        painter = painterResource(R.drawable.link),
                                        contentDescription = null,
                                        modifier = Modifier.size(32.dp),
                                        tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                    )
                                },
                                text = "Cover",
                                onClick = {
                                    playerBottomSheetState.collapseSoft()
                                    showCoverSearchDialog = true
                                },
                            ),
                        ),
'''
          p.write_text(t[:start] + replacement + t[end:])
          PY
          rm -f .github/workflows/_tmp_reorder_originali_cover.yml
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(player): keep Spotify before Originali and Cover"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
