name: TMP Reorder Originali Cover

on:
  push:
    branches:
      - lab/musiclab-playback-403-recovery-01
    paths:
      - .github/workflows/_tmp_reorder_originali_cover.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0
      - name: Reorder quick actions
        run: python3 .github/uab/reorder_originali_cover.py
      - name: Commit final LAB source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp_reorder_originali_cover.yml
          rm -f .github/uab/reorder_originali_cover.py
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(player): keep Spotify before Originali and Cover"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
