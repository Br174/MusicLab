name: TEMP LAB13 Verify Updater and Upstream
on:
  push:
    branches: [uab-build/musiclab-meld-upstream-sync-13]
permissions:
  contents: read
concurrency:
  group: musiclab-lab13-verify
  cancel-in-progress: true
jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla segreti firma senza mostrarli
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for n in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!n:-}" ]; then echo "MOTORLAB_SIGNING_MISSING=$n"; missing=1; fi
          done
          if [ "$missing" -eq 0 ]; then echo "MOTORLAB_STABLE_SIGNING=READY"; else echo "MOTORLAB_STABLE_SIGNING=NEEDS_SETUP"; fi
  upstream-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analizza Meld v0.8.9 -> ultimo tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force https://github.com/FrancescoGrazioso/Meld.git '+refs/tags/*:refs/remotes/meld/tags/*'
          BASE=refs/remotes/meld/tags/v0.8.9
          TARGET_TAG=$(git for-each-ref --sort=-version:refname --format='%(refname:strip=4)' refs/remotes/meld/tags | grep '^v[0-9]' | head -1)
          TARGET=refs/remotes/meld/tags/$TARGET_TAG
          mkdir -p upstream-review
          git diff --name-only "$BASE" "$TARGET" | sort -u > upstream-review/upstream-files.txt
          git diff --name-only "$BASE" HEAD | sort -u > upstream-review/musiclab-files.txt
          comm -12 upstream-review/upstream-files.txt upstream-review/musiclab-files.txt > upstream-review/logical-hotspots.txt || true
          git diff --binary "$BASE" "$TARGET" > upstream-review/meld-exact.patch || true
          git config user.email upstream-review@musiclab.local
          git config user.name 'MusicLab Upstream Review'
          set +e
          git merge --no-commit --no-ff "$TARGET" >/tmp/merge.log 2>&1
          rc=$?
          set -e
          git diff --name-only --diff-filter=U | sort -u > upstream-review/merge-conflicts.txt || true
          git merge --abort >/dev/null 2>&1 || git reset --hard HEAD >/dev/null 2>&1
          {
            echo '# Meld upstream review'
            echo "baseline=v0.8.9"
            echo "target=$TARGET_TAG"
            echo "commits=$(git rev-list --count "$BASE..$TARGET")"
            echo "upstream_files=$(wc -l < upstream-review/upstream-files.txt)"
            echo "logical_hotspots=$(wc -l < upstream-review/logical-hotspots.txt)"
            echo "git_conflicts=$(wc -l < upstream-review/merge-conflicts.txt)"
            echo '--- HOTSPOTS ---'
            cat upstream-review/logical-hotspots.txt
            echo '--- CONFLICTS ---'
            cat upstream-review/merge-conflicts.txt
          } | tee upstream-review/REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Meld-v0.9.2-review
          path: upstream-review/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Crea keystore debug temporaneo
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt || true
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build LAB13
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          UAB_BUILD_ID: b20260929lab13
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-MELD-UPSTREAM-SYNC-13
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
