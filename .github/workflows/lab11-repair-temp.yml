name: TEMP LAB11 Compile Repair
on:
  push:
    branches: [uab-build/musiclab-global-ai-engine-11]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'LAB11 repair compile errors')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-global-ai-engine-11
          fetch-depth: 0
      - name: Correggi i quattro errori Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cover = Path('app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt')
          s = cover.read_text()
          old = 'val enabledBatch = discoveredBatch.filter(::categoryEnabled)'
          new = 'val enabledBatch = discoveredBatch.filter { candidate -> categoryEnabled(candidate.category) }'
          if old not in s:
              raise SystemExit('Pattern CoverSearchScreen non trovato')
          cover.write_text(s.replace(old, new, 1))

          info = Path('app/src/main/kotlin/com/metrolist/music/ui/utils/ShowMediaInfo.kt')
          s = info.read_text()
          old_album = 'album = currentSong.albumName,'
          if old_album not in s:
              raise SystemExit('Pattern albumName non trovato')
          s = s.replace(old_album, 'album = currentSong.album?.title,', 1)

          old_start = '''                    canonical?.let { ai ->
                        Spacer(Modifier.height(8.dp))
                        val aiItems = mutableListOf<Material3SettingsItem>()
                        fun addAiItem(title: String, value: String?) {'''
          new_start = '''                    val ai = canonical
                    if (ai != null) {
                        Spacer(Modifier.height(8.dp))
                        val aiItems = mutableListOf<Material3SettingsItem>()
                        val aiInfoIcon = painterResource(R.drawable.info)
                        fun addAiItem(title: String, value: String?) {'''
          if old_start not in s:
              raise SystemExit('Pattern canonical let non trovato')
          s = s.replace(old_start, new_start, 1)

          marker = 'val aiInfoIcon = painterResource(R.drawable.info)'
          pos = s.index(marker)
          icon_pos = s.index('icon = painterResource(R.drawable.info),', pos)
          s = s[:icon_pos] + 'icon = aiInfoIcon,' + s[icon_pos + len('icon = painterResource(R.drawable.info),'):]
          info.write_text(s)
          PY
      - name: Commit delle correzioni
        shell: bash
        run: |
          git config user.name "MusicLab LAB bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/kotlin/com/metrolist/music/ui/utils/ShowMediaInfo.kt
          git commit -m "LAB11: corregge errori Kotlin emersi dal build"
          git push origin HEAD:uab-build/musiclab-global-ai-engine-11
