name: TEMP LAB11 Compile Repair
on:
  push:
    branches: [uab-build/musiclab-global-ai-engine-11]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'LAB11 repair compile errors')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-global-ai-engine-11
          fetch-depth: 0
      - name: Correggi i quattro errori Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cover = Path('app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt')
          s = cover.read_text()
          old = 'val enabledBatch = discoveredBatch.filter(::categoryEnabled)'
          if old not in s:
              raise SystemExit('Pattern CoverSearchScreen non trovato')
          cover.write_text(s.replace(old, 'val enabledBatch = discoveredBatch.filter { candidate -> categoryEnabled(candidate.category) }', 1))

          info = Path('app/src/main/kotlin/com/metrolist/music/ui/utils/ShowMediaInfo.kt')
          s = info.read_text()
          if 'album = currentSong.albumName,' not in s:
              raise SystemExit('Pattern albumName non trovato')
          s = s.replace('album = currentSong.albumName,', 'album = currentSong.album?.title,', 1)

          if 'canonical?.let { ai ->' not in s:
              raise SystemExit('Pattern canonical let non trovato')
          s = s.replace('canonical?.let { ai ->', 'val ai = canonical\n                    if (ai != null) {', 1)

          anchor = 'val aiItems = mutableListOf<Material3SettingsItem>()'
          pos = s.index(anchor)
          insert = anchor + '\n                        val aiInfoIcon = painterResource(R.drawable.info)'
          s = s[:pos] + s[pos:].replace(anchor, insert, 1)

          pos = s.index('val aiInfoIcon = painterResource(R.drawable.info)')
          icon = 'icon = painterResource(R.drawable.info),'
          icon_pos = s.index(icon, pos)
          s = s[:icon_pos] + 'icon = aiInfoIcon,' + s[icon_pos + len(icon):]
          info.write_text(s)
          PY
      - name: Commit delle correzioni
        shell: bash
        run: |
          git config user.name "MusicLab LAB bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/kotlin/com/metrolist/music/ui/utils/ShowMediaInfo.kt
          git commit -m "LAB11: corregge errori Kotlin emersi dal build"
          git push origin HEAD:uab-build/musiclab-global-ai-engine-11
