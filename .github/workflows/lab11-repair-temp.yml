name: TEMP LAB11 Memory Patch
on:
  push:
    branches:
      - uab-build/musiclab-global-ai-engine-11
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'LAB11 memory cache patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-global-ai-engine-11
          fetch-depth: 0
      - name: Applica patch memoria
        run: python3 tools/lab11_memory_patch.py
      - name: Verifica sintassi Worker
        run: node --check cloudflare/music-intelligence/src/index.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MusicLab LAB bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/component/GeminiAiCoverDiscovery.kt cloudflare/music-intelligence/src/index.js
          git commit -m "LAB11: primi 5 risultati e memoria D1 cache-first"
          git push origin HEAD:uab-build/musiclab-global-ai-engine-11
