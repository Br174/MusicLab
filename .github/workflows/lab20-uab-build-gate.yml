name: LAB20 UAB Delivery Gate

# gate-revision: 3 — exact-SHA Brain + Android + APK/ZIP final gate
on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - '.github/workflows/lab20-uab-build-gate.yml'

permissions:
  contents: read

concurrency:
  group: lab20-uab-delivery-gate
  cancel-in-progress: true

jobs:
  build:
    name: verify-and-build-lab20-apk-zip
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact LAB20 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record exact source SHA
        shell: bash
        run: |
          echo "LAB20 final source: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run complete MusicLab Brain regression suite
        run: node --test cloudflare/music-intelligence/test/*.test.mjs

      - name: Verify additive D1 migrations
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          root = Path('cloudflare/music-intelligence/migrations')
          db = sqlite3.connect(':memory:')
          for name in ['0001_music_intelligence.sql', '0002_canonical_ai_repair.sql', '0003_music_brain.sql']:
              db.executescript((root / name).read_text())
          tables = {row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          required = {'works', 'versions', 'work_aliases', 'related_works', 'version_evidence', 'decision_history', 'search_missions', 'coverage_cells'}
          missing = required - tables
          if missing:
              raise SystemExit(f'Missing D1 tables: {sorted(missing)}')
          print('D1 migration chain OK:', ', '.join(sorted(required)))
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android Brain contract tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --tests com.metrolist.music.ui.component.AiBrainMetadataTest --tests com.metrolist.music.ui.component.AiCoverageModeTest --warning-mode summary

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB20 APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Stamp exact build SHA
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
          test "$(cat dist/uab/BUILD_SHA.txt)" = "$GITHUB_SHA"

      - name: Verify LAB20 deliverables
        shell: bash
        run: |
          test -s dist/uab/apk/MusicLab-LAB-20.apk
          test -s dist/uab/MusicLab-LAB-20-APK.zip
          test -s dist/uab/apk/SHA256SUMS.txt
          test -s dist/uab/BUILD_SHA.txt
          unzip -tq dist/uab/MusicLab-LAB-20-APK.zip
          test "$(unzip -Z1 dist/uab/MusicLab-LAB-20-APK.zip | grep -c '\.apk$')" -eq 1
          echo '--- Source SHA ---'
          cat dist/uab/BUILD_SHA.txt
          echo '--- SHA256 ---'
          cat dist/uab/apk/SHA256SUMS.txt
          echo '--- Files ---'
          ls -lh dist/uab/apk/MusicLab-LAB-20.apk dist/uab/MusicLab-LAB-20-APK.zip

      - name: Upload LAB20 APK ZIP and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-20
          path: |
            dist/uab/apk/MusicLab-LAB-20.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB-20-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
