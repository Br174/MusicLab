name: MusicLab LAB12 - Diagnosi Resolver

on:
  push:
    branches:
      - uab-build/musiclab-canonical-ai-repair-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://musiclab-music-intelligence.brunoverlezza.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Stato Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "$WORKER_URL/stato" | jq .

      - name: Modelli Gemini disponibili per generateContent
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          curl -sS \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000" \
            | jq -r '.models[]? | select((.supportedGenerationMethods // []) | index("generateContent")) | .name' \
            | sort

      - name: Probe generateContent sui modelli candidati
        shell: bash
        run: |
          set -u
          body='{"contents":[{"role":"user","parts":[{"text":"Rispondi solo JSON: {\"ok\":true}"}]}],"generationConfig":{"maxOutputTokens":64,"temperature":0,"responseMimeType":"application/json"}}'
          for model in gemini-3.5-flash-lite gemini-3.1-flash-lite gemini-2.5-flash-lite gemini-flash-lite-latest gemini-3.5-flash; do
            code="$(curl -sS -o "/tmp/$model.json" -w '%{http_code}' \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")"
            echo "MODEL=$model HTTP=$code"
            jq '{error, candidateText: .candidates[0].content.parts[0].text}' "/tmp/$model.json" 2>/dev/null || head -c 400 "/tmp/$model.json"
            echo
          done

      - name: Diagnosi resolve caso reale
        shell: bash
        run: |
          set -u
          payload='{"title":"Mi Sono Innamorato Di Te - Gianluca Grignani","artist":"Alessandra De Angelis","useMemory":false,"wantCredits":true}'
          http_code="$(curl -sS -o /tmp/resolve.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'x-musiclab-client: lab12-diagnose' \
            -d "$payload" \
            "$WORKER_URL/api/v1/resolve")"
          echo "HTTP=$http_code"
          cat /tmp/resolve.json
          echo
          jq . /tmp/resolve.json || true

      - name: Diagnosi discovery Originali
        shell: bash
        run: |
          set -u
          payload='{"title":"Mi Sono Innamorato Di Te - Gianluca Grignani","artist":"Alessandra De Angelis","mode":"originals","useMemory":false}'
          http_code="$(curl -sS -o /tmp/discover.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'x-musiclab-client: lab12-diagnose' \
            -d "$payload" \
            "$WORKER_URL/api/v1/discover/initial")"
          echo "HTTP=$http_code"
          cat /tmp/discover.json
          echo
          jq . /tmp/discover.json || true
