name: TEMP - Apply MusicLab 403 recovery patch

on:
  push:
    branches:
      - 'lab/musiclab-playback-403-recovery-01'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0

      - name: Apply isolated 403 recovery patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_403_patch.py
          python3 /tmp/apply_403_patch.py
          git diff --check
          git diff -- app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt

      - name: Commit isolated application change
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt
          git commit -m "fix(playback): rebuild current source after persistent 403"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
