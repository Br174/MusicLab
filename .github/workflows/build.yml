name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".motorlab/**"
      - "MOTORLAB_PROJECT_HOOK.txt"

permissions:
  contents: write
  discussions: write

jobs:
  scudo360:
    uses: ./.github/workflows/scudo360-reusable.yml
    secrets: inherit

  build_release:
    needs: scudo360
    name: Build Release (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fail early if stable release signing credentials are unavailable
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD; do
            if [ -z "$(printenv "$name" 2>/dev/null)" ]; then
              echo "::error::Stable release signing credential $name is unavailable. Build blocked before expensive Gradle work. No replacement identity generated."
              exit 78
            fi
          done
          echo '[SIGNING_PREFLIGHT=PASS] Existing release signing inputs present; certificate will remain unchanged.'

      - name: Build Release APK and Run Lint
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release :app:lint${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.meld.app
          METROLIST_APP_NAME: Meld Nightly
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Without these the in-app crash/ANR reporter silently disables itself
          # (CrashReporter.isEnabledSafe), so tester builds report nothing.
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'FrancescoGrazioso/Meld' }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="app-universal-with-Google-Cast.apk"
          else
            TARGET_NAME="app-universal-release.apk"
          fi
          find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | xargs -I{} mv {} "$OUTPUT_DIR/out/$TARGET_NAME"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant == 'gms' && 'app-with-Google-Cast' || 'app-release' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*

  build_debug:
    needs: scudo360
    name: Build Debug (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate original persistent debug keystore before Gradle
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Original DEBUG_KEYSTORE is unavailable. Refusing to create a replacement certificate."
            exit 78
          fi
          umask 077
          if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ./app/persistent-debug.keystore; then
            echo "::error::Stored DEBUG_KEYSTORE is not valid base64. Original identity preserved."
            exit 78
          fi
          if ! keytool -list -keystore ./app/persistent-debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "::error::Original debug keystore cannot be read with the expected identity; do not regenerate or change signing certificate."
            exit 78
          fi
          echo '[DEBUG_KEYSTORE=VERIFIED] Existing stable debug signing identity is readable.'

      - name: Build Debug APK and Run Lint
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Debug :app:lint${{ matrix.variantName }}Debug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.meld.app
          METROLIST_APP_NAME: Meld Nightly
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Without these the in-app crash/ANR reporter silently disables itself
          # (CrashReporter.isEnabledSafe), so tester builds report nothing.
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'FrancescoGrazioso/Meld' }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant == 'gms' && 'app-debug-gms' || 'app-debug' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/debug/*.apk
