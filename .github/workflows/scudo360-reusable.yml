name: Scudo360 MusicLab reusable native evidence gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scudo360-native:
    name: Scudo360 native regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Init existing metroproto submodule
        run: git submodule update --init metroproto
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success
      - name: Setup and generate protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Gradle execute permission
        run: chmod +x gradlew
      - name: Require fresh native JUnit class evidence
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json promotion .motorlab/scudo360-report.json
      - name: Save exact evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scudo360-music-native-${{ github.run_id }}
          path: |
            .motorlab/scudo360-report.json
            app/build/test-results/testFossDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
