name: MusicLab LAB07 Live Cover Provider Benchmark (No APK)

on:
  push:
    branches:
      - uab-build/musiclab-turbo-lab07-strategy-lab-family-02
    paths:
      - .github/workflows/turbo-lab07-live-provider-gate.yml
      - cloudflare/music-intelligence/test/turbo-lab07-live-coverinfo-probe.test.mjs
      - cloudflare/music-intelligence/test/turbo-lab07-live-video-chain.test.mjs
      - cloudflare/music-intelligence/test/turbo-lab07-five-song-query-variants.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-turbo-lab07-live-provider-independent
  cancel-in-progress: false

jobs:
  live-provider:
    name: ten-actual-COVER-INFO-network-checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only live COVER.INFO tests within five-second timeboxes
        run: node --test cloudflare/music-intelligence/test/turbo-lab07-live-coverinfo-probe.test.mjs
      - name: Test full real search-to-YouTube metadata chain under 5000ms
        run: node --test cloudflare/music-intelligence/test/turbo-lab07-live-video-chain.test.mjs
      - name: Compare ten real COVER.INFO queries across five independent songs
        run: node --test cloudflare/music-intelligence/test/turbo-lab07-five-song-query-variants.test.mjs
