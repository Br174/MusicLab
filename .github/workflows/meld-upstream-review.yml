name: MusicLab - Meld Upstream Guardian

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Analizza nuovo update oppure finalizza una LAB gia' risolta"
        required: true
        default: analyze
        type: choice
        options:
          - analyze
          - finalize_current_lab
      to_tag:
        description: "Tag Meld da analizzare/finalizzare (vuoto = ultimo tag; obbligatorio in finalize)"
        required: false
        default: ""
        type: string
      create_lab:
        description: "In analyze: crea una nuova LAB isolata"
        required: true
        default: true
        type: boolean
      build_when_safe:
        description: "Esegue test + APK/ZIP quando l'integrazione e' pronta"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: musiclab-meld-upstream-guardian
  cancel-in-progress: false

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configura Git
        run: |
          git config user.email "motorlab@musiclab.local"
          git config user.name "MusicLab MotorLab"

      - name: Carica stato Meld
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open(".github/upstream/meld.json"))
          print("repo="+c["source_repo"])
          print("baseline_tag="+c["accepted_baseline_tag"])
          print("baseline_commit="+c["accepted_baseline_commit"])
          PY

      - name: Recupera esclusivamente Meld
        shell: bash
        run: |
          set -euo pipefail
          git remote remove meld >/dev/null 2>&1 || true
          git remote add meld "https://github.com/${{ steps.cfg.outputs.repo }}.git"
          git fetch --force meld '+refs/tags/*:refs/remotes/meld/tags/*'

      - name: Risolve baseline e target
        id: resolve
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.to_tag }}
          BASELINE_TAG: ${{ steps.cfg.outputs.baseline_tag }}
          BASELINE_COMMIT: ${{ steps.cfg.outputs.baseline_commit }}
        run: |
          set -euo pipefail
          START_HEAD="$(git rev-parse HEAD)"
          BASE_REF="refs/remotes/meld/tags/$BASELINE_TAG"
          git rev-parse --verify "$BASE_REF" >/dev/null
          ACTUAL_BASE="$(git rev-parse "$BASE_REF^{}")"
          if [ "$ACTUAL_BASE" != "$BASELINE_COMMIT" ]; then
            echo "Baseline incoerente: config=$BASELINE_COMMIT git=$ACTUAL_BASE" >&2
            exit 20
          fi

          if [ -n "${REQUESTED_TAG:-}" ]; then
            TARGET_TAG="$REQUESTED_TAG"
          else
            TARGET_TAG="$(git for-each-ref --sort=-version:refname --format='%(refname:strip=4)' refs/remotes/meld/tags | grep '^v[0-9]' | head -1)"
          fi
          [ -n "$TARGET_TAG" ] || { echo "Nessun tag Meld trovato" >&2; exit 21; }

          TARGET_REF="refs/remotes/meld/tags/$TARGET_TAG"
          git rev-parse --verify "$TARGET_REF" >/dev/null
          TARGET_COMMIT="$(git rev-parse "$TARGET_REF^{}")"
          TARGET_VERSION="${TARGET_TAG#v}"

          NO_UPDATE=false
          if [ "$TARGET_COMMIT" = "$BASELINE_COMMIT" ]; then
            NO_UPDATE=true
          else
            git merge-base --is-ancestor "$BASELINE_COMMIT" "$TARGET_COMMIT" || {
              echo "Il target $TARGET_TAG non discende dalla baseline $BASELINE_TAG: revisione manuale obbligatoria." >&2
              exit 22
            }
          fi

          TAG_SLUG="$(printf '%s' "$TARGET_TAG" | sed 's/[^A-Za-z0-9._-]/-/g')"
          TAG_ID="$(printf '%s' "$TARGET_VERSION" | tr -cd '[:alnum:]')"
          echo "start_head=$START_HEAD" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "target_version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag_slug=$TAG_SLUG" >> "$GITHUB_OUTPUT"
          echo "tag_id=$TAG_ID" >> "$GITHUB_OUTPUT"
          echo "no_update=$NO_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Analizza delta, hotspot e conflitti
        if: inputs.mode == 'analyze' && steps.resolve.outputs.no_update != 'true'
        id: analyze
        shell: bash
        env:
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          TARGET_REF: ${{ steps.resolve.outputs.target_ref }}
          START_HEAD: ${{ steps.resolve.outputs.start_head }}
        run: |
          set -euo pipefail
          mkdir -p upstream-review
          git diff --binary "$BASE_REF" "$TARGET_REF" > upstream-review/meld-exact.patch || true
          git diff --name-status -M "$BASE_REF" "$TARGET_REF" > upstream-review/upstream-files.txt
          : > upstream-review/merge-conflicts.txt
          set +e
          git merge --no-commit --no-ff "$TARGET_REF" >/tmp/meld-merge.log 2>&1
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort -u > upstream-review/merge-conflicts.txt || true
          fi
          git merge --abort >/dev/null 2>&1 || git reset --hard "$START_HEAD" >/dev/null 2>&1

          python3 .github/scripts/meld_upstream_analyzer.py \
            --base-ref "$BASE_REF" \
            --target-ref "$TARGET_REF" \
            --head-ref "$START_HEAD" \
            --conflicts-file upstream-review/merge-conflicts.txt \
            --out-dir upstream-review

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open("upstream-review/classification.json"))
          print("auto_apply_allowed="+str(r["auto_apply_allowed"]).lower())
          for k,v in r["counts"].items():
              print(f"{k}={v}")
          PY

      - name: Crea LAB isolata
        if: inputs.mode == 'analyze' && inputs.create_lab && steps.resolve.outputs.no_update != 'true'
        id: lab
        shell: bash
        env:
          TARGET_REF: ${{ steps.resolve.outputs.target_ref }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          TARGET_COMMIT: ${{ steps.resolve.outputs.target_commit }}
          START_HEAD: ${{ steps.resolve.outputs.start_head }}
          TAG_SLUG: ${{ steps.resolve.outputs.tag_slug }}
          AUTO_ALLOWED: ${{ steps.analyze.outputs.auto_apply_allowed }}
        run: |
          set -euo pipefail
          LAB_BRANCH="uab-build/musiclab-meld-${TAG_SLUG}-integration-${GITHUB_RUN_NUMBER}"
          git checkout -b "$LAB_BRANCH" "$START_HEAD"

          if [ "$AUTO_ALLOWED" = "true" ]; then
            git merge --no-ff "$TARGET_REF" -m "LAB: integra Meld $TARGET_TAG (safe automatico)"
            INTEGRATED_HEAD="$(git rev-parse HEAD)"
            INTEGRATION_APPLIED=true
            MODE=auto_safe
          else
            mkdir -p .github/upstream/pending
            python3 - <<PY
          import json
          from pathlib import Path
          classification=json.load(open("upstream-review/classification.json"))
          payload={
              "schema": 1,
              "target_tag": "${TARGET_TAG}",
              "target_commit": "${TARGET_COMMIT}",
              "source_head": "${START_HEAD}",
              "status": "review_required",
              "classification_counts": classification["counts"],
              "rule": "Non scegliere automaticamente tra MusicLab e Meld. Risolvere/adattare in questa LAB; completare il merge di Meld, poi usare finalize_current_lab."
          }
          Path(".github/upstream/pending/meld-${TAG_SLUG}.json").write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          PY
            git add ".github/upstream/pending/meld-${TAG_SLUG}.json"
            git commit -m "LAB: registra revisione Meld $TARGET_TAG"
            INTEGRATED_HEAD=""
            INTEGRATION_APPLIED=false
            MODE=review_required
          fi

          git push origin "HEAD:refs/heads/$LAB_BRANCH"
          echo "lab_branch=$LAB_BRANCH" >> "$GITHUB_OUTPUT"
          echo "integration_applied=$INTEGRATION_APPLIED" >> "$GITHUB_OUTPUT"
          echo "integrated_head=$INTEGRATED_HEAD" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Verifica LAB risolta per finalizzazione
        if: inputs.mode == 'finalize_current_lab' && steps.resolve.outputs.no_update != 'true'
        id: finalize
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.to_tag }}
          TARGET_COMMIT: ${{ steps.resolve.outputs.target_commit }}
          START_HEAD: ${{ steps.resolve.outputs.start_head }}
        run: |
          set -euo pipefail
          [ -n "${REQUESTED_TAG:-}" ] || { echo "In finalize_current_lab specificare to_tag." >&2; exit 23; }
          git merge-base --is-ancestor "$TARGET_COMMIT" "$START_HEAD" || {
            echo "La LAB corrente non contiene ancora il target Meld completo. Completare/risolvere il merge prima della finalizzazione." >&2
            exit 24
          }
          echo "lab_branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "integration_applied=true" >> "$GITHUB_OUTPUT"
          echo "integrated_head=$START_HEAD" >> "$GITHUB_OUTPUT"
          echo "mode=manual_review_resolved" >> "$GITHUB_OUTPUT"

      - name: Normalizza contesto LAB
        if: (inputs.mode == 'analyze' && inputs.create_lab && steps.resolve.outputs.no_update != 'true') || (inputs.mode == 'finalize_current_lab' && steps.resolve.outputs.no_update != 'true')
        id: ctx
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          ANALYZE_BRANCH: ${{ steps.lab.outputs.lab_branch }}
          ANALYZE_APPLIED: ${{ steps.lab.outputs.integration_applied }}
          ANALYZE_HEAD: ${{ steps.lab.outputs.integrated_head }}
          ANALYZE_MODE: ${{ steps.lab.outputs.mode }}
          FINAL_BRANCH: ${{ steps.finalize.outputs.lab_branch }}
          FINAL_APPLIED: ${{ steps.finalize.outputs.integration_applied }}
          FINAL_HEAD: ${{ steps.finalize.outputs.integrated_head }}
          FINAL_MODE: ${{ steps.finalize.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$INPUT_MODE" = "finalize_current_lab" ]; then
            echo "lab_branch=$FINAL_BRANCH" >> "$GITHUB_OUTPUT"
            echo "integration_applied=$FINAL_APPLIED" >> "$GITHUB_OUTPUT"
            echo "integrated_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"
            echo "mode=$FINAL_MODE" >> "$GITHUB_OUTPUT"
          else
            echo "lab_branch=$ANALYZE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "integration_applied=$ANALYZE_APPLIED" >> "$GITHUB_OUTPUT"
            echo "integrated_head=$ANALYZE_HEAD" >> "$GITHUB_OUTPUT"
            echo "mode=$ANALYZE_MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Imposta JDK 21
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Imposta Gradle cache
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        uses: gradle/actions/setup-gradle@v4

      - name: Prepara protobuf
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        uses: ./.github/actions/setup-protobuf

      - name: Test regressione JVM MusicLab
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        shell: bash
        env:
          MELD_UPSTREAM_BASELINE: ${{ steps.resolve.outputs.target_version }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: ./gradlew --console=plain :app:testFossDebugUnitTest :innertube:testDebugUnitTest --warning-mode summary

      - name: Crea keystore debug temporaneo
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepara UAB LAB
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        shell: bash
        env:
          TAG_SLUG: ${{ steps.resolve.outputs.tag_slug }}
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat > /tmp/uab-meld.env <<EOF
          UAB_TASK=":app:assembleFossDebug"
          UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"
          UAB_OUTPUT_NAME="MusicLab-LAB-MELD-${TAG_SLUG}-${GITHUB_RUN_NUMBER}"
          UAB_GRADLE_ARGS="-x lint"
          UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"
          UAB_PARALLEL_INSTALL="on"
          UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.lab"
          UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"
          UAB_APP_NAME_BASE="MusicLab LAB Meld"
          UAB_APP_NAME_ENV="METROLIST_APP_NAME"
          export PULL_REQUEST="false"
          EOF

      - name: Build LAB isolata via UAB
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-meld.env
          UAB_BUILD_ID: meld${{ steps.resolve.outputs.tag_id }}_${{ github.run_number }}
          MELD_UPSTREAM_BASELINE: ${{ steps.resolve.outputs.target_version }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .

      - name: Verifica APK e ZIP
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        id: package
        shell: bash
        env:
          TAG_SLUG: ${{ steps.resolve.outputs.tag_slug }}
          TAG_ID: ${{ steps.resolve.outputs.tag_id }}
        run: |
          set -euo pipefail
          BASE_NAME="MusicLab-LAB-MELD-${TAG_SLUG}-${GITHUB_RUN_NUMBER}"
          APK="dist/uab/apk/${BASE_NAME}.apk"
          ZIP="dist/uab/${BASE_NAME}-APK.zip"
          test -f "$APK"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='it.verlezza.musiclab.lab.meld${TAG_ID}_${GITHUB_RUN_NUMBER}'" /tmp/badging.txt
          sha256sum "$APK" "$ZIP" | tee dist/uab/SHA256SUMS.txt
          echo "base_name=$BASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Pubblica APK + ZIP
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.base_name }}
          path: |
            dist/uab/apk/${{ steps.package.outputs.base_name }}.apk
            dist/uab/${{ steps.package.outputs.base_name }}-APK.zip
            dist/uab/SHA256SUMS.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Registra baseline verificata nella LAB
        if: steps.ctx.outputs.integration_applied == 'true' && inputs.build_when_safe
        id: state
        shell: bash
        env:
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          TARGET_COMMIT: ${{ steps.resolve.outputs.target_commit }}
          LAB_BRANCH: ${{ steps.ctx.outputs.lab_branch }}
          INTEGRATED_HEAD: ${{ steps.ctx.outputs.integrated_head }}
          ARTIFACT_NAME: ${{ steps.package.outputs.base_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/meld_record_verified_integration.py \
            --config .github/upstream/meld.json \
            --ledger .github/upstream/meld-integrations.json \
            --tag "$TARGET_TAG" \
            --upstream-commit "$TARGET_COMMIT" \
            --branch "$LAB_BRANCH" \
            --musiclab-head "$INTEGRATED_HEAD" \
            --build-run-id "$GITHUB_RUN_ID" \
            --artifact-name "$ARTIFACT_NAME"
          git add .github/upstream/meld.json .github/upstream/meld-integrations.json
          if ! git diff --cached --quiet; then
            git commit -m "LAB: registra baseline Meld $TARGET_TAG verificata"
            git push origin "HEAD:refs/heads/$LAB_BRANCH"
          fi
          echo "state_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Riepilogo
        if: always()
        shell: bash
        run: |
          {
            echo "# MusicLab — Meld Upstream Guardian"
            echo
            echo "- Modalita' richiesta: ${{ inputs.mode }}"
            echo "- Upstream: FrancescoGrazioso/Meld"
            echo "- MetroList diretto: DISATTIVATO"
            echo "- Baseline iniziale: ${{ steps.cfg.outputs.baseline_tag }} (${{ steps.cfg.outputs.baseline_commit }})"
            echo "- Target: ${{ steps.resolve.outputs.target_tag }} (${{ steps.resolve.outputs.target_commit }})"
            echo "- Nessun aggiornamento: ${{ steps.resolve.outputs.no_update }}"
            echo "- LAB: ${{ steps.ctx.outputs.lab_branch }}"
            echo "- Modalita' integrazione: ${{ steps.ctx.outputs.mode }}"
            echo "- Stato finale LAB: ${{ steps.state.outputs.state_head }}"
            if [ -f upstream-review/CLASSIFICATION.md ]; then
              echo
              cat upstream-review/CLASSIFICATION.md
            fi
            echo
            echo "## Regole di promozione"
            echo "- Nessuna CANDIDATA viene creata da questo workflow."
            echo "- Nessuna MADRE viene modificata da questo workflow."
            echo "- CANDIDATA → MADRE richiede approvazione esplicita di Bruno."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica rapporto upstream
        if: inputs.mode == 'analyze' && steps.resolve.outputs.no_update != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meld-upstream-review-${{ steps.resolve.outputs.tag_slug }}-${{ github.run_number }}
          path: upstream-review/
          retention-days: 30
