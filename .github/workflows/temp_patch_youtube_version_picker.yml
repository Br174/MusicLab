          def upsert_string(xml, key, value):
              pat = re.compile(rf'\s*<string name="{re.escape(key)}">.*?</string>')
              entry = f'    <string name="{key}">{value}</string>'
              if pat.search(xml):
                  return pat.sub('\n' + entry, xml, count=1)
              if '</resources>' not in xml:
                  raise SystemExit(f'No resources closing tag for {key}')
              return xml.replace('</resources>', entry + '\n</resources>', 1)

