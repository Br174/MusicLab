name: TEMP LAB11 Cloudflare Preflight
on:
  push:
    branches:
      - uab-build/musiclab-global-ai-engine-11
permissions:
  contents: read
concurrency:
  group: musiclab-lab11-cloudflare-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'LAB11 Cloudflare preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica credenziali senza mostrarle
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "MOTORLAB_BLOCKER=CLOUDFLARE_API_TOKEN_MISSING"; missing=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "MOTORLAB_BLOCKER=CLOUDFLARE_ACCOUNT_ID_MISSING"; missing=1; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "MOTORLAB_BLOCKER=GEMINI_API_KEY_MISSING"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 2; fi
          echo "MOTORLAB_PREFLIGHT_SECRETS=OK"
      - name: Installa Wrangler
        if: success()
        working-directory: cloudflare/music-intelligence
        run: npm install
      - name: Verifica accesso Cloudflare
        if: success()
        working-directory: cloudflare/music-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami
