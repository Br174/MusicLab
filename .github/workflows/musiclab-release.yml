name: MusicLab - Publish Stable Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione MusicLab, es. 1.0.0"
        required: true
        type: string
      source_ref:
        description: "Ref sorgente approvato (MADRE/CANDIDATA)"
        required: true
        default: "mother/musiclab-swipe-fluid-play-01"
        type: string

permissions:
  contents: write

concurrency:
  group: musiclab-stable-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Verifica segreti firma senza mostrarli
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!n:-}" ]; then echo "::error::$n mancante"; exit 2; fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Calcola versionCode monotono
        shell: bash
        run: |
          echo "MUSICLAB_CODE=$((20000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Compila MusicLab stabile
        shell: bash
        env:
          METROLIST_APPLICATION_ID: it.verlezza.musiclab
          METROLIST_APP_NAME: MusicLab
          MUSICLAB_VERSION_NAME: ${{ inputs.version }}
          MUSICLAB_VERSION_CODE: ${{ env.MUSICLAB_CODE }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: ./gradlew --no-configuration-cache --console=plain assembleFossRelease -x lint
      - name: Firma con identita permanente MusicLab
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0
      - name: Prepara asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_files
          APK=$(find app/build/outputs/apk/foss/release -name '*-signed.apk' -o -name '*-unsigned-signed.apk' | head -1)
          test -n "$APK"
          cp "$APK" release_files/MusicLab.apk
          sha256sum release_files/MusicLab.apk > release_files/SHA256SUMS.txt
      - name: Pubblica release MusicLab
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="musiclab-v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_files/MusicLab.apk release_files/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" release_files/MusicLab.apk release_files/SHA256SUMS.txt \
              --title "MusicLab ${{ inputs.version }}" \
              --notes "Aggiornamento stabile MusicLab. Sorgente: ${{ inputs.source_ref }}. Upstream Meld viene integrato solo dopo revisione MotorLab."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Stable-${{ inputs.version }}
          path: release_files/
          retention-days: 30
