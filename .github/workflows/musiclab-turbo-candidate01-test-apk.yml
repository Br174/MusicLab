name: MusicLab Turbo CANDIDATA 01 - isolated test APK and ZIP
on:
  push:
    branches:
      - candidate-prep/musiclab-turbo-lab46-manual-sync-c01-20261023
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musiclab-candidate01-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate-verify-and-build:
    name: candidate01-isolated-full-gate-and-apk
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CRASH_REPORT_TOKEN: ''
      CRASH_REPORT_REPO: ''
      LASTFM_API_KEY: ''
      LASTFM_SECRET: ''
    steps:
      - name: Checkout exact candidate-preparation source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify origin, candidate-only delta and protected native source
        shell: bash
        run: |
          set -euo pipefail
          LAB=dbfed95eae0a40a13e4c103031ea75481054a638
          git cat-file -e "$LAB^{commit}"
          git diff --name-only "$LAB"..HEAD > /tmp/candidate-changes.txt
          while IFS= read -r f; do
            case "$f" in
              MOTORLAB_PROJECT_HOOK.txt|.motorlab/MOTORLAB_SYNC_STATE.txt|.motorlab/MOTORLAB_LOCAL_CORE.txt|.motorlab/MOTORLAB_LOCAL_CORE_LAST_GOOD.txt|.motorlab/MOTORLAB_BOOT_CAPSULE.txt|app/src/main/AndroidManifest.xml|app/src/main/kotlin/com/metrolist/music/ui/component/Lab46StagingSignedTransport.kt|tools/universal-apk-builder/prepare-turbo-candidate01-test-env.py|cloudflare/music-intelligence/test/turbo-candidate01-isolation-contract.test.mjs|.github/workflows/musiclab-turbo-candidate01-test-apk.yml|.uab/candidates/CANDIDATE_TURBO_LAB46_C01_20261023.txt) ;;
              *) echo "UNAPPROVED CANDIDATE CHANGE: $f"; exit 1;;
            esac
          done </tmp/candidate-changes.txt
          for f in app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverSameWorkGate.kt app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt app/src/main/kotlin/com/metrolist/music/ui/component/Lab46ManualSyncActivity.kt; do
            test "$(git hash-object "$f")" = "$(git rev-parse "$LAB:$f")"
          done
          grep -Fq 'RELEASE=2026.10.22-r38' .motorlab/MOTORLAB_BOOT_CAPSULE.txt
          grep -Fq 'RELEASE=2026.10.14-r37' .motorlab/MOTORLAB_LOCAL_CORE_LAST_GOOD.txt
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='dbfed95eae0a40a13e4c103031ea75481054a638'
          p='app/src/main/AndroidManifest.xml'
          old=subprocess.check_output(['git','show',f'{base}:{p}'],text=True)
          now=Path(p).read_text()
          before='android:name=".ui.component.Lab46OwnerPairingActivity"\n            android:exported="true"'
          after='android:name=".ui.component.Lab46OwnerPairingActivity"\n            android:enabled="false"\n            android:exported="true"'
          assert old.count(before)==1
          assert now==old.replace(before,after)
          p='app/src/main/kotlin/com/metrolist/music/ui/component/Lab46StagingSignedTransport.kt'
          old=subprocess.check_output(['git','show',f'{base}:{p}'],text=True)
          now=Path(p).read_text()
          guard='if (com.metrolist.music.BuildConfig.APPLICATION_ID =='
          assert guard in now and 'return@withContext Result.NOT_PAIRED' in now
          assert old in now.replace('        // CANDIDATA 01 is a new Android family with NO staging enrollment.\n        // There is no Cloud submission until owner separately approves an\n        // authenticated candidate pairing and the release gate is rebuilt.\n        if (com.metrolist.music.BuildConfig.APPLICATION_ID ==\n            "it.verlezza.musiclab.candidate01") return@withContext Result.NOT_PAIRED\n','')
          print("Candidate source: only new app identity, test-signing and disabled Cloud enrollment; player/Cover identical")
          PY
      - name: Run 195 retained LAB32-LAB45 regressions
        run: |
          node --test             cloudflare/music-intelligence/test/turbo-lab24-audio-fair-original.test.mjs             cloudflare/music-intelligence/test/turbo-lab25-archive-refresh-video-fair.test.mjs             cloudflare/music-intelligence/test/turbo-lab26-video-coverage-scheduler.test.mjs             cloudflare/music-intelligence/test/turbo-lab27-video-first-batch-refill.test.mjs             cloudflare/music-intelligence/test/turbo-lab28-crash-guards.test.mjs             cloudflare/music-intelligence/test/turbo-lab29-cover-ui-gesture.test.mjs             cloudflare/music-intelligence/test/turbo-lab30-theme-selected-cover.test.mjs             cloudflare/music-intelligence/test/turbo-lab31-readonly-audio-diagnostics.test.mjs             cloudflare/music-intelligence/test/turbo-lab32-header-spacing-arrow.test.mjs cloudflare/music-intelligence/test/turbo-lab34-approved-cover-header.test.mjs cloudflare/music-intelligence/test/turbo-lab35-five-filters-fit.test.mjs cloudflare/music-intelligence/test/turbo-lab36-final-approved-cover.test.mjs cloudflare/music-intelligence/test/turbo-lab37-slim-chips-only.test.mjs cloudflare/music-intelligence/test/turbo-lab38-compilation-theme-nav.test.mjs cloudflare/music-intelligence/test/turbo-lab39-unified-nav-colors-labels.test.mjs cloudflare/music-intelligence/test/turbo-lab40-work-identity-speed-artwork.test.mjs cloudflare/music-intelligence/test/turbo-lab41-verified-work-expansion.test.mjs cloudflare/music-intelligence/test/turbo-lab42-evidence-recovery.test.mjs cloudflare/music-intelligence/test/turbo-lab43-song-identity-refresh.test.mjs cloudflare/music-intelligence/test/turbo-lab44-manual-priority-work-refs.test.mjs cloudflare/music-intelligence/test/turbo-lab45-separated-actions-progressive-rounds.test.mjs cloudflare/music-intelligence/test/turbo-lab45-persistent-rounds.test.mjs
      - name: Run 48 LAB46 and native consent contracts
        run: |
          node --test cloudflare/music-intelligence/test/turbo-lab46-cloud-complete-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-round-strategy-score100-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-staging-auth-outbox.test.mjs cloudflare/music-intelligence/test/turbo-lab46-cloud-roundtrip.test.mjs cloudflare/music-intelligence/test/turbo-lab46-sync-receipt.test.mjs cloudflare/music-intelligence/test/turbo-lab46-recording-identity.test.mjs cloudflare/music-intelligence/test/turbo-lab46-manual-sync-native-contract.test.mjs
      - name: Candidate no-network/no-association contract
        run: node --test cloudflare/music-intelligence/test/turbo-candidate01-isolation-contract.test.mjs
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Setup project protobuf tools
        uses: ./.github/actions/setup-protobuf
      - name: Prepare candidate identity and unique EPHEMERAL test keystore
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-candidate01-test-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.candidate01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="10001"' uab-project.env
          grep -Fq 'UAB_FAMILY_SIGNING_KEY_B64_FILE=".uab/signing/musiclab-candidate01-build-only.jks.b64"' uab-project.env
          keytool -genkeypair -alias candidate_c01_test -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=MusicLab CANDIDATA 01 Test, OU=LAB, O=MusicLab, C=IT" \
            -storetype JKS -keystore .uab/signing/musiclab-candidate01-build-only.jks \
            -storepass android -keypass android -noprompt >/dev/null 2>&1
          base64 -w0 .uab/signing/musiclab-candidate01-build-only.jks > .uab/signing/musiclab-candidate01-build-only.jks.b64
          test -s .uab/signing/musiclab-candidate01-build-only.jks.b64
          # Test-only private signing key stays inside this disposable runner.
      - name: Full Android JVM suite (no remote sync)
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary
      - name: Build candidate APK and companion ZIP
        run: bash tools/universal-apk-builder/build-apk.sh .
      - name: Independently verify distinct candidate family and test-signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/uab
          APK=dist/uab/apk/MusicLab-Turbo-CANDIDATA01.apk
          ZIP=dist/uab/MusicLab-Turbo-CANDIDATA01-APK.zip
          test -s "$APK"; test -s "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.candidate01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='10001'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab CANDIDATA 01'"
          "$APKSIGNER" verify --verbose "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | grep -i -m1 'certificate SHA-256 digest:' | sed -E 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          LAB_CERT=9A2F67CFB3C19983613ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749
          test "${#CERT}" -eq 64
          test "$CERT" != "$LAB_CERT"
          {
            echo "CANDIDATE=CANDIDATA_01_TEST_ONLY"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "APPLICATION_ID=it.verlezza.musiclab.candidate01"
            echo "VERSION_CODE=10001"
            echo "SIGNING_CERT_SHA256=$CERT"
            echo "LAB_CERT_REUSED=no"
            echo "CANDIDATE_SIGNING=EPHEMERAL_TEST_ONLY_NOT_PROMOTABLE_TO_MADRE"
            echo "STAGING_PAIRING=DISABLED"
            echo "STAGING_MUSICAL_POST=BLOCKED_BY_APP_ID"
            echo "PRODUCTION_AND_MAIN=UNMODIFIED"
            echo "PRIVATE_SIGNING_KEY_STORED=false"
          } > dist/uab/CANDIDATE_PROVENANCE.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
          echo "CANDIDATA 01 test-only candidate signing cert: $CERT"
      - name: Destroy test-only signing material (even on failure)
        if: always()
        shell: bash
        run: |
          rm -f .uab/signing/musiclab-candidate01-build-only.jks .uab/signing/musiclab-candidate01-build-only.jks.b64
          rm -rf dist/uab/.signing
      - name: Deliver isolated APK + ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-CANDIDATA01-TEST
          path: |
            dist/uab/apk/MusicLab-Turbo-CANDIDATA01.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-CANDIDATA01-APK.zip
            dist/uab/CANDIDATE_PROVENANCE.txt
            dist/uab/BUILD_SHA.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
