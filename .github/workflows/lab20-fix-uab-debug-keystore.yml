name: LAB20 One-shot UAB debug keystore fix

on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - '.github/workflows/lab20-fix-uab-debug-keystore.yml'

permissions:
  contents: write

concurrency:
  group: lab20-one-shot-uab-debug-keystore
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: uab-build/musiclab-ai-brain-20

      - name: Patch UAB missing debug keystore recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/universal-apk-builder/build-apk.sh')
          text = path.read_text()
          function_anchor = 'run_hook() {\n'
          function_lines = [
              'ensure_debug_keystore() {',
              '  local keystore="${UAB_DEBUG_KEYSTORE:-$HOME/.android/debug.keystore}"',
              '  [[ -f "$keystore" ]] && return 0',
              '',
              '  command -v keytool >/dev/null 2>&1 || fail "debug.keystore assente e keytool non disponibile per generarlo." 26',
              '  mkdir -p "$(dirname "$keystore")"',
              '  status "debug.keystore assente: genero automaticamente il keystore Android debug standard."',
              '  keytool -genkeypair \\',
              '    -keystore "$keystore" \\',
              '    -storepass android \\',
              '    -alias androiddebugkey \\',
              '    -keypass android \\',
              '    -dname "CN=Android Debug,O=Android,C=US" \\',
              '    -keyalg RSA \\',
              '    -keysize 2048 \\',
              '    -validity 10000 \\',
              '    -noprompt >/dev/null 2>&1 || fail "Impossibile generare il debug.keystore standard." 26',
              '  [[ -s "$keystore" ]] || fail "debug.keystore generato ma non valido." 26',
              '  status "debug.keystore pronto: $keystore"',
              '}',
              '',
              'run_hook() {',
          ]
          function_block = '\n'.join(function_lines) + '\n'
          if text.count(function_anchor) != 1:
              raise SystemExit(f'Expected one run_hook anchor, found {text.count(function_anchor)}')
          text = text.replace(function_anchor, function_block, 1)
          call_anchor = 'run_hook "Pre-build" "${UAB_PRE_BUILD_SCRIPT:-}" "$PROJECT_ROOT/.uab/pre-build.sh"\n\nset +e\n'
          call_block = 'run_hook "Pre-build" "${UAB_PRE_BUILD_SCRIPT:-}" "$PROJECT_ROOT/.uab/pre-build.sh"\nensure_debug_keystore\n\nset +e\n'
          if text.count(call_anchor) != 1:
              raise SystemExit(f'Expected one pre-build anchor, found {text.count(call_anchor)}')
          text = text.replace(call_anchor, call_block, 1)
          path.write_text(text)
          PY
          bash -n tools/universal-apk-builder/build-apk.sh
          git diff --check
          grep -n -A25 -B2 'ensure_debug_keystore' tools/universal-apk-builder/build-apk.sh

      - name: Commit only UAB root-cause fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/universal-apk-builder/build-apk.sh
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'tools/universal-apk-builder/build-apk.sh'
          git commit -m 'fix(uab): self-heal missing Android debug keystore'
          git push origin HEAD:uab-build/musiclab-ai-brain-20
