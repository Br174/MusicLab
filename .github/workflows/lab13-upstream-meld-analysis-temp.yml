name: TEMP LAB13 Meld Upstream Analysis
on:
  push:
    branches:
      - uab-build/musiclab-upstream-meld-092-13
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-upstream-meld-092-13
          fetch-depth: 0
      - name: Analyze Meld v0.9.2 merge
        shell: bash
        run: |
          set -u
          git config user.name "MotorLab Upstream Analyzer"
          git config user.email "actions@users.noreply.github.com"
          git remote add meld https://github.com/FrancescoGrazioso/Meld.git
          git fetch meld refs/tags/v0.9.2:refs/tags/meld-v0.9.2
          UPSTREAM="refs/tags/meld-v0.9.2"
          BASE="$(git merge-base HEAD "$UPSTREAM")"
          git diff --name-only "$BASE"..HEAD | sort -u > /tmp/musiclab.txt
          git diff --name-only "$BASE".."$UPSTREAM" | sort -u > /tmp/meld.txt
          comm -12 /tmp/musiclab.txt /tmp/meld.txt > /tmp/both.txt || true
          MERGE_RC=0
          git merge --no-commit --no-ff "$UPSTREAM" || MERGE_RC=$?
          git diff --name-only --diff-filter=U | sort -u > /tmp/conflicts.txt || true
          echo "COMMON_BASE=$BASE"
          echo "MUSICLAB_CHANGED=$(wc -l < /tmp/musiclab.txt)"
          echo "MELD_CHANGED=$(wc -l < /tmp/meld.txt)"
          echo "BOTH_CHANGED=$(wc -l < /tmp/both.txt)"
          echo "REAL_CONFLICTS=$(wc -l < /tmp/conflicts.txt)"
          echo "MERGE_RC=$MERGE_RC"
          echo "--- REAL CONFLICTS ---"
          cat /tmp/conflicts.txt || true
          echo "--- BOTH CHANGED ---"
          cat /tmp/both.txt || true
          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            git merge --abort || true
          else
            git reset --hard HEAD
          fi
          exit 0
