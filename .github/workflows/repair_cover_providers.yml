name: Repair cover providers

on:
  push:
    paths:
      - 'tools/repair_cover_providers.py'
      - '.github/workflows/repair_cover_providers.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-cover-repair-from-build52
          fetch-depth: 0

      - name: Apply repair script
        run: python3 tools/repair_cover_providers.py

      - name: Commit repaired sources
        run: |
          git config user.name "Br174"
          git config user.email "brunoverlezza@gmail.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverHubSearchEngine.kt \
                  app/src/main/kotlin/com/metrolist/music/ui/component/MusicBrainzCoverSource.kt \
                  app/src/main/kotlin/com/metrolist/music/ui/component/CreditsFmCoverSource.kt \
                  app/src/main/kotlin/com/metrolist/music/ui/component/CoverInfoCoverSource.kt
          git diff --cached --check
          git commit -m "fix(covers): isolate new providers and restore MusicBrainz resilience"
          git push origin HEAD:lab-cover-repair-from-build52
