name: TEMP LAB13 Runtime Updater Patch

on:
  push:
    branches:
      - uab-build/musiclab-upstream-meld-guardian-13

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'LAB13 runtime updater patch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-upstream-meld-guardian-13
          fetch-depth: 0
      - name: Applica correzione updater runtime
        run: python3 tools/upstream-meld/lab13_runtime_patch.py
      - name: Verifica che Meld APK non sia piu usato dai menu
        shell: bash
        run: |
          if grep -R "getDownloadUrlForCurrentVariant(releaseInfo)" \
            app/src/main/kotlin/com/metrolist/music/MainActivity.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AccountSettings.kt; then
            echo "Direct Meld APK action still present"
            exit 1
          fi
          grep -R "getUpstreamReleasePageUrl" \
            app/src/main/kotlin/com/metrolist/music/MainActivity.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AccountSettings.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MusicLab LAB bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/kotlin/com/metrolist/music/MainActivity.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AccountSettings.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/ChangelogScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/UpdaterSettings.kt
          git commit -m "LAB13: separa notifiche Meld dagli aggiornamenti APK MusicLab"
          git push origin HEAD:uab-build/musiclab-upstream-meld-guardian-13
