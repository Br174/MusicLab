name: Build MusicLab LAB APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab-apk
  cancel-in-progress: true

jobs:
  build:
    name: MusicLab LAB APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Prepare stable LAB signing key
        shell: bash
        run: |
          echo '' | base64 --decode > app/persistent-debug.keystore
          chmod +x gradlew

      - name: Build one LAB APK
        shell: bash
        env:
          METROLIST_APPLICATION_ID: it.verlezza.musiclab.lab
          METROLIST_APP_NAME: MusicLab LAB
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: workflow_dispatch
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: ./gradlew :app:assembleFossDebug --console=plain --warning-mode summary -x lint

      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/foss/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/MusicLab-LAB.apk
          cd dist
          sha256sum MusicLab-LAB.apk > MusicLab-LAB.sha256
          zip -9 MusicLab-LAB-APK.zip MusicLab-LAB.apk MusicLab-LAB.sha256
          unzip -t MusicLab-LAB-APK.zip

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB
          path: |
            dist/MusicLab-LAB.apk
            dist/MusicLab-LAB.sha256
            dist/MusicLab-LAB-APK.zip
          if-no-files-found: error
          retention-days: 14
