name: Universal APK Builder - GitHub fallback

on:
  workflow_dispatch:
  push:
    branches:
      - lab-cover-repair-from-build52
    paths:
      - ".github/workflows/build_quick.yml"

permissions:
  contents: write

concurrency:
  group: uab-musiclab-github-fallback
  cancel-in-progress: true

jobs:
  build:
    name: UAB MusicLab LAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare LAB debug signing
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > app/persistent-debug.keystore
            chmod 600 app/persistent-debug.keystore
            echo "Using persistent debug keystore from repository secret"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using standard ephemeral Android debug keystore for parallel-install LAB"
          fi

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Prepare stable Android delivery assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/uab/stable

          APK="$(find dist/uab/apk -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          test -s "$APK"

          # APK is itself a ZIP container. This catches truncated/corrupted APKs.
          unzip -tq "$APK" >/dev/null

          APK_SIZE="$(stat -c%s "$APK")"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "APK unexpectedly small: $APK_SIZE bytes" >&2
            exit 31
          fi

          cp "$APK" dist/uab/stable/MusicLab-LAB-LATEST.apk

          python3 <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('dist/uab/stable/MusicLab-LAB-LATEST.apk')
          out = Path('dist/uab/stable/MusicLab-LAB-LATEST.zip')
          data = apk.read_bytes()

          info = zipfile.ZipInfo('MusicLab.apk', date_time=(2026, 1, 1, 0, 0, 0))
          info.create_system = 0
          info.compress_type = zipfile.ZIP_STORED
          info.external_attr = 0
          info.extra = b''
          info.comment = b''

          with zipfile.ZipFile(out, 'w', allowZip64=False) as zf:
              zf.writestr(info, data)

          with zipfile.ZipFile(out, 'r') as zf:
              assert zf.testzip() is None
              assert zf.namelist() == ['MusicLab.apk']
              assert len(zf.read('MusicLab.apk')) == len(data)
          PY

          (
            cd dist/uab/stable
            sha256sum MusicLab-LAB-LATEST.apk MusicLab-LAB-LATEST.zip > SHA256SUMS.txt
            unzip -tq MusicLab-LAB-LATEST.zip >/dev/null
            ls -lh MusicLab-LAB-LATEST.apk MusicLab-LAB-LATEST.zip SHA256SUMS.txt
          )

      - name: Publish stable UAB Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="uab-musiclab-lab-latest"
          TITLE="MusicLab LAB - Latest"
          NOTES_FILE="$(mktemp)"
          {
            echo "Authoritative UAB delivery for the latest MusicLab LAB."
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo
            echo "Use MusicLab-LAB-LATEST.apk for direct Android installation."
            echo "Use MusicLab-LAB-LATEST.zip only when a ZIP container is preferred."
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/uab/stable/MusicLab-LAB-LATEST.apk \
              dist/uab/stable/MusicLab-LAB-LATEST.zip \
              dist/uab/stable/SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              dist/uab/stable/MusicLab-LAB-LATEST.apk \
              dist/uab/stable/MusicLab-LAB-LATEST.zip \
              dist/uab/stable/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Upload temporary verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-UAB
          path: |
            dist/uab/stable/MusicLab-LAB-LATEST.apk
            dist/uab/stable/MusicLab-LAB-LATEST.zip
            dist/uab/stable/SHA256SUMS.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
