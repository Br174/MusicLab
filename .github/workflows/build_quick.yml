name: Universal APK Builder - GitHub fallback

on:
  workflow_dispatch:
  push:
    branches:
      - lab-cover-repair-from-build52
    paths:
      - ".github/workflows/build_quick.yml"

permissions:
  contents: read

concurrency:
  group: uab-musiclab-github-fallback
  cancel-in-progress: true

jobs:
  build:
    name: UAB MusicLab LAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare LAB debug signing
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > app/persistent-debug.keystore
            chmod 600 app/persistent-debug.keystore
            echo "Using persistent debug keystore from repository secret"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using standard ephemeral Android debug keystore for parallel-install LAB"
          fi

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-UAB
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
