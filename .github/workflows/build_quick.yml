name: UAB-CORE MusicLab adapter

on:
  workflow_dispatch:
  push:
    branches:
      - lab-cover-restart-from-build52
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
    paths:
      - ".github/workflows/build_quick.yml"
      - "app/**"
      - "tools/universal-apk-builder/**"
      - "uab-project.env"

permissions:
  contents: write

concurrency:
  group: uab-musiclab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: UAB MusicLab lifecycle adapter
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Progress 5% - accepted
        run: echo "[UAB_PROGRESS=5] MusicLab preso in carico da UAB-CORE-V1"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect lifecycle stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            mother/*) UAB_STAGE="MADRE" ;;
            candidate/*) UAB_STAGE="CANDIDATA" ;;
            lab/*|lab-*) UAB_STAGE="LAB" ;;
            *) UAB_STAGE="LAB" ;;
          esac
          echo "UAB_STAGE=$UAB_STAGE" >> "$GITHUB_ENV"
          echo "stage=$UAB_STAGE" >> "$GITHUB_OUTPUT"
          echo "[UAB_PROGRESS=15] Stage=$UAB_STAGE; MADRE di riferimento mother/musiclab-112726 protetta"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare isolated build signing
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > app/persistent-debug.keystore
            chmod 600 app/persistent-debug.keystore
            echo "Using persistent debug keystore from repository secret"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using ephemeral isolated-build debug keystore"
          fi
          echo "[UAB_PROGRESS=45] Firma e configurazione build pronte"

      - name: UAB preflight diagnostics
        shell: bash
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          echo "[UAB_PROGRESS=60] Cache, toolchain e preflight pronti"

      - name: Build APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Progress 75% - build complete
        run: echo "[UAB_PROGRESS=75] Compilazione $UAB_STAGE completata"

      - name: Verify lifecycle artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/uab/lifecycle
          APK="$(find dist/uab/apk -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          APK_SIZE="$(stat -c%s "$APK")"
          test "$APK_SIZE" -ge 10000000
          cp "$APK" "dist/uab/lifecycle/MusicLab-${UAB_STAGE}.apk"
          python3 <<'PY'
          from pathlib import Path
          import os, zipfile
          stage = os.environ['UAB_STAGE']
          apk = Path(f'dist/uab/lifecycle/MusicLab-{stage}.apk')
          out = Path(f'dist/uab/lifecycle/MusicLab-{stage}.zip')
          data = apk.read_bytes()
          info = zipfile.ZipInfo('MusicLab.apk', date_time=(2026, 1, 1, 0, 0, 0))
          info.create_system = 0
          info.compress_type = zipfile.ZIP_STORED
          info.external_attr = 0
          info.extra = b''
          info.comment = b''
          with zipfile.ZipFile(out, 'w', allowZip64=False) as zf:
              zf.writestr(info, data)
          with zipfile.ZipFile(out, 'r') as zf:
              assert zf.testzip() is None
              assert zf.namelist() == ['MusicLab.apk']
              assert zf.read('MusicLab.apk') == data
          PY
          (cd dist/uab/lifecycle && sha256sum "MusicLab-${UAB_STAGE}.apk" "MusicLab-${UAB_STAGE}.zip" > SHA256SUMS.txt)
          echo "[UAB_PROGRESS=85] APK/ZIP $UAB_STAGE verificati"

      - name: Upload temporary LAB/CANDIDATA artifact
        if: steps.stage.outputs.stage != 'MADRE'
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-${{ steps.stage.outputs.stage }}-${{ github.run_number }}
          path: |
            dist/uab/lifecycle/MusicLab-${{ steps.stage.outputs.stage }}.apk
            dist/uab/lifecycle/MusicLab-${{ steps.stage.outputs.stage }}.zip
            dist/uab/lifecycle/SHA256SUMS.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable MADRE release
        if: steps.stage.outputs.stage == 'MADRE'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_REF_NAME#mother/}"
          TAG="madre-${SUFFIX}"
          TITLE="MusicLab MADRE — ${SUFFIX}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La MADRE $TAG esiste già ed è immutabile."
            exit 41
          fi
          cp dist/uab/lifecycle/MusicLab-MADRE.apk "dist/uab/lifecycle/MusicLab-MADRE-${SUFFIX}.apk"
          cp dist/uab/lifecycle/MusicLab-MADRE.zip "dist/uab/lifecycle/MusicLab-MADRE-${SUFFIX}.zip"
          (
            cd dist/uab/lifecycle
            sha256sum "MusicLab-MADRE-${SUFFIX}.apk" "MusicLab-MADRE-${SUFFIX}.zip" > "SHA256SUMS-${SUFFIX}.txt"
          )
          cat > /tmp/mother-notes.md <<EOF
          MusicLab MADRE approvata: ${SUFFIX}
          Source commit: $GITHUB_SHA
          UAB-CORE-V1 immutable release.
          Le MADRI precedenti non vengono sostituite.
          EOF
          gh release create "$TAG" \
            "dist/uab/lifecycle/MusicLab-MADRE-${SUFFIX}.apk" \
            "dist/uab/lifecycle/MusicLab-MADRE-${SUFFIX}.zip" \
            "dist/uab/lifecycle/SHA256SUMS-${SUFFIX}.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file /tmp/mother-notes.md \
            --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,url,assets

      - name: Progress 95% - handoff/promotion ready
        shell: bash
        run: |
          if [ "$UAB_STAGE" = "MADRE" ]; then
            echo "[UAB_PROGRESS=95] MADRE immutabile pubblicata"
          else
            echo "[UAB_PROGRESS=95] Artefatto temporaneo $UAB_STAGE pronto; nessuna Release permanente modificata"
          fi

      - name: Progress 100% - complete
        run: echo "[UAB_PROGRESS=100] MusicLab UAB-CORE-V1 completato per stage $UAB_STAGE"
