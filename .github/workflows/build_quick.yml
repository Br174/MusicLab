name: UAB MusicLab LAB - artifact only

on:
  workflow_dispatch:
  push:
    branches:
      - lab-cover-restart-from-build52
    paths:
      - ".github/workflows/build_quick.yml"
      - "app/**"
      - "tools/universal-apk-builder/**"
      - "uab-project.env"

permissions:
  contents: read

concurrency:
  group: uab-musiclab-lab
  cancel-in-progress: true

jobs:
  build:
    name: UAB MusicLab LAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Progress 5% - accepted
        run: echo "[UAB_PROGRESS=5] LAB presa in carico"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Progress 15% - Mother baseline protected
        run: echo "[UAB_PROGRESS=15] LAB derivata dalla MADRE 112726; MADRE non modificata"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare LAB debug signing
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > app/persistent-debug.keystore
            chmod 600 app/persistent-debug.keystore
            echo "Using persistent debug keystore from repository secret"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using ephemeral LAB debug keystore"
          fi

      - name: UAB preflight diagnostics
        shell: bash
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          echo "[UAB_PROGRESS=60] Cache, firma LAB e preflight pronti"

      - name: Build APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Progress 75% - build complete
        run: echo "[UAB_PROGRESS=75] Compilazione LAB completata"

      - name: Verify temporary LAB artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/uab/lab
          APK="$(find dist/uab/apk -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          APK_SIZE="$(stat -c%s "$APK")"
          test "$APK_SIZE" -ge 10000000
          cp "$APK" dist/uab/lab/MusicLab-LAB-TEST.apk
          python3 <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('dist/uab/lab/MusicLab-LAB-TEST.apk')
          out = Path('dist/uab/lab/MusicLab-LAB-TEST.zip')
          data = apk.read_bytes()
          info = zipfile.ZipInfo('MusicLab.apk', date_time=(2026, 1, 1, 0, 0, 0))
          info.create_system = 0
          info.compress_type = zipfile.ZIP_STORED
          info.external_attr = 0
          info.extra = b''
          info.comment = b''
          with zipfile.ZipFile(out, 'w', allowZip64=False) as zf:
              zf.writestr(info, data)
          with zipfile.ZipFile(out, 'r') as zf:
              assert zf.testzip() is None
              assert zf.namelist() == ['MusicLab.apk']
              assert zf.read('MusicLab.apk') == data
          PY
          (cd dist/uab/lab && sha256sum MusicLab-LAB-TEST.apk MusicLab-LAB-TEST.zip > SHA256SUMS.txt)
          echo "[UAB_PROGRESS=85] APK/ZIP LAB verificati"

      - name: Upload temporary LAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-${{ github.run_number }}
          path: |
            dist/uab/lab/MusicLab-LAB-TEST.apk
            dist/uab/lab/MusicLab-LAB-TEST.zip
            dist/uab/lab/SHA256SUMS.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Progress 95% - LAB handoff ready
        run: echo "[UAB_PROGRESS=95] Artefatto LAB temporaneo pronto; nessuna Release MADRE modificata"

      - name: Progress 100% - complete
        run: echo "[UAB_PROGRESS=100] LAB verificata tecnicamente e consegnabile per test; promozione MADRE non eseguita"
