name: MusicLab Turbo LAB08 — Signed APK + ZIP Update First

on:
  push:
    branches:
      - uab-build/musiclab-turbo-lab08-apk-family-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-turbo-lab08-apk-family-02
  cancel-in-progress: false

jobs:
  validate:
    name: validate-once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout LAB08 two-phase source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run all 324 regression and LAB08 consistency contracts
        run: |
          # Older regression contracts deliberately pin Turbo LAB04's update
          # manifest; the application source under test is still LAB05.
          # Run the legacy suite against its immutable historical manifest,
          # then restore the LAB05 manifest for current-version tests/build.
          cp uab-project.env "$RUNNER_TEMP/turbo-lab06.env"
          cp app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt "$RUNNER_TEMP/turbo-lab06-browser.kt"
          cp app/src/main/kotlin/com/metrolist/music/ui/component/AppNavigation.kt "$RUNNER_TEMP/turbo-lab06-navigation.kt"
          # Historical assertions pin the exact LAB05 behavior and LAB04 family label.
          git show dec1876513a70a783f187ba5ddf3978e149db536:app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt > app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          git show dec1876513a70a783f187ba5ddf3978e149db536:app/src/main/kotlin/com/metrolist/music/ui/component/AppNavigation.kt > app/src/main/kotlin/com/metrolist/music/ui/component/AppNavigation.kt
          git show 969263ad60d74ef7dcf1d47d3aefccb01244bd83:uab-project.env > uab-project.env
          node --test cloudflare/music-intelligence/test/lab46-originals-retry-player-contract.test.mjs cloudflare/music-intelligence/test/lab46-red-retry-originals-player-contract.test.mjs cloudflare/music-intelligence/test/lab48-player-isolation-contract.test.mjs cloudflare/music-intelligence/test/lab49-cancellable-background-contract.test.mjs cloudflare/music-intelligence/test/lab50-direct-play-background-barrier-contract.test.mjs cloudflare/music-intelligence/test/lab51-cover-admission-score20-contract.test.mjs cloudflare/music-intelligence/test/lab52-cover-video-page-contract.test.mjs cloudflare/music-intelligence/test/lab53-cover-card-decisions-contract.test.mjs cloudflare/music-intelligence/test/lab54-cover-playback-pagination-card-contract.test.mjs cloudflare/music-intelligence/test/lab55-original-first-vertical-prefetch-playback-contract.test.mjs cloudflare/music-intelligence/test/lab56-opera-identity-collapsible-header-contract.test.mjs cloudflare/music-intelligence/test/lab57-work-ranking-playready-adaptive-audio-contract.test.mjs cloudflare/music-intelligence/test/lab58-compacted-ranked-fives-and-full-suite-contract.test.mjs cloudflare/music-intelligence/test/lab59-four-pillars-speed-fluidity-quantity-quality-contract.test.mjs cloudflare/music-intelligence/test/lab60-no-prestream-discogs-bounded-contract.test.mjs cloudflare/music-intelligence/test/lab61-ten-ranked-slots-playback-fluidity-contract.test.mjs cloudflare/music-intelligence/test/lab62-upstream-meld-player-and-cover-preview-contract.test.mjs cloudflare/music-intelligence/test/lab63-three-second-retry-stable-artwork-contract.test.mjs cloudflare/music-intelligence/test/lab64-ranked-video-original-first-cover-swipe-stability-contract.test.mjs cloudflare/music-intelligence/test/lab65-ready-only-five-immutable-ranking-no-audio-probe-contract.test.mjs cloudflare/music-intelligence/test/lab65b-direct-id-gate-background-recovery-contract.test.mjs cloudflare/music-intelligence/test/lab65c-bounded-partial-cover-batch-contract.test.mjs cloudflare/music-intelligence/test/lab66-fast-video-io-cached-artwork-fluid-ui-contract.test.mjs cloudflare/music-intelligence/test/lab67-parallel-metadata-nonblocking-video-previews.test.mjs cloudflare/music-intelligence/test/lab68-cloud-first-cache-player-fluidity-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab01-isolated-burst-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab02-global-burst.test.mjs cloudflare/music-intelligence/test/turbo-lab03-multisource-fifty.test.mjs cloudflare/music-intelligence/test/turbo-lab04-fast-complete-sources-contract.test.mjs
          cp "$RUNNER_TEMP/turbo-lab06.env" uab-project.env
          cp "$RUNNER_TEMP/turbo-lab06-browser.kt" app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          cp "$RUNNER_TEMP/turbo-lab06-navigation.kt" app/src/main/kotlin/com/metrolist/music/ui/component/AppNavigation.kt
          # LAB05's signing/version assertions must use LAB05's immutable manifest.
          git show dec1876513a70a783f187ba5ddf3978e149db536:uab-project.env > uab-project.env
          git show dec1876513a70a783f187ba5ddf3978e149db536:app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt > app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          node --test cloudflare/music-intelligence/test/turbo-lab05-audio-return-and-sealed-cleanup.test.mjs
          cp "$RUNNER_TEMP/turbo-lab06-browser.kt" app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          cp "$RUNNER_TEMP/turbo-lab06.env" uab-project.env
          # Use the exact LAB06 browser for its historical 10-test gate.
          cp app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt "$RUNNER_TEMP/turbo-lab07-browser.kt"
          git show 97f2ac5dd3c0c2b46d6355fd5b3072dbc376663c:app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt > app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          git show 97f2ac5dd3c0c2b46d6355fd5b3072dbc376663c:uab-project.env > uab-project.env
          node --test cloudflare/music-intelligence/test/turbo-lab06-five-second-audio-home-regression.test.mjs
          cp "$RUNNER_TEMP/turbo-lab06.env" uab-project.env
          cp "$RUNNER_TEMP/turbo-lab07-browser.kt" app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          cp app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt "$RUNNER_TEMP/turbo-lab08-browser.kt"
          # All 90 LAB07 tests pin the last verified LAB07 release source.
          git show ff0178a64fcb89e5d1c2f37a1ded00449a31b223:app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt > app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          node --test cloudflare/music-intelligence/test/turbo-lab07-strategy-portfolio.test.mjs cloudflare/music-intelligence/test/turbo-lab07-actual-flow-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab07-winner-regression.test.mjs cloudflare/music-intelligence/test/turbo-lab07-documented-direct-video.test.mjs cloudflare/music-intelligence/test/turbo-lab07-internal-memory-priority.test.mjs cloudflare/music-intelligence/test/turbo-lab07-fifty-song-evidence-and-load-safety.test.mjs cloudflare/music-intelligence/test/turbo-lab07-all-runners-five-second-seal.test.mjs cloudflare/music-intelligence/test/turbo-lab07-fifty-hit-stop-and-audio-isolation.test.mjs cloudflare/music-intelligence/test/turbo-lab07-final-redundancy-and-publisher-audit.test.mjs
          cp "$RUNNER_TEMP/turbo-lab08-browser.kt" app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt
          node --test cloudflare/music-intelligence/test/turbo-lab08-five-second-atomic-posters.test.mjs cloudflare/music-intelligence/test/turbo-lab08-ten-second-video-seal.test.mjs cloudflare/music-intelligence/test/turbo-lab08-id-ready-score-priority.test.mjs cloudflare/music-intelligence/test/turbo-lab08-final-lifecycle-and-redundancy.test.mjs

      - name: Verify LAB08 signing identity, update-in-place and version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="1008"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VISIBLE_NAME="Turbo LAB 08"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
          grep -Fq 'export METROLIST_APP_NAME="MusicLab Turbo LAB 08"' uab-project.env
          grep -Fq 'export MUSICLAB_VERSION_CODE="1008"' uab-project.env
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt)" = "03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"

      - name: Prove experimental player is exact upstream Meld (no LAB41 alternate resolver)
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_PATH="app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt"
          MELD_BLOB="03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"
          test "$(git hash-object "$PLAYER_PATH")" = "$MELD_BLOB"
          ! grep -q 'LAB07_FAST_LANE_TIMEOUT_MS' "$PLAYER_PATH"
          grep -q 'bundle().extractor.extract(' "$PLAYER_PATH"



  build-update:
    name: build-update-first
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact Turbo LAB08 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-overwrite-existing: true
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build Turbo LAB08
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify Turbo LAB08 update identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-Turbo-LAB08.apk"
          ZIP="dist/uab/MusicLab-Turbo-LAB08-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='1008'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab Turbo LAB 08'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=turbo01"
            echo "APPLICATION_ID=it.verlezza.musiclab.turbo01"
            echo "VERSION_CODE=1008"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "MELD_ORIGINAL_PLAYER_BLOB_SHA=03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"
            echo "MELD_UPSTREAM_COMMIT=9cb6105a5fe9077c6d4430b978209556f9405da3"
            echo "PAIRED_SAFETY=LAB68 unchanged; independent Turbo experimental family"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload Turbo LAB08 immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB08
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB08.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-LAB08-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload separate diagnostics if present
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB08-build-diagnostics
          path: dist/uab/logs/*.log
          if-no-files-found: ignore
