name: LAB31 Player Veloce Compilation UI Gate

on:
  push:
    branches:
      - uab-build/musiclab-player-veloce-compilation-ui-31
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab31-player-veloce-compilation-ui-gate
  cancel-in-progress: true

jobs:
  build:
    name: verify-and-build-lab31
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact LAB31 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record exact source SHA
        shell: bash
        run: |
          echo "LAB31 source: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify LAB31 source contract
        run: node --test cloudflare/music-intelligence/test/lab31-player-veloce-compilation-ui-contract.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android unit tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB31 APK and ZIP
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Stamp exact build SHA
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Verify deliverables
        shell: bash
        run: |
          test -s dist/uab/apk/MusicLab-LAB31.apk
          test -s dist/uab/MusicLab-LAB31-APK.zip
          test -s dist/uab/apk/SHA256SUMS.txt
          unzip -tq dist/uab/MusicLab-LAB31-APK.zip
          cat dist/uab/apk/SHA256SUMS.txt

      - name: Upload LAB31 APK ZIP and evidence
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB31
          path: |
            dist/uab/apk/MusicLab-LAB31.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB31-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
