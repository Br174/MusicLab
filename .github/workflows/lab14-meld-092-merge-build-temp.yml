name: TEMP LAB14 Robust Meld 0.9.2 Merge Build
on:
  push:
    branches:
      - uab-build/musiclab-meld-0.9.2-integration-14
permissions:
  contents: write
concurrency:
  group: musiclab-lab14-meld-092
  cancel-in-progress: false
jobs:
  merge-build:
    if: contains(github.event.head_commit.message, 'LAB14 robust merge Meld 0.9.2 retry 4')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-meld-0.9.2-integration-14
          fetch-depth: 0
          submodules: recursive

      - name: Fetch Meld v0.9.2
        run: git fetch https://github.com/FrancescoGrazioso/Meld.git refs/tags/v0.9.2:refs/tags/meld-v0.9.2

      - name: Merge ibrido Meld engine + MusicLab features
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MusicLab Upstream Integrator"
          git config user.email "upstream@musiclab.local"
          OUR_HEAD="$(git rev-parse HEAD)"

          set +e
          git merge --no-commit --no-ff meld-v0.9.2
          MERGE_RC=$?
          set -e
          echo "merge_rc=$MERGE_RC"

          # Infrastruttura di delivery sempre MusicLab.
          git rm -f --ignore-unmatch .github/workflows/release.yml || true
          git restore --source="$OUR_HEAD" --staged --worktree -- .github/workflows
          git restore --source="$OUR_HEAD" --staged --worktree -- .github/actions/setup-protobuf/action.yml || true
          git restore --source="$OUR_HEAD" --staged --worktree -- .gitmodules metroproto app/generate_proto.sh
          git restore --source="$OUR_HEAD" --staged --worktree -- .uab tools/universal-apk-builder uab-project.env || true

          # Personalizzazioni MusicLab che non devono essere perse.
          for p in \
            app/src/main/kotlin/com/metrolist/music/MainActivity.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/BottomSheet.kt \
            app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/utils/ShowMediaInfo.kt \
            app/src/main/kotlin/com/metrolist/music/utils/Updater.kt; do
            git restore --source="$OUR_HEAD" --staged --worktree -- "$p"
          done

          # Componenti che devono seguire l'architettura Meld/InnerTubeX nuova.
          for p in \
            app/src/main/kotlin/com/metrolist/music/App.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt \
            app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt \
            app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt \
            app/src/main/kotlin/com/metrolist/music/ui/menu/SongMenu.kt \
            app/src/main/kotlin/com/metrolist/music/ui/player/PlaybackError.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/PlayerSettings.kt \
            app/src/main/kotlin/com/metrolist/music/viewmodels/BackupRestoreViewModel.kt; do
            git show "meld-v0.9.2:$p" > "$p"
            git add "$p"
          done

          # Build system Meld 0.9.2 + identità/versionamento MusicLab.
          git show meld-v0.9.2:app/build.gradle.kts > app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          needle = 'val appNameOverride = System.getenv("METROLIST_APP_NAME")?.takeIf { it.isNotBlank() }\n'
          extra = '''val versionCodeOverride = System.getenv("MUSICLAB_VERSION_CODE")?.toIntOrNull()\nval versionNameOverride = System.getenv("MUSICLAB_VERSION_NAME")?.takeIf { it.isNotBlank() }\nval meldUpstreamBaseline = System.getenv("MELD_UPSTREAM_BASELINE")?.takeIf { it.isNotBlank() } ?: "0.8.9"\n'''
          if needle not in s: raise SystemExit('appNameOverride anchor missing')
          s = s.replace(needle, needle + extra, 1)
          s = s.replace('applicationId = applicationIdOverride ?: "com.meld.app"', 'applicationId = applicationIdOverride ?: "it.verlezza.musiclab"', 1)
          s = s.replace('versionCode = 28', 'versionCode = versionCodeOverride ?: 28', 1)
          s = s.replace('versionName = "0.9.2"', 'versionName = versionNameOverride ?: "0.9.2"', 1)
          s = s.replace('resValue("string", "app_name", appNameOverride ?: "Meld")', 'resValue("string", "app_name", appNameOverride ?: "MusicLab")', 1)
          arch = 'buildConfigField("String", "ARCHITECTURE", "\\"universal\\"")\n'
          if arch not in s: raise SystemExit('ARCHITECTURE anchor missing')
          s = s.replace(arch, arch + '        buildConfigField("String", "MELD_UPSTREAM_BASELINE", "\\"$meldUpstreamBaseline\\"")\n', 1)
          s = s.replace('?: System.getenv("CRASH_REPORT_REPO") ?: "francescograzioso/Meld"', '?: System.getenv("CRASH_REPORT_REPO") ?: "Br174/MusicLab"', 1)
          s = s.replace('resValue("string", "app_name", "Meld Debug")', 'resValue("string", "app_name", "MusicLab LAB")', 1)
          # Compatibilità per sorgenti legacy Cover ancora presenti ma non autoritativi.
          dep = '    implementation(libs.jsoup)\n'
          marker = '    implementation(libs.ktor.serialization.json)\n'
          if dep not in s:
              s = s.replace(marker, marker + '\n' + dep, 1)
          p.write_text(s)

          # Catalogo Meld + solo alias jsoup richiesto dai vecchi parser non attivi.
          c = Path('gradle/libs.versions.toml')
          t = c.read_text()
          if 'jsoup = ' not in t.split('[libraries]')[0]:
              t = t.replace('coil = "3.6.0"\n', 'coil = "3.6.0"\njsoup = "1.22.1"\n', 1)
          if 'jsoup = { module = "org.jsoup:jsoup"' not in t:
              t = t.replace('json = { module = "org.json:json", version.ref = "json" }\n', 'json = { module = "org.json:json", version.ref = "json" }\njsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }\n', 1)
          c.write_text(t)

          # Cover AI usa il menu Meld, che prende il NavController dal CompositionLocal.
          cover = Path('app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt')
          cs = cover.read_text()
          cs = cs.replace('                                                navController = navController,\n', '')
          cover.write_text(cs)
          PY
          git add app/build.gradle.kts gradle/libs.versions.toml app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt

          UNRESOLVED="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::Conflitti non risolti"
            echo "$UNRESOLVED"
            exit 3
          fi
          MODE="$(git ls-files -s metroproto | awk '{print $1}' | head -1)"
          test "$MODE" = "160000"
          if ! git diff --quiet "$OUR_HEAD" -- .github/workflows; then
            echo "::error::Workflow MusicLab alterati dal merge"
            exit 4
          fi

          git add -u
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' f; do
            case "$f" in .github/workflows/*|metroproto/*) ;; *) git add -- "$f" ;; esac
          done
          git commit -m "LAB14: integra motore Meld v0.9.2 con MusicLab"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Crea keystore debug temporaneo
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build diagnostico UAB con applicationId separato
        shell: bash
        env:
          UAB_BUILD_ID: meld092_14
          UAB_OUTPUT_NAME: MusicLab-LAB-MELD-092-14
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .
      - name: Push merge solo dopo build verde
        run: git push origin HEAD:uab-build/musiclab-meld-0.9.2-integration-14
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-MELD-092-14
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
