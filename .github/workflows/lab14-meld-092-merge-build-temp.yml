name: TEMP LAB14 Final Isolated Build
on:
  push:
    branches:
      - uab-build/musiclab-meld-0.9.2-integration-14
permissions:
  contents: read
concurrency:
  group: musiclab-lab14-meld-092-final
  cancel-in-progress: false
jobs:
  build:
    if: contains(github.event.head_commit.message, 'LAB14 final isolated build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b7eb6ae4afbfcb26f47a4f89b2252e0b9fab4d9
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Crea keystore debug temporaneo
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Verifica sorgente
        run: |
          git diff --check
          test "$(git rev-parse HEAD)" = "0b7eb6ae4afbfcb26f47a4f89b2252e0b9fab4d9"
      - name: Build LAB14 Meld 0.9.2 + AI con ID separato
        env:
          UAB_BUILD_ID: meld092_14
          UAB_OUTPUT_NAME: MusicLab-LAB-MELD-092-AI-14
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .
      - name: Verifica identità LAB
        shell: bash
        run: |
          grep -R "it.verlezza.musiclab.lab.meld092_14" dist/uab/logs || true
          test -f dist/uab/apk/MusicLab-LAB-MELD-092-AI-14.apk
          test -f dist/uab/MusicLab-LAB-MELD-092-AI-14-APK.zip
          unzip -tq dist/uab/MusicLab-LAB-MELD-092-AI-14-APK.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-MELD-092-AI-14-FINAL
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
