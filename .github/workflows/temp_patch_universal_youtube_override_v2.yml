name: TEMP - Restore universal YouTube override v2

on:
  push:
    branches:
      - 'uab-build/musiclab-playback-403-recovery-01'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Apply universal YouTube override
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mother/musiclab-swipe-fluid-play-01
          git checkout origin/mother/musiclab-swipe-fluid-play-01 -- app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          pref = Path('app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt')
          service = Path('app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt')
          menu = Path('app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt')
          helper = Path('app/src/main/kotlin/com/metrolist/music/playback/YouTubeMatchOverrides.kt')
          strings_it = Path('app/src/main/res/values-it/metrolist_strings.xml')

          p = pref.read_text()
          s = service.read_text()
          m = menu.read_text()
          it = strings_it.read_text()

          # Persistent key.
          key_anchor = 'val QobuzMatchOverridesKey = stringPreferencesKey("qobuzMatchOverrides")'
          if 'YouTubeMatchOverridesKey' not in p:
              if p.count(key_anchor) != 1:
                  raise SystemExit(f'Preference key anchor count={p.count(key_anchor)}')
              p = p.replace(
                  key_anchor,
                  key_anchor + '\nval YouTubeMatchOverridesKey = stringPreferencesKey("youtubeMatchOverrides")',
                  1,
              )

          # Small persistent map: original media id -> manually selected YouTube id.
          helper.write_text('''package com.metrolist.music.playback\n\nimport org.json.JSONObject\n\n/** Persistent manual mapping from an original YouTube media id to a user-selected replacement. */\nobject YouTubeMatchOverrides {\n    @Volatile private var cachedRaw: String? = null\n    @Volatile private var cachedMap: Map<String, String> = emptyMap()\n\n    fun decode(value: String?): MutableMap<String, String> {\n        if (value.isNullOrBlank()) return mutableMapOf()\n        val snapshot = if (value == cachedRaw) {\n            cachedMap\n        } else {\n            val parsed = runCatching {\n                val root = JSONObject(value)\n                buildMap<String, String> {\n                    root.keys().forEach { mediaId ->\n                        val target = root.optString(mediaId).takeIf { it.isNotBlank() }\n                        if (target != null) put(mediaId, target)\n                    }\n                }\n            }.getOrDefault(emptyMap())\n            cachedRaw = value\n            cachedMap = parsed\n            parsed\n        }\n        return LinkedHashMap(snapshot)\n    }\n\n    fun encode(overrides: Map<String, String>): String {\n        val root = JSONObject()\n        overrides.forEach { (mediaId, youtubeId) ->\n            if (mediaId.isNotBlank() && youtubeId.isNotBlank()) root.put(mediaId, youtubeId)\n        }\n        return root.toString()\n    }\n}\n''')

          # Service integration.
          import_anchor = 'import com.metrolist.music.constants.QobuzMatchOverridesKey\n'
          if 'import com.metrolist.music.constants.YouTubeMatchOverridesKey' not in s:
              if s.count(import_anchor) != 1:
                  raise SystemExit(f'MusicService import anchor count={s.count(import_anchor)}')
              s = s.replace(
                  import_anchor,
                  import_anchor + 'import com.metrolist.music.constants.YouTubeMatchOverridesKey\n',
                  1,
              )

          qobuz_doc_anchor = '    /**\n     * Returns the persisted manual Qobuz override for [mediaId], or null when\n'
          if 'fun setYouTubeMatchOverride(' not in s:
              if s.count(qobuz_doc_anchor) != 1:
                  raise SystemExit(f'Qobuz method anchor count={s.count(qobuz_doc_anchor)}')
              methods = '''    private fun resolveYouTubePlaybackId(mediaId: String): String =\n        YouTubeMatchOverrides.decode(dataStore.get(YouTubeMatchOverridesKey, ""))[mediaId]\n            ?.takeIf { it.isNotBlank() }\n            ?: mediaId\n\n    suspend fun getYouTubeMatchOverride(mediaId: String): String? =\n        withContext(Dispatchers.IO) {\n            YouTubeMatchOverrides.decode(dataStore.get(YouTubeMatchOverridesKey, ""))[mediaId]\n        }\n\n    /**\n     * Stores or clears a manual YouTube source override while keeping the original MediaItem.\n     * The original title, album, history identity and queue entry remain unchanged.\n     */\n    fun setYouTubeMatchOverride(mediaId: String, youtubeId: String?) {\n        if (mediaId.isBlank()) return\n        scope.launch(Dispatchers.IO) {\n            dataStore.edit { prefs ->\n                val current = YouTubeMatchOverrides.decode(prefs[YouTubeMatchOverridesKey])\n                if (youtubeId.isNullOrBlank() || youtubeId == mediaId) {\n                    current.remove(mediaId)\n                } else {\n                    current[mediaId] = youtubeId\n                }\n                prefs[YouTubeMatchOverridesKey] = YouTubeMatchOverrides.encode(current)\n            }\n\n            songUrlCache.remove(mediaId)\n            runCatching { playerCache.removeResource(mediaId) }\n            runCatching { downloadCache.removeResource(mediaId) }\n\n            withContext(Dispatchers.Main) {\n                if (::player.isInitialized && player.currentMediaItem?.mediaId == mediaId) {\n                    val currentIndex = player.currentMediaItemIndex\n                    val shouldPlay = player.playWhenReady\n                    player.stop()\n                    player.seekTo(currentIndex, 0L)\n                    player.prepare()\n                    if (shouldPlay) player.play()\n                }\n            }\n        }\n    }\n\n'''
              s = s.replace(qobuz_doc_anchor, methods + qobuz_doc_anchor, 1)

          # Send the replacement id to the YouTube resolver while preserving the original cache/media identity.
          pattern = re.compile(r'YTPlayerUtils\.playerResponseForPlayback\(\n(?P<indent>\s*)mediaId,')
          s, replace_count = pattern.subn(
              lambda x: 'YTPlayerUtils.playerResponseForPlayback(\n' + x.group('indent') + 'resolveYouTubePlaybackId(mediaId),',
              s,
          )
          if replace_count < 1 and 'resolveYouTubePlaybackId(mediaId)' not in s:
              raise SystemExit('No MusicService playback resolver calls were patched')

          # A user-selected YouTube source has priority over Qobuz for that track.
          create_anchor = '            val mediaId = stripQobuzCacheKeyPrefix(dataSpec.key ?: error("No media id"))\n'
          if 'val manualYouTubePlaybackId = resolveYouTubePlaybackId(mediaId)' not in s:
              if s.count(create_anchor) != 1:
                  raise SystemExit(f'createDataSource mediaId anchor count={s.count(create_anchor)}')
              s = s.replace(
                  create_anchor,
                  create_anchor + '            val manualYouTubePlaybackId = resolveYouTubePlaybackId(mediaId)\n',
                  1,
              )

          create_start = s.index('    private fun createDataSourceFactory(): DataSource.Factory')
          create_tail = s[create_start:]
          qobuz_if = '            if (qobuzEnabled) {'
          if 'if (qobuzEnabled && manualYouTubePlaybackId == mediaId)' not in create_tail:
              idx = create_tail.find(qobuz_if)
              if idx < 0:
                  raise SystemExit('Qobuz condition inside createDataSourceFactory not found')
              absolute = create_start + idx
              s = (
                  s[:absolute]
                  + '            if (qobuzEnabled && manualYouTubePlaybackId == mediaId) {'
                  + s[absolute + len(qobuz_if):]
              )

          # Dialog state for every non-local track.
          spotify_state_anchor = '''    val resolvedSpotifyMatch by produceState<com.metrolist.music.db.entities.SpotifyMatchEntity?>(\n        initialValue = null,\n        mediaMetadata.id,\n    ) {\n        kotlinx.coroutines.withContext(Dispatchers.IO) {\n            value = database.getSpotifyMatchByYouTubeId(mediaMetadata.id)\n        }\n    }\n'''
          if 'val manualYouTubeOverride by produceState<String?>' not in m:
              if m.count(spotify_state_anchor) != 1:
                  raise SystemExit(f'PlayerMenu Spotify state anchor count={m.count(spotify_state_anchor)}')
              manual_state = spotify_state_anchor + '''\n    val manualYouTubeOverride by produceState<String?>(\n        initialValue = null,\n        mediaMetadata.id,\n    ) {\n        value = playerConnection.service.getYouTubeMatchOverride(mediaMetadata.id)\n    }\n'''
              m = m.replace(spotify_state_anchor, manual_state, 1)

          old_current = '            currentYouTubeId = resolvedSpotifyMatch?.youtubeId,'
          new_current = '            currentYouTubeId = manualYouTubeOverride ?: resolvedSpotifyMatch?.youtubeId ?: mediaMetadata.id,'
          if old_current in m:
              m = m.replace(old_current, new_current, 1)
          elif new_current not in m:
              raise SystemExit('PlayerMenu currentYouTubeId anchor not found')

          onconfirm_pattern = re.compile(
              r'            onConfirm = \{ result ->\n.*?\n            \},\n            onDismiss = \{ showYouTubeMatchDialog = false \},',
              re.S,
          )
          new_onconfirm = '''            onConfirm = { result ->\n                playerConnection.service.setYouTubeMatchOverride(mediaMetadata.id, result.videoId)\n\n                // Keep the historic Spotify mapping in sync when this track came from Spotify.\n                resolvedSpotifyMatch?.spotifyId?.let { sid ->\n                    coroutineScope.launch(Dispatchers.IO) {\n                        mapper.overrideMatch(\n                            spotifyId = sid,\n                            youtubeId = result.videoId,\n                            title = result.title,\n                            artist = result.artist,\n                        )\n                    }\n                }\n            },\n            onDismiss = { showYouTubeMatchDialog = false },'''
          m, n = onconfirm_pattern.subn(new_onconfirm, m, count=1)
          if n != 1:
              raise SystemExit(f'PlayerMenu onConfirm replacement count={n}')

          # Remove the old conditional item from the top of the last menu group.
          old_start = '                        if (resolvedSpotifyMatch != null && !qobuzEnabled) {'
          if old_start in m:
              start = m.index(old_start)
              next_anchor = '\n                        if (qobuzEnabled) {'
              end = m.find(next_anchor, start)
              if end < 0:
                  raise SystemExit('Could not locate end of historic YouTube item')
              m = m[:start] + m[end + 1:]

          # Append the universal item as the final row of the PlayerMenu page.
          universal_marker = 'title = { Text(text = stringResource(R.string.change_youtube_version)) }'
          if universal_marker not in m:
              closing = '                    },\n            )\n        }\n    }\n}\n\n@Composable\nfun TempoPitchDialog'
              pos = m.rfind(closing)
              if pos < 0:
                  raise SystemExit('Final PlayerMenu buildList closing anchor not found')
              universal_item = '''                        if (!mediaMetadata.id.startsWith("local:")) {\n                            add(\n                                Material3MenuItemData(\n                                    title = { Text(text = stringResource(R.string.change_youtube_version)) },\n                                    description = { Text(text = stringResource(R.string.change_youtube_version_desc)) },\n                                    icon = {\n                                        Icon(\n                                            painter = painterResource(R.drawable.link),\n                                            contentDescription = null,\n                                            modifier = Modifier.size(24.dp),\n                                        )\n                                    },\n                                    onClick = { showYouTubeMatchDialog = true },\n                                ),\n                            )\n                        }\n'''
              m = m[:pos] + universal_item + m[pos:]

          # Italian wording for the menu and the historical dialog.
          translations = {
              'change_youtube_version': 'Cambia versione YouTube',
              'change_youtube_version_desc': 'Usa un altro video YouTube per questo brano',
              'current_match': 'Versione attuale',
              'new_match': 'Nuova versione',
              'paste_youtube_url': 'Incolla qui il link YouTube',
          }
          additions = []
          for key, value in translations.items():
              if f'name="{key}"' not in it:
                  additions.append(f'    <string name="{key}">{value}</string>')
          if additions:
              if '</resources>' not in it:
                  raise SystemExit('Italian strings closing tag not found')
              it = it.replace('</resources>', '\n' + '\n'.join(additions) + '\n</resources>', 1)

          pref.write_text(p)
          service.write_text(s)
          menu.write_text(m)
          strings_it.write_text(it)
          PY

          git diff --check

      - name: Targeted source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt').read_text()
          s = Path('app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt').read_text()
          m = Path('app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt').read_text()
          h = Path('app/src/main/kotlin/com/metrolist/music/playback/YouTubeMatchOverrides.kt').read_text()
          y = Path('app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt').read_text()
          it = Path('app/src/main/res/values-it/metrolist_strings.xml').read_text()
          checks = [
              ('preference key', 'YouTubeMatchOverridesKey' in p),
              ('persistent helper', 'object YouTubeMatchOverrides' in h),
              ('service setter', 'fun setYouTubeMatchOverride(' in s),
              ('service getter', 'getYouTubeMatchOverride' in s),
              ('resolver redirect', 'resolveYouTubePlaybackId(mediaId)' in s),
              ('manual YouTube priority', 'if (qobuzEnabled && manualYouTubePlaybackId == mediaId)' in s),
              ('universal menu item', 'if (!mediaMetadata.id.startsWith("local:"))' in m),
              ('dialog current id', 'manualYouTubeOverride ?: resolvedSpotifyMatch?.youtubeId ?: mediaMetadata.id' in m),
              ('universal override save', 'setYouTubeMatchOverride(mediaMetadata.id, result.videoId)' in m),
              ('Spotify mapping preserved', 'mapper.overrideMatch(' in m),
              ('Italian menu title', '<string name="change_youtube_version">Cambia versione YouTube</string>' in it),
              ('Italian menu description', 'Usa un altro video YouTube per questo brano' in it),
              ('Italian dialog label', '<string name="paste_youtube_url">Incolla qui il link YouTube</string>' in it),
              ('old expire experiment removed', 'MISSING_EXPIRE_FALLBACK_SECONDS' not in y),
          ]
          # Ensure the YouTube row is after the Advanced row in the final menu group.
          checks.append(('YouTube row is last after Advanced', m.rfind('R.string.change_youtube_version') > m.rfind('R.string.advanced')))
          bad = [name for name, ok in checks if not ok]
          for i, (name, ok) in enumerate(checks, 1):
              print(f'CHECK {i:02d}: {"PASS" if ok else "FAIL"} - {name}')
          if bad:
              raise SystemExit('Failed checks: ' + ', '.join(bad))
          PY

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileFossDebugKotlin --no-daemon

      - name: Commit universal override to LAB
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Br174'
          git config user.email 'brunoverlezza@gmail.com'
          git add \
            app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt \
            app/src/main/kotlin/com/metrolist/music/playback/YouTubeMatchOverrides.kt \
            app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt \
            app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt \
            app/src/main/res/values-it/metrolist_strings.xml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'feat(playback): restore universal manual YouTube override'
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
