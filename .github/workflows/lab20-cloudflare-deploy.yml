name: LAB20 Cloudflare Brain Deploy
# deploy-revision: title-meaning-evidence-v2

on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - '.github/workflows/lab20-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: musiclab-lab20-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: verify-and-deploy-lab20-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5781b597517f6f7fe25751170a99b9ab
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORKER_URL: https://musiclab-music-intelligence.brunoverlezza.workers.dev
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout exact LAB20 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "LAB20 Cloudflare source: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GEMINI_API_KEY"

      - name: Install Worker dependencies
        working-directory: cloudflare/music-intelligence
        run: npm install

      - name: Run complete Brain and resolver suite
        run: node --test cloudflare/music-intelligence/test/*.test.mjs

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          test "$(jq -r '.success' <<<"$response")" = "true"

      - name: Target stable MusicLab endpoint with LAB20 runtime
        working-directory: cloudflare/music-intelligence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("wrangler.lab20.jsonc")
          data = json.loads(path.read_text())
          data["name"] = "musiclab-music-intelligence"
          data["main"] = "src/worker-v20-runtime.js"
          data.setdefault("vars", {})["ENGINE_VERSION"] = "1.3.1-lab20"
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          grep -Fq '"name": "musiclab-music-intelligence"' wrangler.lab20.jsonc
          grep -Fq '"main": "src/worker-v20-runtime.js"' wrangler.lab20.jsonc

      - name: Dry-run LAB20 Worker
        working-directory: cloudflare/music-intelligence
        run: npx wrangler deploy --config wrangler.lab20.jsonc --dry-run --outdir=/tmp/musiclab-lab20-worker

      - name: Apply additive D1 migrations
        working-directory: cloudflare/music-intelligence
        run: npx wrangler d1 migrations apply musiclab-intelligence-db --remote --config wrangler.lab20.jsonc

      - name: Configure Gemini secret on stable Worker
        working-directory: cloudflare/music-intelligence
        shell: bash
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.lab20.jsonc

      - name: Deploy LAB20 runtime to stable endpoint
        working-directory: cloudflare/music-intelligence
        run: npx wrangler deploy --config wrangler.lab20.jsonc

      - name: Verify published LAB20 runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if state="$(curl --fail-with-body --silent --show-error "$WORKER_URL/stato")"               && jq -e '.stato == "ok" and .memoria == true and .ai == true and .versione == "1.3.1-lab20"' <<<"$state" >/dev/null; then
              plan="$(curl --fail-with-body --silent --show-error                 -H 'content-type: application/json'                 -d '{"title":"Il mondo","artist":"Jimmy Fontana","mode":"cover"}'                 "$WORKER_URL/api/v1/brain/plan")"
              jq -e '.title == "Il mondo" and (.sourcePlan | index("d1")) != null and (.sourcePlan | index("musicbrainz")) != null' <<<"$plan" >/dev/null
              echo "$state"
              echo "$plan"
              exit 0
            fi
            sleep 5
          done
          echo "LAB20 Worker non verificato sull endpoint stabile" >&2
          exit 1
