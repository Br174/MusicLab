name: TEMP LAB14 Executor from LAB13
on:
  push:
    branches:
      - uab-build/musiclab-meld-upstream-sync-13
permissions:
  contents: write
concurrency:
  group: musiclab-lab14-executor
  cancel-in-progress: false
jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'LAB14 executor merge Meld 0.9.2')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-meld-0.9.2-integration-14
          fetch-depth: 0
          submodules: recursive
      - name: Fetch Meld v0.9.2
        run: git fetch https://github.com/FrancescoGrazioso/Meld.git refs/tags/v0.9.2:refs/tags/meld-v0.9.2
      - name: Merge con protezione dei conflitti MusicLab
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MusicLab Upstream Integrator"
          git config user.email "upstream@musiclab.local"
          set +e
          git merge --no-commit --no-ff meld-v0.9.2
          rc=$?
          set -e
          echo "merge rc=$rc"
          protected=(
            '.github/workflows/build.yml'
            '.github/workflows/build_quick.yml'
            '.gitmodules'
            'app/build.gradle.kts'
            'app/src/main/kotlin/com/metrolist/music/App.kt'
            'app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt'
            'app/src/main/kotlin/com/metrolist/music/ui/component/BottomSheet.kt'
            'app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt'
            'app/src/main/kotlin/com/metrolist/music/ui/menu/SongMenu.kt'
            'app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt'
            'app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt'
            'app/src/main/kotlin/com/metrolist/music/ui/utils/ShowMediaInfo.kt'
            'app/src/main/kotlin/com/metrolist/music/utils/Updater.kt'
          )
          for p in "${protected[@]}"; do
            git checkout --ours -- "$p"
            git add "$p"
          done
          git rm -f .github/workflows/release.yml || true
          # rimuove i due file temporanei creati solo per tentare il trigger direttamente in LAB14
          git rm -f .github/workflows/lab14-import-meld-temp.yml tmp/lab14-merge-trigger.txt || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Conflitti non risolti:'
            git diff --name-only --diff-filter=U
            exit 3
          fi
          git add -A
          git commit -m 'LAB14: importa Meld v0.9.2 preservando i conflitti MusicLab'
          git push origin HEAD:uab-build/musiclab-meld-0.9.2-integration-14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Crea keystore debug di prova
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build diagnostico post-merge
        shell: bash
        run: ./gradlew --no-configuration-cache --console=plain assembleFossDebug -x lint
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
