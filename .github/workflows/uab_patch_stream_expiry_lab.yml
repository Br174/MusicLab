name: TEMP - Apply MusicLab stream-expiry resolver fix

on:
  push:
    branches:
      - 'lab/musiclab-playback-403-recovery-01'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0

      - name: Restore false-path files and patch resolver
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_stream_expiry.py
          python3 /tmp/patch_stream_expiry.py
          git diff --check
          grep -F 'MISSING_EXPIRE_FALLBACK_SECONDS = 60' app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt
          grep -F 'responseToUse.streamingData?.expiresInSeconds' app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt
          grep -F 'getQueryParameter("expire")?.toLongOrNull()' app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt

      - name: Commit clean resolver fix
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt
          git commit -m "fix(playback): accept valid streams without response expiry metadata"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
