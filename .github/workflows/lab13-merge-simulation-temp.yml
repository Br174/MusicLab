name: TEMP LAB13 Meld Merge Simulation
on:
  push:
    branches:
      - uab-build/musiclab-meld-upstream-sync-13
permissions:
  contents: read
jobs:
  simulate:
    if: contains(github.event.head_commit.message, 'LAB13 Meld 0.9.2 merge simulation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Meld v0.9.2
        run: |
          git fetch https://github.com/FrancescoGrazioso/Meld.git refs/tags/v0.9.2:refs/tags/meld-v0.9.2
      - name: Simula merge senza scrivere
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MusicLab Merge Simulation"
          git config user.email "simulation@musiclab.local"
          set +e
          git merge --no-commit --no-ff meld-v0.9.2 >/tmp/merge.log 2>&1
          rc=$?
          set -e
          echo "MERGE_EXIT=$rc"
          echo "--- REAL_CONFLICTS ---"
          git diff --name-only --diff-filter=U | sort -u | tee /tmp/conflicts.txt
          echo "REAL_CONFLICT_COUNT=$(wc -l < /tmp/conflicts.txt)"
          echo "--- MERGE_LOG_TAIL ---"
          tail -80 /tmp/merge.log || true
          git merge --abort >/dev/null 2>&1 || git reset --hard HEAD >/dev/null 2>&1
