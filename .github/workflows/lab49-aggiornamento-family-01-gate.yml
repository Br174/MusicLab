name: LAB49 Aggiornamento + Sicurezza 48 Gate

on:
  push:
    branches:
      - uab-build/musiclab-lab49-aggiornamento-family-01
    paths-ignore:
      - LAB49_BUILD_STATUS.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab49-final-gate-v3
  cancel-in-progress: true

jobs:
  build-update:
    name: build-update-first
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact LAB49 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run retained LAB46 and LAB49 behavioral contracts
        run: |
          node --test cloudflare/music-intelligence/test/lab46-originals-retry-player-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab46-red-retry-originals-player-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab48-player-isolation-contract.test.mjs\n          node --test cloudflare/music-intelligence/test/lab49-cancellable-background-contract.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: Prove Player buono LAB41 is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          GOOD_SHA="329e663061d46928dc4d58a946c0d3d2f88881b3"
          PLAYER_PATH="app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt"
          git show "$GOOD_SHA:$PLAYER_PATH" > /tmp/player-buono.kt
          cmp /tmp/player-buono.kt "$PLAYER_PATH"
          grep -F 'LAB07_FAST_LANE_TIMEOUT_MS = 1_800L' "$PLAYER_PATH"

      - name: Run retained LAB45 + LAB46 + LAB47 unit tests
        run: |
          ./gradlew --console=plain :app:testFossDebugUnitTest             --tests 'com.metrolist.music.ui.component.Lab45CoverDedupTest'             --tests 'com.metrolist.music.ui.component.Lab46CrossSourceDedupTest'             --tests 'com.metrolist.music.ui.component.Lab47CoverRecoveryPerformanceTest'             --warning-mode summary

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB 49 aggiornamento
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify LAB 49 update identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-LAB49-aggiornamento.apk"
          ZIP="dist/uab/MusicLab-LAB49-aggiornamento-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.labupdate01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='4901'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB 49 aggiornamento'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=01"
            echo "APPLICATION_ID=it.verlezza.musiclab.labupdate01"
            echo "VERSION_CODE=4901"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "PLAYER_BUONO_SOURCE_SHA=329e663061d46928dc4d58a946c0d3d2f88881b3"
            echo "PAIRED_SAFETY=LAB di sicurezza 49"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload LAB 49 aggiornamento immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB49-aggiornamento
          path: |
            dist/uab/apk/MusicLab-LAB49-aggiornamento.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB49-aggiornamento-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

  build-safety:
    name: build-safety-after-update
    needs: build-update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_safety.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_safety.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact same LAB49 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: Build LAB di sicurezza 49 from exact same source
        shell: bash
        run: |
          set -euo pipefail
          SAFETY_KEY="$RUNNER_TEMP/musiclab-safety-49.jks"
          SAFETY_CONFIG="$RUNNER_TEMP/musiclab-safety-49.env"
          SAFETY_OUT="$GITHUB_WORKSPACE/dist/safety49"

          keytool -genkeypair             -keystore "$SAFETY_KEY"             -storepass android             -alias musiclab_safety_48             -keypass android             -dname "CN=MusicLab LAB di sicurezza 49,O=MotorLab Test,C=IT"             -keyalg RSA             -keysize 2048             -validity 36500             -noprompt

          cat > "$SAFETY_CONFIG" <<'EOF'
          UAB_TASK=":app:assembleFossDebug"
          UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"
          UAB_FILE_VERSION="LAB_DI_SICUREZZA_49"
          UAB_OUTPUT_NAME="MusicLab-LAB-di-sicurezza-48"
          UAB_GRADLE_ARGS="-x lint"
          UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"
          UAB_PARALLEL_INSTALL="off"
          export METROLIST_APPLICATION_ID="it.verlezza.musiclab.safety49"
          export METROLIST_APP_NAME="MusicLab LAB di sicurezza 49"
          export MUSICLAB_VERSION_CODE="4901"
          export MUSICLAB_VERSION_NAME="0.9.2-safety49"
          export PULL_REQUEST="false"
          EOF

          UAB_CONFIG_FILE="$SAFETY_CONFIG"           UAB_OUTPUT_DIR="$SAFETY_OUT"           METROLIST_DEBUG_KEYSTORE_PATH="$SAFETY_KEY"           METROLIST_DEBUG_KEYSTORE_PASSWORD="android"           METROLIST_DEBUG_KEY_ALIAS="musiclab_safety_48"           METROLIST_DEBUG_KEY_PASSWORD="android"           CRASH_REPORT_TOKEN="${{ secrets.CRASH_REPORT_TOKEN }}"           CRASH_REPORT_REPO="${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}"           bash tools/universal-apk-builder/build-apk.sh .

      - name: Verify LAB di sicurezza 49 isolation
        shell: bash
        run: |
          set -euo pipefail
          SAFETY_OUT="$GITHUB_WORKSPACE/dist/safety49"
          APK="$SAFETY_OUT/apk/MusicLab-LAB-di-sicurezza-48.apk"
          ZIP="$SAFETY_OUT/MusicLab-LAB-di-sicurezza-48-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.safety49'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='4901'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB di sicurezza 49'"

          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          SAFETY_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          MAIN_CERT="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          test -n "$SAFETY_CERT"
          test "$SAFETY_CERT" != "$MAIN_CERT"

          {
            echo "SAFETY_LABEL=LAB di sicurezza 49"
            echo "PAIRED_UPDATE_LABEL=LAB 49 aggiornamento"
            echo "PAIRED_UPDATE_SHA=$GITHUB_SHA"
            echo "APPLICATION_ID=it.verlezza.musiclab.safety49"
            echo "VERSION_CODE=4901"
            echo "SIGNING_CERT_SHA256=$SAFETY_CERT"
            echo "IMMUTABLE=yes"
          } > "$SAFETY_OUT/SAFETY_49.txt"

          printf '%s\n' "$GITHUB_SHA" > "$SAFETY_OUT/BUILD_SHA.txt"
          sha256sum "$APK" "$ZIP" > "$SAFETY_OUT/SAFETY_SHA256SUMS.txt"

      - name: Upload LAB di sicurezza 49
        id: upload_safety
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-di-sicurezza-48
          path: |
            dist/safety49/apk/MusicLab-LAB-di-sicurezza-48.apk
            dist/safety49/apk/SHA256SUMS.txt
            dist/safety49/MusicLab-LAB-di-sicurezza-48-APK.zip
            dist/safety49/BUILD_SHA.txt
            dist/safety49/SAFETY_49.txt
            dist/safety49/SAFETY_SHA256SUMS.txt
            dist/safety49/logs/*.log
          if-no-files-found: error
          retention-days: 30

  record-status:
    name: record-lab49-gate-result
    needs:
      - build-update
      - build-safety
    if: ${{ always() && needs.build-update.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout LAB49 branch for durable status
        uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-lab49-aggiornamento-family-01
          fetch-depth: 0

      - name: Record run and artifact pointers
        continue-on-error: true
        shell: bash
        env:
          UPDATE_RESULT: ${{ needs.build-update.result }}
          SAFETY_RESULT: ${{ needs.build-safety.result }}
          UPDATE_ARTIFACT_ID: ${{ needs.build-update.outputs.artifact_id }}
          UPDATE_ARTIFACT_DIGEST: ${{ needs.build-update.outputs.artifact_digest }}
          SAFETY_ARTIFACT_ID: ${{ needs.build-safety.outputs.artifact_id }}
          SAFETY_ARTIFACT_DIGEST: ${{ needs.build-safety.outputs.artifact_digest }}
        run: |
          set -euo pipefail

          # A superseded/cancelled run must never overwrite the canonical status.
          git fetch origin uab-build/musiclab-lab49-aggiornamento-family-01
          CURRENT_HEAD="$(git rev-parse origin/uab-build/musiclab-lab49-aggiornamento-family-01)"
          if [[ "$CURRENT_HEAD" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale status write: current=$CURRENT_HEAD run=$GITHUB_SHA"
            exit 0
          fi

          cat > LAB49_BUILD_STATUS.txt <<EOF
          LAB=49
          SOURCE_SHA=$GITHUB_SHA
          RUN_ID=$GITHUB_RUN_ID
          RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          UPDATE_RESULT=$UPDATE_RESULT
          SAFETY_RESULT=$SAFETY_RESULT
          UPDATE_ARTIFACT_ID=$UPDATE_ARTIFACT_ID
          UPDATE_ARTIFACT_DIGEST=$UPDATE_ARTIFACT_DIGEST
          SAFETY_ARTIFACT_ID=$SAFETY_ARTIFACT_ID
          SAFETY_ARTIFACT_DIGEST=$SAFETY_ARTIFACT_DIGEST
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAB49_BUILD_STATUS.txt
          git commit -m "chore(ci): record LAB49 gate result" || exit 0
          git push origin HEAD:uab-build/musiclab-lab49-aggiornamento-family-01
