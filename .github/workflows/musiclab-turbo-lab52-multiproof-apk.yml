name: MusicLab Turbo LAB52 MultiProof Signed APK ZIP
on:
  push:
    branches:
      - lab/musiclab-turbo-multiproof-lab52-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-turbo-lab52-multiproof
  cancel-in-progress: true

jobs:
  test-and-build:
    name: LAB52 MultiProof regression, exact protection, signed APK ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRASH_REPORT_TOKEN: ''
      CRASH_REPORT_REPO: ''
      LASTFM_API_KEY: ''
      LASTFM_SECRET: ''
    steps:
      - name: Checkout isolated LAB52 and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Guard LAB51 source, player LAB49, initial LAB45, UI and signer
        shell: bash
        run: |
          set -euo pipefail
          BASE=f3c676b2b24152f27ca5297a9e01d89342503a18
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/musiclab-lab52-changed.txt
          cat /tmp/musiclab-lab52-changed.txt
          while IFS= read -r path; do
            case "$path" in
              app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt|app/src/main/kotlin/com/metrolist/music/ui/component/CoverMultiProofVerifier.kt|app/src/main/kotlin/com/metrolist/music/ui/component/MusicBrainzCoverSource.kt|app/src/test/kotlin/com/metrolist/music/ui/component/CoverLab52MultiProofTest.kt|cloudflare/music-intelligence/test/turbo-lab52-multiproof-regression-contract.test.mjs|tools/universal-apk-builder/prepare-turbo-lab52-multiproof-env.py|scripts/musiclab-lab52-live-60-work-probe.py|.github/workflows/musiclab-turbo-lab52-multiproof-apk.yml) ;;
              *) echo "OUT OF APPROVED LAB52 SCOPE: $path"; exit 1 ;;
            esac
          done < /tmp/musiclab-lab52-changed.txt
          for protected in app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverRoundSearchPlan.kt app/src/main/AndroidManifest.xml app/build.gradle.kts; do
            test "$(git hash-object "$protected")" = "$(git rev-parse "$BASE:$protected")"
          done
          echo "LAB52 isolation, immutable player, first search, UI, identity protected"
      - name: Contract regression including LAB45, LAB49, LAB51 and LAB52
        run: |
          node --test cloudflare/music-intelligence/test/turbo-lab45-separated-actions-progressive-rounds.test.mjs cloudflare/music-intelligence/test/turbo-lab45-persistent-rounds.test.mjs cloudflare/music-intelligence/test/turbo-lab46-round-strategy-score100-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-recording-identity.test.mjs cloudflare/music-intelligence/test/turbo-lab40-work-identity-speed-artwork.test.mjs cloudflare/music-intelligence/test/turbo-lab43-song-identity-refresh.test.mjs cloudflare/music-intelligence/test/turbo-lab48-work-first-recovery-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab49-audio-stability-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab51-breadth-audio-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab52-multiproof-regression-contract.test.mjs
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Prepare same-family Android versionCode 33054
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-lab52-multiproof-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33054"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
      - name: Android JVM and synthetic 60-song multi-proof QA
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary
      - name: Diagnose and compile the signed LAB52 APK ZIP
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          bash tools/universal-apk-builder/build-apk.sh .
      - name: Inspect exact installer identity, signature and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/uab/apk/MusicLab-Turbo-LAB52.apk
          ZIP=dist/uab/MusicLab-Turbo-LAB52-APK.zip
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33054'"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          printf '%s\n' "$CERT_OUTPUT" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$CERT" = "9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
          printf 'APPLICATION_ID=it.verlezza.musiclab.turbo01\nVERSION_CODE=33054\nSIGNING_SHA256=%s\nBASE_SHA=f3c676b2b24152f27ca5297a9e01d89342503a18\n' "$CERT" > dist/uab/UPDATE_FAMILY.txt
      - name: Publish installable APK and ZIP
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MusicLab-Turbo-LAB52-MultiProof-APK-ZIP
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB52.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-LAB52-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  real-source-probe:
    name: External 60-song source potential (independent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source probe
        uses: actions/checkout@v4
      - name: Query 60 songs with MusicBrainz Work attribution and log failures
        run: python3 scripts/musiclab-lab52-live-60-work-probe.py
      - name: Publish honest real source coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusicLab-LAB52-Real-60-Song-Source-Report
          path: dist/uab/LAB52_LIVE_60_WORK_REPORT.json
          if-no-files-found: warn
          retention-days: 14
