      - name: Scudo360 Quality r40 gate
        env:
          SCUDO360_R40_PROMOTION: '1'
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-report.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-r40-quality.json
      - name: Preserve Scudo360 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scudo360-musiclab-library-spotify-first
          path: |
            .motorlab/scudo360-report.json
            app/build/test-results/testFossDebugUnitTest/*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Build signed MusicLab APK and ZIP
        if: contains(github.event.head_commit.message, '[build-apk]')
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          bash tools/universal-apk-builder/build-apk.sh .
      - name: Validate APK package version signature and ZIP integrity
        if: contains(github.event.head_commit.message, '[build-apk]')
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/uab/apk/MusicLab-Turbo-LAB79-Revisione-68-Compilation-Nomi-Puliti.apk
          ZIP=dist/uab/MusicLab-Turbo-LAB79-Revisione-68-Compilation-Nomi-Puliti-APK.zip
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33148'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/signature.txt | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$CERT" = '9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749'
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          a=Path('dist/uab/apk/MusicLab-Turbo-LAB79-Revisione-68-Compilation-Nomi-Puliti.apk')
          z=Path('dist/uab/MusicLab-Turbo-LAB79-Revisione-68-Compilation-Nomi-Puliti-APK.zip')
          with zipfile.ZipFile(z) as arc:
              items=[x for x in arc.namelist() if x.lower().endswith('.apk')]
              assert len(items)==1
              assert hashlib.sha256(arc.read(items[0])).digest()==hashlib.sha256(a.read_bytes()).digest()
          Path('dist/uab/BUILD_SHA.txt').write_text('BUILD_SHA='+'verified'+'\n')
          PY
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
      - name: Publish separate APK and ZIP
        if: contains(github.event.head_commit.message, '[build-apk]')
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-R68-Compilation-Nomi-Puliti-33148-APK-ZIP
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB79-Revisione-68-Compilation-Nomi-Puliti.apk
            dist/uab/MusicLab-Turbo-LAB79-Revisione-68-Compilation-Nomi-Puliti-APK.zip
            dist/uab/BUILD_SHA.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
