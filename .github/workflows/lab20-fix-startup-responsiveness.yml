name: LAB20 One-shot startup responsiveness fix

on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - '.github/workflows/lab20-fix-startup-responsiveness.yml'

permissions:
  contents: write

concurrency:
  group: lab20-one-shot-startup-responsiveness
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: uab-build/musiclab-ai-brain-20

      - name: Patch lightweight startup preparation and first-audio buffer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt')
          text = path.read_text()
          old = "    suspend fun prewarm() = bundle().extractor.prewarm()\n"
          new = "    /**\n     * Lightweight app-start preparation. Builds the extraction stack and initializes\n     * the QuickJS cipher runtime only; unlike prewarm(), this never fetches player\n     * configuration or mints a PO token through WebView.\n     */\n    suspend fun prepare() {\n        bundle().cipherService.initialize()\n    }\n\n    suspend fun prewarm() = bundle().extractor.prewarm()\n"
          if text.count(old) != 1:
              raise SystemExit(f'InnerTubeXPlayer prewarm anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('app/src/main/kotlin/com/metrolist/music/App.kt')
          text = path.read_text()
          old = "            // Warm player config/cipher immediately after settings are ready. This is best-effort\n            // and must never wait for visitorData: first playback can supply/refresh that state itself.\n            launch(Dispatchers.IO) {\n                runCatching { InnerTubeXPlayer.prewarm() }\n                    .onFailure { Timber.tag(\"InnerTubeXPlayer\").d(it, \"Playback prewarm did not complete; first play will retry normally\") }\n            }\n"
          new = "            // Prepare only the lightweight cipher runtime while Home is starting. Full extractor\n            // prewarm may mint a PO token through WebView/Main and must stay off the app-start path.\n            launch(Dispatchers.IO) {\n                runCatching { InnerTubeXPlayer.prepare() }\n                    .onFailure { Timber.tag(\"InnerTubeXPlayer\").d(it, \"Lightweight playback preparation did not complete; first play will retry normally\") }\n            }\n"
          if text.count(old) != 1:
              raise SystemExit(f'App startup prewarm anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt')
          text = path.read_text()
          old = "private const val PLAYBACK_START_BUFFER_MS = 2_000\nprivate const val PLAYBACK_REBUFFER_MS = 4_000\n"
          new = "private const val PLAYBACK_START_BUFFER_MS = 1_250\nprivate const val PLAYBACK_REBUFFER_MS = 4_000\n"
          if text.count(old) != 1:
              raise SystemExit(f'MusicService buffer anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          node --test cloudflare/music-intelligence/test/device-regression-contract.test.mjs
          grep -n -A14 -B3 'suspend fun prepare' app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt
          grep -n -A8 -B3 'InnerTubeXPlayer.prepare' app/src/main/kotlin/com/metrolist/music/App.kt
          grep -n -A2 -B2 'PLAYBACK_START_BUFFER_MS' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt

      - name: Commit only startup responsiveness fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt app/src/main/kotlin/com/metrolist/music/App.kt app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(lab20): restore startup responsiveness without audio stutter'
          git push origin HEAD:uab-build/musiclab-ai-brain-20
