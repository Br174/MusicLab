name: One-shot MusicLab Credits.fm parser v2

on:
  push:
    branches:
      - 'lab/musiclab-creditsfm-01'
    paths:
      - '.github/workflows/one-shot-creditsfm-v2.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Progress 5% - accepted
        run: echo '[UAB_PROGRESS=5] Correzione parser Credits.fm presa in carico'

      - name: Checkout LAB
        uses: actions/checkout@v4
        with:
          ref: lab/musiclab-creditsfm-01
          fetch-depth: 0
          submodules: recursive

      - name: Apply Credits.fm parser v2
        run: |
          python3 tools/one-shot-creditsfm-v2.py
          echo '[UAB_PROGRESS=30] Parser Credits.fm corretto'

      - name: Commit corrected LAB source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Br174'
          git config user.email 'brunoverlezza@gmail.com'
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CreditsFmCoverSource.kt
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverHubSearchEngine.kt
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt
          git commit -m 'fix(covers): follow Credits.fm ISRC to ISWC recordings'
          git push origin HEAD:lab/musiclab-creditsfm-01
          echo '[UAB_PROGRESS=45] Correzione salvata nella LAB'

      - name: Verify app change-set against Mother
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 770849ff543289de3adffe5bab62bc09528d19f4 HEAD -- app/src/main | sort > /tmp/app-changed.txt
          cat >/tmp/app-expected.txt <<'EOF'
          app/src/main/kotlin/com/metrolist/music/ui/component/CoverHubSearchEngine.kt
          app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt
          app/src/main/kotlin/com/metrolist/music/ui/component/CreditsFmCoverSource.kt
          EOF
          sort -o /tmp/app-expected.txt /tmp/app-expected.txt
          diff -u /tmp/app-expected.txt /tmp/app-changed.txt
          if grep -Ei 'player|playback|audio|service|innertube' /tmp/app-changed.txt; then
            echo '::error::La LAB ha toccato un file vietato del percorso audio/player.'
            exit 21
          fi
          echo '[UAB_PROGRESS=60] Diff verificato: solo tre file cover, zero audio/player'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up persistent Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare isolated LAB signing
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > app/persistent-debug.keystore
            chmod 600 app/persistent-debug.keystore
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      - name: Prepare temporary UAB build config
        shell: bash
        run: |
          cp uab-project.env /tmp/uab-creditsfm-v2.env
          sed -i 's#^UAB_OUTPUT_NAME=.*#UAB_OUTPUT_NAME="MusicLab-CREDITSFM-LAB-01-V2"#' /tmp/uab-creditsfm-v2.env
          sed -i 's#^UAB_GRADLE_ARGS=.*#UAB_GRADLE_ARGS="--build-cache -x lint"#' /tmp/uab-creditsfm-v2.env

      - name: UAB preflight
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build corrected LAB
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-creditsfm-v2.env
          UAB_BUILD_ID: creditsfm01v2
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: |
          bash tools/universal-apk-builder/build-apk.sh .
          echo '[UAB_PROGRESS=75] Compilazione LAB completata'

      - name: Verify APK and parallel package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find dist/uab/apk -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -s "$APK"
          unzip -tq "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -F "package: name='it.verlezza.musiclab.lab.creditsfm01v2'" /tmp/badging.txt
          echo '[UAB_PROGRESS=85] APK integro, firmato e installabile in parallelo'

      - name: Upload temporary LAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-CREDITSFM-LAB-01-V2
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Progress 100% - complete
        run: echo '[UAB_PROGRESS=100] Credits.fm parser v2 compilato e verificato; nessuna MADRE/Release modificata'
