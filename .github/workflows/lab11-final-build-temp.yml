name: TEMP MusicLab LAB11 Final Build
on:
  push:
    branches: [uab-build/musiclab-global-ai-engine-11]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9427a00c966850344ebf3854dd8c03e1c9fe5d77
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - run: bash tools/universal-apk-builder/diagnose.sh .
      - run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-GLOBAL-AI-ENGINE-11
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
