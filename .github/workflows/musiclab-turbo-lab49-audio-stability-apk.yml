name: MusicLab Turbo LAB49 Shared Audio Stability APK ZIP
on:
  push:
    branches:
      - lab/musiclab-turbo-audio-stability-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-turbo-lab49-audio-stability
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Isolated LAB49 Cover+audio unit tests and signed update APK ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRASH_REPORT_TOKEN: ''
      CRASH_REPORT_REPO: ''
      LASTFM_API_KEY: ''
      LASTFM_SECRET: ''
    steps:
      - name: Checkout isolated LAB49 and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Guard LAB48 baseline and approved playback/cover changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=4ea7c87664127aeef5ba9dada9d30218c833024b
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/musiclab-lab49-changed.txt
          cat /tmp/musiclab-lab49-changed.txt
          while IFS= read -r path; do
            case "$path" in
              app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt|app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt|cloudflare/music-intelligence/test/turbo-lab49-audio-stability-contract.test.mjs|tools/universal-apk-builder/prepare-turbo-lab49-audio-stability-env.py|.github/workflows/musiclab-turbo-lab49-audio-stability-apk.yml) ;;
              *) echo "UNAPPROVED PATH: $path"; exit 1 ;;
            esac
          done < /tmp/musiclab-lab49-changed.txt
          for path in app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/AndroidManifest.xml app/build.gradle.kts; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$BASE:$path")"
          done
          node -e "const f=require('fs').readFileSync('app/src/main/kotlin/com/metrolist/music/ui/component/CoverRoundSearchPlan.kt','utf8'); if(!f.includes('if (round <= 1 || title.isBlank()) return emptyList()')) process.exit(1)"
          echo "LAB49 isolated source scope and LAB45 Cover first-round guard verified"
      - name: Run Cover and audio historic contracts and regression checks
        run: |
          node --test cloudflare/music-intelligence/test/turbo-lab45-separated-actions-progressive-rounds.test.mjs cloudflare/music-intelligence/test/turbo-lab45-persistent-rounds.test.mjs cloudflare/music-intelligence/test/turbo-lab46-round-strategy-score100-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-recording-identity.test.mjs cloudflare/music-intelligence/test/turbo-lab40-work-identity-speed-artwork.test.mjs cloudflare/music-intelligence/test/turbo-lab43-song-identity-refresh.test.mjs cloudflare/music-intelligence/test/turbo-lab48-work-first-recovery-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab49-audio-stability-contract.test.mjs cloudflare/music-intelligence/test/lab48-player-isolation-contract.test.mjs
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Android SDK and LAB49 update family stamp
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-lab49-audio-stability-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33051"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
      - name: Android JVM suite for audio, existing player and Cover
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary
      - name: Diagnose and build APK ZIP
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          bash tools/universal-apk-builder/build-apk.sh .
      - name: Verify update compatibility, signing and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/uab/apk/MusicLab-Turbo-LAB49.apk
          ZIP=dist/uab/MusicLab-Turbo-LAB49-APK.zip
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33051'"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          printf '%s\n' "$CERT_OUTPUT" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$CERT" = "9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
          printf 'APPLICATION_ID=it.verlezza.musiclab.turbo01\nVERSION_CODE=33051\nSIGNING_SHA256=%s\nBASE_SHA=4ea7c87664127aeef5ba9dada9d30218c833024b\n' "$CERT" > dist/uab/UPDATE_FAMILY.txt
      - name: Upload verified APK and ZIP
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MusicLab-Turbo-LAB49-AudioStable-APK-ZIP
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB49.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-LAB49-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
