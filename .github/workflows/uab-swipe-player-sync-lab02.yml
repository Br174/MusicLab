name: UAB Swipe Player Sync LAB 02

on:
  push:
    branches:
      - lab/musiclab-swipe-player-sync-02-work
    paths:
      - .github/workflows/uab-swipe-player-sync-lab02.yml

permissions:
  contents: write

concurrency:
  group: uab-musiclab-swipe-player-sync-02
  cancel-in-progress: true

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout LAB 02 work branch
        uses: actions/checkout@v4
        with:
          ref: lab/musiclab-swipe-player-sync-02-work
          submodules: recursive
          fetch-depth: 0

      - name: Apply real-finger swipe guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt')
          text = path.read_text(encoding='utf-8')

          imports = [
              ('import androidx.compose.runtime.setValue\n', 'import androidx.compose.runtime.snapshotFlow\n'),
              ('import androidx.compose.ui.input.pointer.pointerInput\n', 'import androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.awaitPointerEventScope\n'),
              ('import kotlinx.coroutines.delay\n', 'import kotlin.math.abs\n'),
          ]
          for anchor, addition in imports:
              if addition not in text:
                  if anchor not in text:
                      raise SystemExit(f'Import anchor not found: {anchor!r}')
                  text = text.replace(anchor, anchor + addition, 1)

          start_marker = '    // Current item tracking - derived state for efficiency\n'
          end_marker = '    // Update position when song changes\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Swipe handler markers not found; refusing non-atomic patch')

          old_region = text[start:end]
          if 'LaunchedEffect(itemScrollOffset)' not in old_region:
              raise SystemExit('Expected Mother swipe handler not found; refusing patch')

          new_region = '''    // Current item tracking - derived state for efficiency
    val currentItem by remember { derivedStateOf { thumbnailLazyGridState.firstVisibleItemIndex } }

    // Only a genuine horizontal finger drag can arm a song change. Programmatic
    // movements (player opening, metadata updates, automatic centering) never arm it.
    var userPointerDown by remember { mutableStateOf(false) }
    var userSwipeArmed by remember { mutableStateOf(false) }

    val userSwipePointerModifier =
        Modifier.pointerInput(swipeThumbnail) {
            if (!swipeThumbnail) return@pointerInput
            val touchSlop = viewConfiguration.touchSlop

            awaitPointerEventScope {
                var gestureActive = false
                var startX = 0f
                var startY = 0f

                while (true) {
                    val event = awaitPointerEvent(PointerEventPass.Final)

                    if (!gestureActive) {
                        val down = event.changes.firstOrNull { it.pressed && !it.previousPressed }
                        if (down != null) {
                            gestureActive = true
                            startX = down.position.x
                            startY = down.position.y
                            userPointerDown = true
                            userSwipeArmed = false
                        }
                        continue
                    }

                    val pressedChange = event.changes.firstOrNull { it.pressed }
                    if (pressedChange != null) {
                        val dx = abs(pressedChange.position.x - startX)
                        val dy = abs(pressedChange.position.y - startY)
                        if (dx > touchSlop && dx > dy) {
                            userSwipeArmed = true
                        }
                    }

                    if (event.changes.none { it.pressed }) {
                        gestureActive = false
                        userPointerDown = false
                    }
                }
            }
        }

    // Commit at most one skip after the real finger gesture has ended and the
    // carousel has settled. Automatic scroll/centering can never reach this path
    // because it cannot set userSwipeArmed.
    LaunchedEffect(
        thumbnailLazyGridState,
        swipeThumbnail,
        currentMediaIndex,
        canSkipNext,
        canSkipPrevious,
    ) {
        snapshotFlow {
            !thumbnailLazyGridState.isScrollInProgress &&
                !userPointerDown &&
                userSwipeArmed
        }.collect { shouldCommit ->
            if (!shouldCommit) return@collect

            userSwipeArmed = false
            if (!swipeThumbnail || currentMediaIndex < 0) return@collect

            val targetIndex = thumbnailLazyGridState.firstVisibleItemIndex
            val player = playerConnection.player
            val keepPlaying = player.playWhenReady
            val changed =
                when {
                    targetIndex > currentMediaIndex && canSkipNext -> {
                        player.seekToNextMediaItem()
                        true
                    }
                    targetIndex < currentMediaIndex && canSkipPrevious -> {
                        player.seekToPreviousMediaItem()
                        true
                    }
                    else -> false
                }

            if (changed) {
                if (player.playbackState == Player.STATE_IDLE || player.playbackState == Player.STATE_ENDED) {
                    player.prepare()
                }
                player.playWhenReady = keepPlaying
            }
        }
    }

'''

          text = text[:start] + new_region + text[end:]

          old_modifier = '''                        modifier = if (isLandscape) {
                            Modifier.size(dimensions.thumbnailSize + (PlayerHorizontalPadding * 2))
                        } else {
                            Modifier.fillMaxSize()
                        }
'''
          new_modifier = '''                        modifier = (if (isLandscape) {
                            Modifier.size(dimensions.thumbnailSize + (PlayerHorizontalPadding * 2))
                        } else {
                            Modifier.fillMaxSize()
                        }).then(userSwipePointerModifier)
'''
          if old_modifier not in text:
              raise SystemExit('LazyHorizontalGrid modifier anchor not found; refusing patch')
          text = text.replace(old_modifier, new_modifier, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify atomic source diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt"
          FILE="app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt"
          grep -q 'userSwipeArmed' "$FILE"
          grep -q 'PointerEventPass.Final' "$FILE"
          grep -q 'touchSlop' "$FILE"
          grep -q 'seekToNextMediaItem()' "$FILE"
          grep -q 'seekToPreviousMediaItem()' "$FILE"
          if grep -q 'LaunchedEffect(itemScrollOffset)' "$FILE"; then
            echo 'Legacy intermittent swipe handler still present' >&2
            exit 1
          fi

      - name: Commit atomic LAB 02 source change
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt
          git commit -m "fix(player): require real finger drag before thumbnail skip"
          git push origin HEAD:lab/musiclab-swipe-player-sync-02-work

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create isolated debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Prepare isolated UAB LAB config
        shell: bash
        run: |
          printf '%s\n' \
            'UAB_TASK=":app:assembleFossDebug"' \
            'UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"' \
            'UAB_OUTPUT_NAME="MusicLab-SWIPE-PLAYER-SYNC-LAB-02"' \
            'UAB_GRADLE_ARGS="-x lint"' \
            'UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"' \
            'UAB_PARALLEL_INSTALL="on"' \
            'UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.lab"' \
            'UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"' \
            'UAB_APP_NAME_BASE="MusicLab Swipe LAB 02"' \
            'UAB_APP_NAME_ENV="METROLIST_APP_NAME"' \
            'export PULL_REQUEST="false"' \
            > /tmp/uab-swipe-player-sync.env

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build isolated LAB APK and ZIP
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-swipe-player-sync.env
          UAB_BUILD_ID: swipeplayersync02
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .

      - name: Verify parallel package identity
        shell: bash
        run: |
          APK="$(find dist/uab/apk -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='it.verlezza.musiclab.lab.swipeplayersync02'" /tmp/apk-badging.txt

      - name: Upload LAB APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-SWIPE-PLAYER-SYNC-LAB-02
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary workflow from work branch
        if: success()
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git rm -f .github/workflows/uab-swipe-player-sync-lab02.yml
          git commit -m "chore(uab): remove temporary LAB 02 workflow"
          git push origin HEAD:lab/musiclab-swipe-player-sync-02-work
