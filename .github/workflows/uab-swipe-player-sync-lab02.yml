name: UAB Swipe Player Sync LAB 02

on:
  push:
    branches:
      - lab/musiclab-swipe-player-sync-02-work
    paths:
      - .github/workflows/uab-swipe-player-sync-lab02.yml

permissions:
  contents: write

concurrency:
  group: uab-musiclab-swipe-player-sync-02
  cancel-in-progress: true

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout LAB 02 work branch
        uses: actions/checkout@v4
        with:
          ref: lab/musiclab-swipe-player-sync-02-work
          submodules: recursive
          fetch-depth: 0

      - name: Apply real-finger swipe guard
        shell: bash
        run: python3 .uab/swipe_lab02_patch.py

      - name: Verify atomic source diff
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt"
          FILE="app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt"
          grep -q 'userSwipeArmed' "$FILE"
          grep -q 'PointerEventPass.Final' "$FILE"
          grep -q 'touchSlop' "$FILE"
          grep -q 'seekToNextMediaItem()' "$FILE"
          grep -q 'seekToPreviousMediaItem()' "$FILE"
          if grep -q 'LaunchedEffect(itemScrollOffset)' "$FILE"; then
            echo 'Legacy swipe handler still present' >&2
            exit 1
          fi

      - name: Commit atomic LAB 02 source change
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt
          git commit -m "fix(player): require real finger drag before thumbnail skip"
          git push origin HEAD:lab/musiclab-swipe-player-sync-02-work

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create isolated debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Prepare isolated UAB LAB config
        shell: bash
        run: |
          printf '%s\n' \
            'UAB_TASK=":app:assembleFossDebug"' \
            'UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"' \
            'UAB_OUTPUT_NAME="MusicLab-SWIPE-PLAYER-SYNC-LAB-02"' \
            'UAB_GRADLE_ARGS="-x lint"' \
            'UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"' \
            'UAB_PARALLEL_INSTALL="on"' \
            'UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.lab"' \
            'UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"' \
            'UAB_APP_NAME_BASE="MusicLab Swipe LAB 02"' \
            'UAB_APP_NAME_ENV="METROLIST_APP_NAME"' \
            'export PULL_REQUEST="false"' \
            > /tmp/uab-swipe-player-sync.env

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build isolated LAB APK and ZIP
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-swipe-player-sync.env
          UAB_BUILD_ID: swipeplayersync02
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .

      - name: Verify parallel package identity
        shell: bash
        run: |
          APK="$(find dist/uab/apk -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='it.verlezza.musiclab.lab.swipeplayersync02'" /tmp/apk-badging.txt

      - name: Upload LAB APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-SWIPE-PLAYER-SYNC-LAB-02
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary LAB 02 tooling
        if: success()
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git rm -f .github/workflows/uab-swipe-player-sync-lab02.yml .uab/swipe_lab02_patch.py
          git commit -m "chore(uab): remove temporary LAB 02 tooling"
          git push origin HEAD:lab/musiclab-swipe-player-sync-02-work
