name: TEMP LAB11 Cloudflare Dry Run
on:
  push:
    branches:
      - uab-build/musiclab-global-ai-engine-11
permissions:
  contents: read
concurrency:
  group: musiclab-lab11-cloudflare-dryrun
  cancel-in-progress: false
jobs:
  dryrun:
    if: contains(github.event.head_commit.message, 'LAB11 Cloudflare dryrun')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze Worker
        working-directory: cloudflare/music-intelligence
        run: npm install
      - name: Verifica sintassi Worker
        working-directory: cloudflare/music-intelligence
        run: node --check src/index.js
      - name: Prepara config dry-run non persistente
        working-directory: cloudflare/music-intelligence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrangler.jsonc')
          s=p.read_text()
          s=s.replace('INSERIRE_DATABASE_ID_DOPO_LA_CREAZIONE','00000000-0000-0000-0000-000000000000')
          p.write_text(s)
          PY
      - name: Valida pacchetto Cloudflare
        working-directory: cloudflare/music-intelligence
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir=/tmp/musiclab-worker
