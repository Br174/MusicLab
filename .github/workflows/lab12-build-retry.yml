name: MusicLab LAB12 - Build Retry

on:
  push:
    branches:
      - uab-build/musiclab-canonical-ai-repair-12
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musiclab-lab12-build-retry
  cancel-in-progress: false

jobs:
  build:
    name: Corregge regex, compila e pubblica APK LAB12
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout LAB12
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Applica correzione sintattica Kotlin
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/lab12_compile_fix.py
          git diff --check
          git diff --name-only
          test "$(git diff --name-only)" = "app/src/main/kotlin/com/metrolist/music/intelligence/MusicIntelligence.kt"

      - name: Registra sorgente compilabile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MusicLab LAB12"
          git config user.email "uab-bot@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/intelligence/MusicIntelligence.kt
          git commit -m "LAB12: corregge regex Kotlin del resolver canonico [skip ci]"
          git push origin HEAD:uab-build/musiclab-canonical-ai-repair-12
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configura cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configura Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Crea keystore debug isolato
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Configura Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Diagnostica UAB
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Compila APK e ZIP LAB12
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verifica invarianti LAB12
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Regex("""\s+(?:-|–|—|\|)\s+""")' app/src/main/kotlin/com/metrolist/music/intelligence/MusicIntelligence.kt
          grep -Fq 'gemini-3.5-flash-lite' app/src/main/kotlin/com/metrolist/music/intelligence/MusicIntelligence.kt
          grep -Fq 'Identificazione AI in corso…' app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt
          grep -Fq 'title = seed.title' app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt
          grep -Fq 'originalArtist = coverSearchSeed.artist' app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt

      - name: Pubblica APK e ZIP LAB12
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-CANONICAL-AI-REPAIR-12
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
