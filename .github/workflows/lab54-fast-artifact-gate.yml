name: LAB54 Fast Artifact + Sicurezza 54 Gate

on:
  push:
    branches:
      - uab-build/musiclab-lab54-aggiornamento-family-01
    paths-ignore:
      - LAB54_BUILD_STATUS.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab54-fast-artifact-v1
  cancel-in-progress: true

jobs:
  build-update:
    name: build-update-first
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact LAB54 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run retained LAB46-LAB54 behavioral contracts
        run: |
          node --test cloudflare/music-intelligence/test/lab46-originals-retry-player-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab46-red-retry-originals-player-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab48-player-isolation-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab49-cancellable-background-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab50-direct-play-background-barrier-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab51-cover-admission-score20-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab52-cover-video-page-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab53-cover-card-decisions-contract.test.mjs
          node --test cloudflare/music-intelligence/test/lab54-cover-playback-pagination-card-contract.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: Prove Player buono LAB41 is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          GOOD_SHA="329e663061d46928dc4d58a946c0d3d2f88881b3"
          PLAYER_PATH="app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt"
          git fetch --no-tags --depth=1 origin "$GOOD_SHA"
          git show "$GOOD_SHA:$PLAYER_PATH" > /tmp/player-buono.kt
          cmp /tmp/player-buono.kt "$PLAYER_PATH"
          grep -F 'LAB07_FAST_LANE_TIMEOUT_MS = 1_800L' "$PLAYER_PATH"


      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB 54 aggiornamento
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify LAB 54 update identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-LAB54-aggiornamento.apk"
          ZIP="dist/uab/MusicLab-LAB54-aggiornamento-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.labupdate01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='5401'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB 54 aggiornamento'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=01"
            echo "APPLICATION_ID=it.verlezza.musiclab.labupdate01"
            echo "VERSION_CODE=5401"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "PLAYER_BUONO_SOURCE_SHA=329e663061d46928dc4d58a946c0d3d2f88881b3"
            echo "PAIRED_SAFETY=LAB di sicurezza 54"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload LAB 54 aggiornamento immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB54-aggiornamento
          path: |
            dist/uab/apk/MusicLab-LAB54-aggiornamento.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB54-aggiornamento-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

  snapshot-safety-source:
    name: save-safety-source-no-apk
    needs: build-update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository control surface
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact update build identity
        uses: actions/download-artifact@v4
        with:
          name: MusicLab-LAB54-aggiornamento
          path: .safety-source

      - name: Preserve immutable Safety 54 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(tr -d '[:space:]' < .safety-source/BUILD_SHA.txt)"
          test -n "$SOURCE_SHA"

          REF_NAME="safety-source-musiclab-lab54"
          EXISTING="$(git ls-remote --heads origin "refs/heads/$REF_NAME" | awk '{print $1}')"

          if [[ -n "$EXISTING" && "$EXISTING" != "$SOURCE_SHA" ]]; then
            echo "Safety source ref already exists at a different SHA: $EXISTING" >&2
            exit 1
          fi

          if [[ -z "$EXISTING" ]]; then
            git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
            git push origin "$SOURCE_SHA:refs/heads/$REF_NAME"
          fi

          {
            echo "SAFETY_LABEL=LAB di sicurezza 54"
            echo "MODE=SOURCE_ONLY_DEFERRED_APK"
            echo "SOURCE_REF=$REF_NAME"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "PAIRED_UPDATE_LABEL=LAB 54 aggiornamento"
            echo "FUTURE_APPLICATION_ID=it.verlezza.musiclab.safety54"
            echo "VERSION_CODE=5401"
            echo "SIGNING_POLICY=distinct_ephemeral_test_key_on_materialization"
            echo "MATERIALIZE_APK=on_demand"
            echo "BUILD_RECIPE=UAB :app:assembleFossDebug from exact source checkpoint"
          } > SAFETY_SOURCE_54.txt

      - name: Upload lightweight Safety 54 checkpoint manifest
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-di-sicurezza-54-source-checkpoint
          path: SAFETY_SOURCE_54.txt
          if-no-files-found: error
          retention-days: 30
