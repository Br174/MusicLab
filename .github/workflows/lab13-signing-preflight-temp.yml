name: TEMP LAB13 Stable Signing Preflight
on:
  push:
    branches:
      - uab-build/musiclab-meld-upstream-sync-13
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'LAB13 signing preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verifica segreti firma senza mostrarli
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for n in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!n:-}" ]; then
              echo "MOTORLAB_BLOCKER=${n}_MISSING"
              missing=1
            else
              echo "${n}=PRESENT"
            fi
          done
          exit "$missing"
