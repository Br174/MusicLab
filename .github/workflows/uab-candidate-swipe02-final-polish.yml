name: UAB Candidate Swipe 02 Final Polish

on:
  push:
    branches:
      - candidate/musiclab-swipe-player-sync-02
    paths:
      - .github/workflows/uab-candidate-swipe02-final-polish.yml

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/musiclab-swipe-player-sync-02
          submodules: recursive
          fetch-depth: 0
      - name: Verify candidate diff
        shell: bash
        run: |
          git fetch origin mother/musiclab-112726
          git diff --check
          git diff --name-only origin/mother/musiclab-112726 -- app/src/main/kotlin
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Create isolated debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Prepare isolated candidate config
        shell: bash
        run: |
          printf '%s\n' \
            'UAB_TASK=":app:assembleFossDebug"' \
            'UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"' \
            'UAB_OUTPUT_NAME="MusicLab-CANDIDATA-SWIPE-02-FINAL-POLISH"' \
            'UAB_GRADLE_ARGS="-x lint"' \
            'UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"' \
            'UAB_PARALLEL_INSTALL="on"' \
            'UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.candidate"' \
            'UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"' \
            'UAB_APP_NAME_BASE="MusicLab Candidata Swipe 02 Final"' \
            'UAB_APP_NAME_ENV="METROLIST_APP_NAME"' \
            'export PULL_REQUEST="false"' \
            > /tmp/uab.env
      - name: UAB preflight
        run: bash tools/universal-apk-builder/diagnose.sh .
      - name: Build candidate APK and ZIP
        env:
          UAB_CONFIG_FILE: /tmp/uab.env
          UAB_BUILD_ID: swipe02finalpolish
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .
      - name: Verify package
        shell: bash
        run: |
          APK="$(find dist/uab/apk -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='it.verlezza.musiclab.candidate.swipe02finalpolish'" /tmp/badging.txt
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-CANDIDATA-SWIPE-02-FINAL-POLISH
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          retention-days: 14
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git rm -f .github/workflows/uab-candidate-swipe02-final-polish.yml
          git commit -m "chore(uab): remove temporary final polish workflow"
          git push origin HEAD:candidate/musiclab-swipe-player-sync-02
