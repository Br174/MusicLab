name: Apply MusicLab Cover Patch

on:
  push:
    branches: ["musiclab-lab"]
    paths:
      - ".github/workflows/apply-musiclab-cover-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: musiclab-lab
          fetch-depth: 0

      - name: Patch MusicLab player menu
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          player_path = Path('app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt')
          text = player_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          # Import the isolated cover-search UI.
          replace_once(
              'import com.metrolist.music.ui.component.YouTubeMatchDialog\n',
              'import com.metrolist.music.ui.component.YouTubeMatchDialog\nimport com.metrolist.music.ui.component.CoverSearchDialog\n',
              'CoverSearchDialog import',
          )

          # One new dialog state; no existing state is changed.
          replace_once(
              '''    var showYouTubeMatchDialog by rememberSaveable {
                  mutableStateOf(false)
              }

              var showQobuzMatchDialog by rememberSaveable {''',
              '''    var showYouTubeMatchDialog by rememberSaveable {
                  mutableStateOf(false)
              }

              var showCoverSearchDialog by rememberSaveable {
                  mutableStateOf(false)
              }

              var showQobuzMatchDialog by rememberSaveable {''',
              'cover dialog state',
          )

          # Resolve canonical YouTube artist/album IDs from the already-playing
          # YouTube video. This is important for Spotify-backed tracks, whose
          # source metadata may carry non-YouTube IDs.
          nav_block = '''    val resolvedNavigationSong by produceState<com.metrolist.innertube.models.SongItem?>(
              initialValue = null,
              mediaMetadata.id,
          ) {
              value = kotlinx.coroutines.withContext(Dispatchers.IO) {
                  YouTube.queue(listOf(mediaMetadata.id)).getOrNull()?.firstOrNull()
              }
          }

          val navigationArtists =
              resolvedNavigationSong?.artists
                  ?.mapNotNull { item ->
                      item.id?.let { id -> MediaMetadata.Artist(id = id, name = item.name) }
                  }
                  ?.takeIf { it.isNotEmpty() }
                  ?: artists

          val navigationAlbumId = resolvedNavigationSong?.album?.id ?: mediaMetadata.album?.id
          val navigationAlbumTitle = resolvedNavigationSong?.album?.name ?: mediaMetadata.album?.title
          val navigationAlbumIsPodcast = navigationAlbumId?.let { !it.startsWith("MPREb_") } ?: false

          '''
          replace_once(
              '    AddToSpotifyPlaylistFlow(\n',
              nav_block + '    AddToSpotifyPlaylistFlow(\n',
              'navigation metadata insertion',
          )

          # Cover results are played temporarily. Deliberately no
          # SpotifyYouTubeMapper.overrideMatch call is made here.
          cover_dialog = '''    if (showCoverSearchDialog) {
              CoverSearchDialog(
                  title = mediaMetadata.title,
                  originalArtist = mediaMetadata.artists.firstOrNull()?.name.orEmpty(),
                  durationSec = mediaMetadata.duration,
                  currentYouTubeId = mediaMetadata.id,
                  onSelect = { song ->
                      playerConnection.playNext(song.toMediaItem())
                      playerConnection.seekToNext()
                      playerBottomSheetState.collapseSoft()
                      onDismiss()
                  },
                  onDismiss = { showCoverSearchDialog = false },
              )
          }

          '''
          replace_once(
              '    val listenTogetherManager = LocalListenTogetherManager.current\n',
              cover_dialog + '    val listenTogetherManager = LocalListenTogetherManager.current\n',
              'cover dialog insertion',
          )

          # Reuse the existing multi-artist chooser with canonical YouTube IDs.
          replace_once(
              '            items(artists) { artist ->\n',
              '            items(navigationArtists) { artist ->\n',
              'artist chooser source',
          )

          # Add the three persistent entries immediately before the existing
          # Details item shown in Bruno's screenshot. Nothing below is replaced.
          details_marker = '''                        add(
                                      Material3MenuItemData(
                                          title = { Text(text = stringResource(R.string.details)) },'''
          persistent_actions = '''                        add(
                                      Material3MenuItemData(
                                          title = { Text(text = stringResource(R.string.go_to_artist)) },
                                          description = {
                                              Text(
                                                  text = mediaMetadata.artists.joinToString { it.name },
                                                  maxLines = 1,
                                                  overflow = TextOverflow.Ellipsis,
                                              )
                                          },
                                          icon = {
                                              Icon(
                                                  painter = painterResource(R.drawable.artist),
                                                  contentDescription = null,
                                                  modifier = Modifier.size(24.dp),
                                              )
                                          },
                                          onClick = {
                                              when {
                                                  navigationArtists.size == 1 -> {
                                                      navController.navigate("artist/${navigationArtists[0].id}")
                                                      playerBottomSheetState.collapseSoft()
                                                      onDismiss()
                                                  }
                                                  navigationArtists.size > 1 -> {
                                                      showSelectArtistDialog = true
                                                  }
                                                  else -> {
                                                      Toast.makeText(context, R.string.artist_unavailable, Toast.LENGTH_SHORT).show()
                                                  }
                                              }
                                          },
                                      ),
                                  )

                                  add(
                                      Material3MenuItemData(
                                          title = { Text(text = stringResource(R.string.go_to_album)) },
                                          description = {
                                              navigationAlbumTitle?.let { title ->
                                                  Text(
                                                      text = title,
                                                      maxLines = 1,
                                                      overflow = TextOverflow.Ellipsis,
                                                  )
                                              }
                                          },
                                          icon = {
                                              Icon(
                                                  painter = painterResource(if (navigationAlbumIsPodcast) R.drawable.mic else R.drawable.album),
                                                  contentDescription = null,
                                                  modifier = Modifier.size(24.dp),
                                              )
                                          },
                                          onClick = {
                                              val albumId = navigationAlbumId
                                              if (albumId.isNullOrBlank()) {
                                                  Toast.makeText(context, R.string.album_unavailable, Toast.LENGTH_SHORT).show()
                                              } else {
                                                  if (navigationAlbumIsPodcast) {
                                                      navController.navigate("online_podcast/$albumId")
                                                  } else {
                                                      navController.navigate("album/$albumId")
                                                  }
                                                  playerBottomSheetState.collapseSoft()
                                                  onDismiss()
                                              }
                                          },
                                      ),
                                  )

                                  add(
                                      Material3MenuItemData(
                                          title = { Text(text = stringResource(R.string.find_covers)) },
                                          description = { Text(text = stringResource(R.string.find_covers_desc)) },
                                          icon = {
                                              Icon(
                                                  painter = painterResource(R.drawable.link),
                                                  contentDescription = null,
                                                  modifier = Modifier.size(24.dp),
                                              )
                                          },
                                          onClick = { showCoverSearchDialog = true },
                                      ),
                                  )

          '''
          replace_once(
              details_marker,
              persistent_actions + details_marker,
              'persistent actions insertion',
          )

          player_path.write_text(text)

          # Strengthen same-song discovery by including the original performer
          # in the first searches, while still allowing other artists in results.
          cover_path = Path('app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchDialog.kt')
          cover = cover_path.read_text()
          old_queries = '''    val queries = linkedSetOf(
                  "$cleanTitle cover",
                  "$cleanTitle live",
                  "$cleanTitle acoustic",
                  "$cleanTitle version",
                  "$cleanTitle tribute",
                  cleanTitle,
              )'''
          new_queries = '''    val queries = linkedSetOf<String>().apply {
                  if (originalArtist.isNotBlank()) {
                      add("$cleanTitle $originalArtist cover")
                      add("$cleanTitle $originalArtist version")
                      add("$cleanTitle $originalArtist")
                  }
                  add("$cleanTitle cover")
                  add("$cleanTitle live")
                  add("$cleanTitle acoustic")
                  add("$cleanTitle tribute")
                  add(cleanTitle)
              }'''
          count = cover.count(old_queries)
          if count != 1:
              raise SystemExit(f'cover query strengthening: expected exactly 1 match, found {count}')
          cover_path.write_text(cover.replace(old_queries, new_queries, 1))
          PY

      - name: Sanity checks
        shell: bash
        run: |
          set -e
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt
          COVER=app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchDialog.kt
          test "$(grep -c 'R.string.go_to_artist' "$PLAYER")" -eq 1
          test "$(grep -c 'R.string.go_to_album' "$PLAYER")" -eq 1
          test "$(grep -c 'R.string.find_covers' "$PLAYER")" -eq 1
          test "$(grep -c 'CoverSearchDialog(' "$PLAYER")" -eq 1
          grep -q 'items(navigationArtists)' "$PLAYER"
          grep -q 'sameWorkScore' "$COVER"
          grep -q 'originalArtist cover' "$COVER"

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MusicLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchDialog.kt
          git commit -m "feat: add persistent artist album and cover actions"
          git push origin HEAD:musiclab-lab
