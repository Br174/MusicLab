name: TMP Originali Cover

on:
  push:
    branches:
      - lab/musiclab-playback-403-recovery-01
    paths:
      - .github/workflows/_tmp_apply_originali_cover_tiles.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/uab/apply_originali_cover.py
      - name: Commit application changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp_apply_originali_cover_tiles.yml
          rm -f .github/uab/apply_originali_cover.py
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(player): add Originali and Cover quick actions"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
