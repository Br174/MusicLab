name: MusicLab Turbo LAB67 YouTube Streaming Manual Rounds Signed APK ZIP
on:
  push:
    branches:
      - lab/musiclab-turbo-lab67-quality-finalize-fluidity-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # LAB67 resume recovery: prior runner remains stuck in_progress without steps.
  # Keep the repaired build independent of that stale concurrency reservation.
  group: musiclab-turbo-lab67-quality-fluidity-v1
  cancel-in-progress: true

jobs:
  test-and-build:
    name: LAB67 preserve user-verified LAB66 and refine first-round quality, twins, completion and fluidity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRASH_REPORT_TOKEN: ''
      CRASH_REPORT_REPO: ''
      LASTFM_API_KEY: ''
      LASTFM_SECRET: ''
    steps:
      - name: Checkout isolated LAB67 and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Guard protected LAB66 golden baseline and no production or player edits
        shell: bash
        run: |
          set -euo pipefail
          GOOD=26f652fd34cbf6856d76c6efc8baf3fd14bf333f
          git merge-base --is-ancestor "$GOOD" HEAD
          git diff --check "$GOOD" HEAD
          git diff --name-only "$GOOD" HEAD > /tmp/lab67-only.txt
          cat /tmp/lab67-only.txt
          while IFS= read -r path; do
            case "$path" in
              app/src/main/kotlin/com/metrolist/music/ui/component/CoverDiscoverySources.kt|app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt|app/src/main/kotlin/com/metrolist/music/ui/component/CoverLabTurboTwinGuard.kt|app/src/test/kotlin/com/metrolist/music/ui/component/CoverLabTurboTwinGuardTest.kt|behaviors/musiclab-cover.json|cloudflare/music-intelligence/test/turbo-lab67-verified-good-refinements.test.mjs|tools/universal-apk-builder/prepare-turbo-lab67-quality-fluidity-env.py|.github/workflows/musiclab-turbo-lab67-quality-fluidity-apk.yml) ;;
              *) echo "LAB66 GOLDEN SCOPE VIOLATION: $path"; exit 1 ;;
            esac
          done </tmp/lab67-only.txt
          for protected in app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverRoundSearchPlan.kt app/src/main/kotlin/com/metrolist/music/ui/component/CoverLabTurboRoundAdmission.kt app/src/main/kotlin/com/metrolist/music/ui/screens/settings/CoverCompilationSettings.kt app/src/main/AndroidManifest.xml app/build.gradle.kts; do
            test "$(git hash-object "$protected")" = "$(git rev-parse "$GOOD:$protected")"
          done
          test -z "$(git diff --name-only "$GOOD" HEAD -- cloudflare/music-intelligence/src/)"
          echo "LAB66 known-good direct video and native player preserved"
      - name: LAB67 canonical memory, YouTube video-first, manual rounds, legacy audio isolation regression
        run: |
          node --test cloudflare/music-intelligence/test/turbo-lab66-behavior-memory-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab67-verified-good-refinements.test.mjs cloudflare/music-intelligence/test/turbo-lab49-audio-stability-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-recording-identity.test.mjs

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Prepare same-family Android versionCode 33069
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-lab67-quality-fluidity-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33069"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
      - name: Android JVM LAB67 stack recorder, Cover reentry and audio regression
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary
      - name: Diagnose and compile the signed LAB67 APK ZIP
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          bash tools/universal-apk-builder/build-apk.sh .
      - name: Inspect exact installer identity, signature and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/uab/apk/MusicLab-Turbo-LAB67.apk
          ZIP=dist/uab/MusicLab-Turbo-LAB67-APK.zip
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33069'"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          printf '%s\n' "$CERT_OUTPUT" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$CERT" = "9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
          printf 'APPLICATION_ID=it.verlezza.musiclab.turbo01\nVERSION_CODE=33069\nSIGNING_SHA256=%s\nBASE_SHA=4453eaee2be45babef9934aa91a654d5f274f3ab\n' "$CERT" > dist/uab/UPDATE_FAMILY.txt
      - name: Publish installable APK and ZIP
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MusicLab-Turbo-LAB67-QualityFluidity-APK-ZIP
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB67.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-LAB67-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

