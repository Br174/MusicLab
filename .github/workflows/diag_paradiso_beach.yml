name: TEMP - Diagnose Paradiso beach playback

on:
  push:
    branches:
      - 'uab-build/musiclab-playback-403-recovery-01'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8f5009e9b046f11171852273d0f03f26575806e
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create targeted network diagnostic test
        shell: bash
        run: |
          mkdir -p innertube/build/reports/yt403
          cat > innertube/src/test/kotlin/com/metrolist/innertube/ParadisoBeachDiagnosticsTest.kt <<'KOT'
          package com.metrolist.innertube

          import com.metrolist.innertube.models.SongItem
          import com.metrolist.innertube.models.YouTubeClient
          import kotlinx.coroutines.runBlocking
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.junit.Test
          import java.io.File
          import java.util.concurrent.TimeUnit

          class ParadisoBeachDiagnosticsTest {
              private val http by lazy {
                  OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .build()
              }

              private fun queryParam(url: String, key: String): String? =
                  runCatching {
                      url.substringAfter('?', "")
                          .split('&')
                          .firstOrNull { it.substringBefore('=') == key }
                          ?.substringAfter('=', "")
                  }.getOrNull()

              @Test
              fun diagnoseExactTrack() = runBlocking {
                  val out = File("innertube/build/reports/yt403/paradiso-beach.txt")
                  out.parentFile.mkdirs()
                  out.writeText("")
                  fun emit(s: String) {
                      println(s)
                      out.appendText(s + "\n")
                  }

                  val visitor = YouTube.visitorData().getOrNull()
                  YouTube.visitorData = visitor
                  emit("VISITOR_DATA=${if (visitor == null) "UNAVAILABLE" else "AVAILABLE"}")
                  check(visitor != null) { "Could not bootstrap YouTube visitorData" }

                  val query = "Paradiso beach Cartoon Band"
                  val search = YouTube.search(query, YouTube.SearchFilter.FILTER_SONG).getOrThrow()
                  val songs = search.items.filterIsInstance<SongItem>()
                  emit("QUERY=$query")
                  emit("RESULTS=${songs.size}")
                  songs.take(10).forEachIndexed { i, s ->
                      emit("SEARCH[$i] id=${s.id} title=${s.title} artists=${s.artists.joinToString { it.name }} album=${s.album?.name} duration=${s.duration} type=${s.musicVideoType}")
                  }

                  val matches = songs.filter {
                      it.title.contains("Paradiso", ignoreCase = true) ||
                          it.artists.any { a -> a.name.contains("Cartoon Band", ignoreCase = true) }
                  }.ifEmpty { songs.take(3) }
                  check(matches.isNotEmpty()) { "No candidate song returned by YouTube Music search" }

                  emit("CANDIDATES=${matches.size}")

                  val clients = listOf(
                      "VISIONOS" to YouTubeClient.VISIONOS,
                      "ANDROID_VR_1_65_10" to YouTubeClient.ANDROID_VR_1_65_10,
                      "TVHTML5" to YouTubeClient.TVHTML5,
                      "ANDROID_VR_1_43_32" to YouTubeClient.ANDROID_VR_1_43_32,
                      "IPADOS" to YouTubeClient.IPADOS,
                      "IOS" to YouTubeClient.IOS,
                      "WEB_CREATOR" to YouTubeClient.WEB_CREATOR,
                      "WEB_REMIX" to YouTubeClient.WEB_REMIX,
                  )

                  for (song in matches.take(4)) {
                      val videoId = song.id
                      emit("=== VIDEO id=$videoId title=${song.title} artists=${song.artists.joinToString { it.name }} share=${song.shareLink} ===")

                      for ((name, client) in clients) {
                          val r = YouTube.player(videoId, null, client, null, null).getOrNull()
                          if (r == null) {
                              emit("CLIENT $name response=NULL")
                              continue
                          }
                          val formats = r.streamingData?.adaptiveFormats.orEmpty()
                          val audio = formats.filter { it.isAudio }
                          val chosen = audio.maxByOrNull { it.bitrate }
                          val direct = chosen?.url
                          val cipher = !chosen?.signatureCipher.isNullOrEmpty() || !chosen?.cipher.isNullOrEmpty()
                          val bareAudio = audio.count { it.url.isNullOrEmpty() && it.signatureCipher.isNullOrEmpty() && it.cipher.isNullOrEmpty() }
                          emit("CLIENT $name status=${r.playabilityStatus.status} reason=${r.playabilityStatus.reason} expires=${r.streamingData?.expiresInSeconds} formats=${formats.size} audio=${audio.size} bareAudio=$bareAudio chosenItag=${chosen?.itag} direct=${!direct.isNullOrEmpty()} cipher=$cipher")
                          if (!direct.isNullOrEmpty()) {
                              val expire = queryParam(direct, "expire")
                              val req = Request.Builder().url(direct).header("Range", "bytes=0-524287").build()
                              val code = runCatching { http.newCall(req).execute().use { it.code } }.getOrElse { -1 }
                              emit("  DIRECT_GET code=$code expire=$expire")
                          }
                      }

                      val np = runCatching { NewPipeExtractor.newPipePlayer(videoId) }.getOrElse {
                          emit("NEWPIPE exception=${it::class.simpleName}:${it.message}")
                          emptyList()
                      }
                      emit("NEWPIPE urls=${np.size} itags=${np.joinToString { it.first.toString() }}")
                      np.take(8).forEach { (itag, url) ->
                          val req = Request.Builder().url(url).header("Range", "bytes=0-524287").build()
                          val code = runCatching { http.newCall(req).execute().use { it.code } }.getOrElse { -1 }
                          emit("  NEWPIPE itag=$itag code=$code expire=${queryParam(url, "expire")}")
                      }
                  }
              }
          }
          KOT

      - name: Run exact-track network diagnostics
        shell: bash
        run: |
          set +e
          ./gradlew :innertube:testDebugUnitTest --tests '*ParadisoBeachDiagnosticsTest*' -i > innertube/build/reports/yt403/gradle.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '--- compact Gradle failure ---'
            grep -nE '(^e: |error:|Unresolved reference|FAILURE:|What went wrong|Compilation error|FAILED|ClientRequestException|IllegalStateException)' innertube/build/reports/yt403/gradle.log | tail -160 || true
          fi
          exit "$rc"

      - name: Print diagnostic report
        if: always()
        shell: bash
        run: |
          echo '--- Paradiso beach report ---'
          cat innertube/build/reports/yt403/paradiso-beach.txt || true

      - name: Upload diagnostic report and Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradiso-beach-diagnostics
          path: |
            innertube/build/reports/yt403/paradiso-beach.txt
            innertube/build/reports/yt403/gradle.log
          if-no-files-found: warn
          retention-days: 7
