name: TEMP - Diagnose Paradiso beach extraction paths

on:
  push:
    branches:
      - 'uab-build/musiclab-playback-403-recovery-01'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8f5009e9b046f11171852273d0f03f26575806e
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve exact video and probe latest yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          python3 -m pip install --quiet --upgrade yt-dlp
          yt-dlp --flat-playlist --no-warnings \
            --print '%(id)s|%(title)s|%(channel)s|%(duration_string)s' \
            'ytsearch10:Paradiso beach Cartoon Band' > diag/search-results.txt 2> diag/search-error.txt
          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for line in Path('diag/search-results.txt').read_text(errors='replace').splitlines():
              p=line.split('|',3)
              if len(p)>=3: rows.append(p)
          def score(r):
              t=r[1].casefold().strip(); c=r[2].casefold().strip(); s=0
              if t=='paradiso beach': s+=100
              elif 'paradiso beach' in t: s+=50
              if 'cartoon band' in c: s+=40
              if 'topic' in c: s+=5
              return s
          rows.sort(key=score, reverse=True)
          if not rows or score(rows[0])<50: raise SystemExit('No exact track')
          best=rows[0]
          Path('diag/video-id.txt').write_text(best[0])
          Path('diag/selected.txt').write_text('|'.join(best))
          print('SELECTED='+'|'.join(best))
          PY
          echo "VIDEO_ID=$(cat diag/video-id.txt)" >> "$GITHUB_ENV"
          set +e
          yt-dlp -v --skip-download -F "https://www.youtube.com/watch?v=$(cat diag/video-id.txt)" > diag/ytdlp-formats.txt 2> diag/ytdlp-verbose.txt
          echo $? > diag/ytdlp-exit.txt
          set -e
          echo '--- yt-dlp selected ---'; cat diag/selected.txt; echo
          echo '--- yt-dlp formats ---'; cat diag/ytdlp-formats.txt || true
          echo '--- yt-dlp key verbose lines ---'
          grep -Ei 'player client|client|po.?token|sabr|format|login|required|unavailable|unplayable|webpage|extractor|warning|error' diag/ytdlp-verbose.txt | tail -180 || true

      - name: Create standalone NewPipe exact-video probe
        shell: bash
        run: |
          cat > innertube/src/test/kotlin/com/metrolist/innertube/ParadisoStandaloneNewPipeTest.kt <<'KOT'
          package com.metrolist.innertube

          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.junit.Test
          import java.util.concurrent.TimeUnit

          class ParadisoStandaloneNewPipeTest {
              @Test
              fun exactVideo() {
                  val id = System.getenv("VIDEO_ID") ?: error("VIDEO_ID missing")
                  println("NP_VIDEO=$id")
                  val sts = NewPipeExtractor.getSignatureTimestamp(id)
                  println("NP_STS success=${sts.isSuccess} value=${sts.getOrNull()} error=${sts.exceptionOrNull()?.message}")
                  val urls = runCatching { NewPipeExtractor.newPipePlayer(id) }
                  println("NP_PLAYER success=${urls.isSuccess} error=${urls.exceptionOrNull()?.javaClass?.simpleName}:${urls.exceptionOrNull()?.message}")
                  val list = urls.getOrDefault(emptyList())
                  println("NP_URLS count=${list.size} itags=${list.joinToString { it.first.toString() }}")
                  val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(15, TimeUnit.SECONDS).build()
                  list.take(12).forEach { (itag, url) ->
                      val code = runCatching {
                          val req = Request.Builder().url(url).header("Range", "bytes=0-524287").build()
                          http.newCall(req).execute().use { it.code }
                      }.getOrDefault(-1)
                      println("NP_STREAM itag=$itag code=$code hasExpire=${Regex("[?&]expire=").containsMatchIn(url)}")
                  }
              }
          }
          KOT

      - name: Run standalone NewPipe probe
        shell: bash
        run: |
          set +e
          ./gradlew :innertube:testDebugUnitTest --tests '*ParadisoStandaloneNewPipeTest*' -i > diag/newpipe-gradle.log 2>&1
          rc=$?
          grep -nE 'NP_VIDEO|NP_STS|NP_PLAYER|NP_URLS|NP_STREAM|FAILED|Exception' diag/newpipe-gradle.log | tail -200 || true
          exit "$rc"

      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradiso-beach-extraction-paths
          path: |
            diag/*
          if-no-files-found: warn
          retention-days: 7
