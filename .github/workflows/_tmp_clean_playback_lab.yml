name: TMP Clean Playback LAB
on:
  push:
    branches:
      - lab/musiclab-playback-403-recovery-01
    paths:
      - .github/workflows/_tmp_clean_playback_lab.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean mother baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "UAB MusicLab"
          git config user.email "uab@musiclab.local"
          git show cf5ee85d0a6a2eeacddb2da9ca6a9b6c4e7cab33:app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt > app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt
          rm -f .github/workflows/_tmp_original_versions_probe.yml
          rm -f .github/workflows/_tmp_clean_playback_lab.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(lab): reset failed playback experiments before original versions"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
