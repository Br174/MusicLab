name: LAB20 Task5 UI Patch

on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - '.github/workflows/lab20-task5-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact Cover and Originali review UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          cover = 'app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt'
          replace_exact(
              cover,
              'import androidx.compose.runtime.remember\n',
              'import androidx.compose.runtime.remember\nimport androidx.compose.runtime.rememberCoroutineScope\n',
              'Cover rememberCoroutineScope import',
          )
          replace_exact(
              cover,
              'import com.metrolist.music.utils.rememberPreference\n',
              'import com.metrolist.music.utils.SearchRoutes\nimport com.metrolist.music.utils.rememberPreference\n',
              'Cover SearchRoutes import',
          )
          replace_exact(
              cover,
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\n',
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\n',
              'Cover launch import',
          )
          replace_exact(
              cover,
              '''    var detailCredits by remember(sessionKey) { mutableStateOf<GeminiVersionCredits?>(null) }\n    var detailLoading by remember(sessionKey) { mutableStateOf(false) }\n\n    fun categoryEnabled(category: AiCoverCategory): Boolean = when (category) {''',
              '''    var detailCredits by remember(sessionKey) { mutableStateOf<GeminiVersionCredits?>(null) }\n    var detailLoading by remember(sessionKey) { mutableStateOf(false) }\n    val brainReviewScope = rememberCoroutineScope()\n\n    fun categoryEnabled(category: AiCoverCategory): Boolean = when (category) {''',
              'Cover review coroutine scope',
          )
          replace_exact(
              cover,
              '''    fun replaceWith(result: AiCoverPlayable) {\n        val sourceId = currentYouTubeId?.takeIf { it.isNotBlank() } ?: return\n        service?.setYouTubeMatchOverride(\n            sourceId,\n            YouTubeMatchOverride(\n                videoId = result.song.id,\n                title = result.candidate.title,\n                artist = result.candidate.artist,\n                thumbnail = result.song.thumbnail,\n            ),\n        )\n        PlayerBottomSheetBridge.collapseToMiniPlayerNow()\n        navController.popBackStack()\n    }\n\n    val coverResults = playables.filter { it.candidate.category == AiCoverCategory.COVER }''',
              '''    fun replaceWith(result: AiCoverPlayable) {\n        val sourceId = currentYouTubeId?.takeIf { it.isNotBlank() } ?: return\n        service?.setYouTubeMatchOverride(\n            sourceId,\n            YouTubeMatchOverride(\n                videoId = result.song.id,\n                title = result.candidate.title,\n                artist = result.candidate.artist,\n                thumbnail = result.song.thumbnail,\n            ),\n        )\n        PlayerBottomSheetBridge.collapseToMiniPlayerNow()\n        navController.popBackStack()\n    }\n\n    fun updateBrainCandidate(updated: AiCoverCandidate) {\n        knownCandidates = knownCandidates.map { candidate ->\n            if (candidate.stableKey == updated.stableKey) updated else candidate\n        }\n        playables = playables.map { playable ->\n            if (playable.candidate.stableKey == updated.stableKey) playable.copy(candidate = updated) else playable\n        }\n        session.knownCandidates = knownCandidates\n        session.playables = playables\n    }\n\n    fun saveBrainDecision(result: AiCoverPlayable, status: AiBrainDecisionStatus) {\n        val config = geminiConfig ?: return\n        val sourceTitle = originalInfo?.title?.ifBlank { title } ?: title\n        val sourceArtist = originalInfo?.artist?.ifBlank { originalArtist } ?: originalArtist\n        brainReviewScope.launch {\n            val saved = CloudMusicDiscovery.saveBrainDecision(\n                originalTitle = sourceTitle,\n                originalArtist = sourceArtist,\n                candidate = result.candidate,\n                status = status,\n                config = config,\n            )\n            if (saved) updateBrainCandidate(result.candidate.copy(brainStatus = status))\n        }\n    }\n\n    fun verifyCandidateBetter(result: AiCoverPlayable) {\n        val config = geminiConfig ?: return\n        val sourceTitle = originalInfo?.title?.ifBlank { title } ?: title\n        val sourceArtist = originalInfo?.artist?.ifBlank { originalArtist } ?: originalArtist\n        brainReviewScope.launch {\n            CloudMusicDiscovery.verifyCandidate(\n                originalTitle = sourceTitle,\n                originalArtist = sourceArtist,\n                candidate = result.candidate,\n                mode = "cover",\n                config = config,\n            )?.let(::updateBrainCandidate)\n        }\n    }\n\n    val coverResults = playables.filter { it.candidate.category == AiCoverCategory.COVER }''',
              'Cover review action functions',
          )
          replace_exact(
              cover,
              '''    val selectedResults = AiCoverageFilter.visibleItems(selectedTabResults, selectedCoverageMode) { it.candidate }\n    val shouldLoadNextPage by remember {''',
              '''    val reviewResults = selectedTabResults.filter { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN }\n    val selectedResults = AiCoverageFilter.visibleItems(\n        selectedTabResults.filterNot { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN },\n        selectedCoverageMode,\n    ) { it.candidate }\n    val shouldLoadNextPage by remember {''',
              'Cover separate review projection',
          )
          replace_exact(
              cover,
              '''                                AiCoverResultRow(\n                                    result = result,\n                                    onPlay = { play(result.song) },\n                                    onReplace = { replaceWith(result) },\n                                    onDetails = { detailResult = result },\n                                    onLongClick = {''',
              '''                                AiCoverResultRow(\n                                    result = result,\n                                    onPlay = { play(result.song) },\n                                    onReplace = { replaceWith(result) },\n                                    onDetails = { detailResult = result },\n                                    onTitleSearch = { navController.navigate(SearchRoutes.resultRoute(result.candidate.title)) },\n                                    onLongClick = {''',
              'Cover title raw search callback',
          )
          replace_exact(
              cover,
              '''                        } else if (backgroundLoading) {\n                            item {\n                                Row(modifier = Modifier.padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {\n                                    CircularProgressIndicator(modifier = Modifier.size(18.dp), strokeWidth = 2.dp)\n                                    Spacer(Modifier.width(8.dp))\n                                    Text("Cerco altre versioni in background…")\n                                }\n                            }\n                        } else if (failed) {''',
              '''                        } else if (backgroundLoading) {\n                            item {\n                                Row(modifier = Modifier.padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {\n                                    CircularProgressIndicator(modifier = Modifier.size(18.dp), strokeWidth = 2.dp)\n                                    Spacer(Modifier.width(8.dp))\n                                    Text("Cerco altre versioni in background…")\n                                }\n                            }\n                        } else if (failed) {''',
              'Cover no-op anchor guard',
          )
          anchor = '''                        }\n                    }\n                }\n\n                item { Spacer(Modifier.height(24.dp)) }'''
          review_block = '''                        }\n\n                        if (reviewResults.isNotEmpty()) {\n                            item {\n                                Spacer(Modifier.height(14.dp))\n                                CoverSectionTitle("Da verificare")\n                                Text(\n                                    "Risultati che il Brain conserva per una decisione esplicita.",\n                                    style = MaterialTheme.typography.bodySmall,\n                                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                                    modifier = Modifier.padding(bottom = 6.dp),\n                                )\n                            }\n                            items(\n                                items = reviewResults,\n                                key = { "review-${it.candidate.stableKey}-${it.song.id}" },\n                            ) { result ->\n                                AiCoverResultRow(\n                                    result = result,\n                                    onPlay = { play(result.song) },\n                                    onReplace = { replaceWith(result) },\n                                    onDetails = { detailResult = result },\n                                    onTitleSearch = { navController.navigate(SearchRoutes.resultRoute(result.candidate.title)) },\n                                    onLongClick = {\n                                        menuState.show {\n                                            YouTubeSongMenu(\n                                                song = result.song,\n                                                onDismiss = menuState::dismiss,\n                                            )\n                                        }\n                                    },\n                                )\n                                Row(\n                                    modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),\n                                    horizontalArrangement = Arrangement.spacedBy(4.dp),\n                                ) {\n                                    TextButton(onClick = { play(result.song) }) { Text("Ascolta") }\n                                    TextButton(onClick = { saveBrainDecision(result, AiBrainDecisionStatus.APPROVED) }) { Text("Conferma") }\n                                    TextButton(onClick = { saveBrainDecision(result, AiBrainDecisionStatus.REJECTED) }) { Text("Rifiuta") }\n                                    TextButton(onClick = { verifyCandidateBetter(result) }) { Text("Verifica meglio") }\n                                }\n                                Spacer(Modifier.height(8.dp))\n                            }\n                        }\n                    }\n                }\n\n                item { Spacer(Modifier.height(24.dp)) }'''
          replace_exact(cover, anchor, review_block, 'Cover Da verificare review section')
          replace_exact(
              cover,
              '''    onReplace: () -> Unit,\n    onDetails: () -> Unit,\n    onLongClick: () -> Unit,\n) {''',
              '''    onReplace: () -> Unit,\n    onDetails: () -> Unit,\n    onTitleSearch: () -> Unit,\n    onLongClick: () -> Unit,\n) {''',
              'Cover result row title callback signature',
          )
          replace_exact(
              cover,
              '''            Text(result.candidate.title, style = MaterialTheme.typography.titleMedium, maxLines = 2, overflow = TextOverflow.Ellipsis)''',
              '''            Text(\n                result.candidate.title,\n                style = MaterialTheme.typography.titleMedium,\n                maxLines = 2,\n                overflow = TextOverflow.Ellipsis,\n                modifier = Modifier.clickable(onClick = onTitleSearch),\n            )''',
              'Cover clickable raw title',
          )

          original = 'app/src/main/kotlin/com/metrolist/music/ui/component/OriginalVersionScreen.kt'
          replace_exact(
              original,
              'import androidx.compose.runtime.remember\n',
              'import androidx.compose.runtime.remember\nimport androidx.compose.runtime.rememberCoroutineScope\n',
              'Original rememberCoroutineScope import',
          )
          replace_exact(
              original,
              'import com.metrolist.music.utils.rememberPreference\n',
              'import com.metrolist.music.utils.SearchRoutes\nimport com.metrolist.music.utils.rememberPreference\n',
              'Original SearchRoutes import',
          )
          replace_exact(
              original,
              '''    var detailResult by remember(request.currentYouTubeId) { mutableStateOf<CoverHubResult?>(null) }\n    var detailLoading by remember(request.currentYouTubeId) { mutableStateOf(false) }\n\n    // Load the starting version independently''',
              '''    var detailResult by remember(request.currentYouTubeId) { mutableStateOf<CoverHubResult?>(null) }\n    var detailLoading by remember(request.currentYouTubeId) { mutableStateOf(false) }\n    val brainReviewScope = rememberCoroutineScope()\n\n    // Load the starting version independently''',
              'Original review coroutine scope',
          )
          replace_exact(
              original,
              '''    fun preview(song: SongItem) {\n        connection?.playNext(song.toMediaItem())\n        connection?.seekToNext()\n        PlayerBottomSheetBridge.collapseToMiniPlayerNow()\n    }\n\n    val nonStudioIds =''',
              '''    fun preview(song: SongItem) {\n        connection?.playNext(song.toMediaItem())\n        connection?.seekToNext()\n        PlayerBottomSheetBridge.collapseToMiniPlayerNow()\n    }\n\n    fun updateBrainCandidate(updated: AiCoverCandidate) {\n        fun update(result: CoverHubResult): CoverHubResult =\n            if (result.brainCandidate?.stableKey == updated.stableKey) result.copy(brainCandidate = updated) else result\n\n        searchResult = searchResult.copy(\n            original = searchResult.original?.let(::update),\n            versions = searchResult.versions.map(::update),\n            liveVersions = searchResult.liveVersions.map(::update),\n            withOthersVersions = searchResult.withOthersVersions.map(::update),\n            remixVersions = searchResult.remixVersions.map(::update),\n        )\n    }\n\n    fun saveBrainDecision(result: CoverHubResult, status: AiBrainDecisionStatus) {\n        val candidate = result.brainCandidate ?: return\n        val identity = searchResult.aiIdentity ?: return\n        val sourceArtist = identity.originalArtists.firstOrNull().orEmpty()\n        val config = geminiConfig ?: return\n        if (sourceArtist.isBlank()) return\n        brainReviewScope.launch {\n            val saved = CloudMusicDiscovery.saveBrainDecision(\n                originalTitle = identity.title,\n                originalArtist = sourceArtist,\n                candidate = candidate,\n                status = status,\n                config = config,\n            )\n            if (saved) updateBrainCandidate(candidate.copy(brainStatus = status))\n        }\n    }\n\n    fun verifyCandidateBetter(result: CoverHubResult) {\n        val candidate = result.brainCandidate ?: return\n        val identity = searchResult.aiIdentity ?: return\n        val sourceArtist = identity.originalArtists.firstOrNull().orEmpty()\n        val config = geminiConfig ?: return\n        if (sourceArtist.isBlank()) return\n        brainReviewScope.launch {\n            CloudMusicDiscovery.verifyCandidate(\n                originalTitle = identity.title,\n                originalArtist = sourceArtist,\n                candidate = candidate,\n                mode = "originals",\n                config = config,\n            )?.let(::updateBrainCandidate)\n        }\n    }\n\n    val nonStudioIds =''',
              'Original review action functions',
          )
          replace_exact(
              original,
              '''    val filteredSelectedVersions = AiCoverageFilter.visibleItems(\n        selectedVersions,\n        selectedOriginalCoverageMode,\n    ) { it.brainCandidate }''',
              '''    val reviewVersions = selectedVersions.filter { it.brainCandidate?.brainStatus == AiBrainDecisionStatus.UNCERTAIN }\n    val filteredSelectedVersions = AiCoverageFilter.visibleItems(\n        selectedVersions.filterNot { it.brainCandidate?.brainStatus == AiBrainDecisionStatus.UNCERTAIN },\n        selectedOriginalCoverageMode,\n    ) { it.brainCandidate }''',
              'Original separate review projection',
          )
          replace_exact(
              original,
              '''                        val page = filteredSelectedVersions.take(visibleVersionCount)\n                        items(\n                            items = page,\n                            key = { "${selectedTab.name}-${it.song.id}" },\n                        ) { version ->\n                            OriginalVersionRow(\n                                result = version,\n                                credits = versionCredits[version.song.id],\n                                creditsLoading = creditsLoading,\n                                onPreview = { preview(version.song) },\n                                onReplace = { replaceWith(version.song) },\n                                onDetails = { detailResult = version },\n                            )\n                            Spacer(Modifier.height(8.dp))\n                        }''',
              '''                        val page = filteredSelectedVersions.take(visibleVersionCount)\n                        items(\n                            items = page,\n                            key = { "${selectedTab.name}-${it.song.id}" },\n                        ) { result ->\n                            OriginalVersionRow(\n                                result = result,\n                                credits = versionCredits[result.song.id],\n                                creditsLoading = creditsLoading,\n                                onPreview = { preview(result.song) },\n                                onReplace = { replaceWith(result.song) },\n                                onDetails = { detailResult = result },\n                                onTitleSearch = { navController.navigate(SearchRoutes.resultRoute(result.song.title)) },\n                            )\n                            Spacer(Modifier.height(8.dp))\n                        }\n\n                        if (reviewVersions.isNotEmpty()) {\n                            item {\n                                Spacer(Modifier.height(14.dp))\n                                VersionSectionTitle("Da verificare")\n                                Text(\n                                    "Versioni che il Brain conserva per una decisione esplicita.",\n                                    style = MaterialTheme.typography.bodySmall,\n                                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                                    modifier = Modifier.padding(bottom = 6.dp),\n                                )\n                            }\n                            items(\n                                items = reviewVersions,\n                                key = { "review-${selectedTab.name}-${it.song.id}" },\n                            ) { result ->\n                                OriginalVersionRow(\n                                    result = result,\n                                    credits = versionCredits[result.song.id],\n                                    creditsLoading = creditsLoading,\n                                    onPreview = { preview(result.song) },\n                                    onReplace = { replaceWith(result.song) },\n                                    onDetails = { detailResult = result },\n                                    onTitleSearch = { navController.navigate(SearchRoutes.resultRoute(result.song.title)) },\n                                )\n                                Row(\n                                    modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),\n                                    horizontalArrangement = Arrangement.spacedBy(4.dp),\n                                ) {\n                                    TextButton(onClick = { preview(result.song) }) { Text("Ascolta") }\n                                    TextButton(onClick = { saveBrainDecision(result, AiBrainDecisionStatus.APPROVED) }) { Text("Conferma") }\n                                    TextButton(onClick = { saveBrainDecision(result, AiBrainDecisionStatus.REJECTED) }) { Text("Rifiuta") }\n                                    TextButton(onClick = { verifyCandidateBetter(result) }) { Text("Verifica meglio") }\n                                }\n                                Spacer(Modifier.height(8.dp))\n                            }\n                        }''',
              'Original Da verificare review section',
          )
          replace_exact(
              original,
              '''    onPreview: () -> Unit,\n    onReplace: () -> Unit,\n    onDetails: () -> Unit,\n) {''',
              '''    onPreview: () -> Unit,\n    onReplace: () -> Unit,\n    onDetails: () -> Unit,\n    onTitleSearch: () -> Unit,\n) {''',
              'Original row title callback signature',
          )
          replace_exact(
              original,
              '''            Text(result.song.title, style = MaterialTheme.typography.titleMedium, maxLines = 2, overflow = TextOverflow.Ellipsis)''',
              '''            Text(\n                result.song.title,\n                style = MaterialTheme.typography.titleMedium,\n                maxLines = 2,\n                overflow = TextOverflow.Ellipsis,\n                modifier = Modifier.clickable(onClick = onTitleSearch),\n            )''',
              'Original clickable raw title',
          )

          # Starting-version row also uses OriginalVersionRow and must receive the new callback.
          replace_exact(
              original,
              '''                            onPreview = { preview(starting.song) },\n                            onReplace = { replaceWith(starting.song) },\n                            onDetails = { detailResult = starting },\n                        )''',
              '''                            onPreview = { preview(starting.song) },\n                            onReplace = { replaceWith(starting.song) },\n                            onDetails = { detailResult = starting },\n                            onTitleSearch = { navController.navigate(SearchRoutes.resultRoute(starting.song.title)) },\n                        )''',
              'Original starting-version title callback',
          )
          PY

          git diff --check
          node --test cloudflare/music-intelligence/test/task5-app-integration.test.mjs

      - name: Commit Task 5 review UI GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/kotlin/com/metrolist/music/ui/component/OriginalVersionScreen.kt
          git commit -m 'feat(lab20): complete Brain review actions'
          git push origin HEAD:${GITHUB_REF_NAME}
