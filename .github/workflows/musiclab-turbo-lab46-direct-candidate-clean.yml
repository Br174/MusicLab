name: MusicLab Turbo LAB46 Direct CANDIDATA CLEAN (same app family)
on:
  push:
    branches:
      - candidate-prep/musiclab-turbo-lab46-33047-cleanup-20261023
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musiclab-turbo-direct-candidate-clean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    name: same-family-candidate-clean-verified
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      # No diagnostics uploads and no Cloudflare-related credentials.
      CRASH_REPORT_TOKEN: ''
      CRASH_REPORT_REPO: ''
      LASTFM_API_KEY: ''
      LASTFM_SECRET: ''
    steps:
      - name: Checkout exact clean CANDIDATA source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Guard against ANY change to verified LAB46 search, graphics, player and manual Cloud
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=dbfed95eae0a40a13e4c103031ea75481054a638
          git cat-file -e "$SOURCE^{commit}"
          git diff --name-only "$SOURCE"..HEAD > /tmp/candidate-diff.txt
          while IFS= read -r f; do
            case "$f" in
              .motorlab/MOTORLAB_BOOT_CAPSULE.txt|.motorlab/MOTORLAB_LOCAL_CORE.txt|.motorlab/MOTORLAB_LOCAL_CORE_LAST_GOOD.txt|.motorlab/MOTORLAB_SYNC_STATE.txt|MOTORLAB_PROJECT_HOOK.txt|app/src/main/AndroidManifest.xml|app/src/main/kotlin/com/metrolist/music/ui/component/Lab46OwnerPairingActivity.kt|tools/universal-apk-builder/prepare-turbo-lab46-cloud-behavior-progressive-env.py|cloudflare/music-intelligence/test/turbo-lab46-manual-sync-native-contract.test.mjs|cloudflare/music-intelligence/test/turbo-candidate-direct-clean-gate.test.mjs|.github/workflows/musiclab-turbo-lab46-direct-candidate-clean.yml) ;;
              *) echo "FORBIDDEN candidate change: $f"; exit 1 ;;
            esac
          done </tmp/candidate-diff.txt
          test "$(git rev-parse "$SOURCE:app/src/main/kotlin/com/metrolist/music/ui/component/Lab46StagingSignedTransport.kt")" = "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/Lab46StagingSignedTransport.kt)"
          test "$(git rev-parse "$SOURCE:app/src/main/kotlin/com/metrolist/music/ui/component/Lab46ManualSyncActivity.kt")" = "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/Lab46ManualSyncActivity.kt)"
          test "$(git rev-parse "$SOURCE:app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt")" = "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt)"
          for f in \
            app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt \
            app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/CoverSameWorkGate.kt; do
            test "$(git rev-parse "$SOURCE:$f")" = "$(git hash-object "$f")"
          done
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base='dbfed95eae0a40a13e4c103031ea75481054a638'
          p='app/src/main/AndroidManifest.xml'
          old=subprocess.check_output(['git','show',f'{base}:{p}'],text=True)
          new=Path(p).read_text()
          start='        <!-- BEGIN LAB46 STAGING PAIRING ACTIVITY: public key only, no sync -->\n'
          end='        <!-- END LAB46 STAGING PAIRING ACTIVITY -->\n\n'
          assert old.count(start)==1 and old.count(end)==1
          cut=old[:old.index(start)]+old[old.index(end)+len(end):]
          assert new==cut, 'Original app manifest changed beyond removing obsolete technical Activity'
          assert 'Lab46ManualSyncActivity' in new
          assert 'musiclabturbo' not in new
          assert not Path('app/src/main/kotlin/com/metrolist/music/ui/component/Lab46OwnerPairingActivity.kt').exists()
          assert Path('.motorlab/MOTORLAB_BOOT_CAPSULE.txt').read_text().count('RELEASE=2026.10.22-r38')==1
          assert 'RELEASE=2026.10.14-r37' in Path('.motorlab/MOTORLAB_LOCAL_CORE_LAST_GOOD.txt').read_text()
          print('CANDIDATA direct conversion: only obsolete technical pairing removed, LAB46 user experience byte-exact')
          PY
      - name: Run 195 historic MusicLab regression contracts
        run: |
          node --test             cloudflare/music-intelligence/test/turbo-lab24-audio-fair-original.test.mjs             cloudflare/music-intelligence/test/turbo-lab25-archive-refresh-video-fair.test.mjs             cloudflare/music-intelligence/test/turbo-lab26-video-coverage-scheduler.test.mjs             cloudflare/music-intelligence/test/turbo-lab27-video-first-batch-refill.test.mjs             cloudflare/music-intelligence/test/turbo-lab28-crash-guards.test.mjs             cloudflare/music-intelligence/test/turbo-lab29-cover-ui-gesture.test.mjs             cloudflare/music-intelligence/test/turbo-lab30-theme-selected-cover.test.mjs             cloudflare/music-intelligence/test/turbo-lab31-readonly-audio-diagnostics.test.mjs             cloudflare/music-intelligence/test/turbo-lab32-header-spacing-arrow.test.mjs cloudflare/music-intelligence/test/turbo-lab34-approved-cover-header.test.mjs cloudflare/music-intelligence/test/turbo-lab35-five-filters-fit.test.mjs cloudflare/music-intelligence/test/turbo-lab36-final-approved-cover.test.mjs cloudflare/music-intelligence/test/turbo-lab37-slim-chips-only.test.mjs cloudflare/music-intelligence/test/turbo-lab38-compilation-theme-nav.test.mjs cloudflare/music-intelligence/test/turbo-lab39-unified-nav-colors-labels.test.mjs cloudflare/music-intelligence/test/turbo-lab40-work-identity-speed-artwork.test.mjs cloudflare/music-intelligence/test/turbo-lab41-verified-work-expansion.test.mjs cloudflare/music-intelligence/test/turbo-lab42-evidence-recovery.test.mjs cloudflare/music-intelligence/test/turbo-lab43-song-identity-refresh.test.mjs cloudflare/music-intelligence/test/turbo-lab44-manual-priority-work-refs.test.mjs cloudflare/music-intelligence/test/turbo-lab45-separated-actions-progressive-rounds.test.mjs cloudflare/music-intelligence/test/turbo-lab45-persistent-rounds.test.mjs
      - name: Run 48 LAB46 Cloud/manual synchronization contracts
        run: |
          node --test cloudflare/music-intelligence/test/turbo-lab46-cloud-complete-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-round-strategy-score100-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-staging-auth-outbox.test.mjs cloudflare/music-intelligence/test/turbo-lab46-cloud-roundtrip.test.mjs cloudflare/music-intelligence/test/turbo-lab46-sync-receipt.test.mjs cloudflare/music-intelligence/test/turbo-lab46-recording-identity.test.mjs cloudflare/music-intelligence/test/turbo-lab46-manual-sync-native-contract.test.mjs
      - name: Verify technical pairing is absent and active functionality unchanged
        run: node --test cloudflare/music-intelligence/test/turbo-candidate-direct-clean-gate.test.mjs
      - name: Offline D1 schema smoke test (no remote Cloud)
        run: python3 cloudflare/music-intelligence/test/lab46_d1_migration_smoke.py
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Setup protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Configure Android and stamp direct candidate in SAME LAB family
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-lab46-cloud-behavior-progressive-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33048"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
          grep -Fq 'UAB_FAMILY_SIGNING_KEY_B64_FILE=".uab/signing/musiclab-lab-family-01.jks.b64"' uab-project.env
      - name: Android JVM complete suite
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary
      - name: UAB diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .
      - name: Build same-family direct-candidate cleaned APK and ZIP
        run: bash tools/universal-apk-builder/build-apk.sh .
      - name: Confirm source provenance, Android identity, original signing cert and install-over
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/uab/apk/MusicLab-Turbo-CANDIDATA-LAB46.apk
          ZIP=dist/uab/MusicLab-Turbo-CANDIDATA-LAB46-APK.zip
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33048'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab Turbo LAB 46'"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          printf '%s\n' "$CERT_OUTPUT" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED=9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749
          echo "Observed public signing certificate SHA256: $CERT"
          test "$CERT" = "$EXPECTED"
          {
            echo "CANDIDATE_TYPE=DIRECT_SAME_FAMILY_SOURCE_CONVERSION"
            echo "USER_VERIFIED_SOURCE_SHA=dbfed95eae0a40a13e4c103031ea75481054a638"
            echo "CANDIDATE_CLEAN_SOURCE_SHA=$GITHUB_SHA"
            echo "APPLICATION_ID=it.verlezza.musiclab.turbo01"
            echo "VERSION_CODE=33048"
            echo "SIGNING_CERT_SHA256=$CERT"
            echo "LAB46_COVER_GRAPHICS_SEARCH_PLAYER=IDENTICAL_SOURCE"
            echo "LEGACY_TECHNICAL_PAIRING_ACTIVITY=REMOVED"
            echo "MANUAL_CLOUD_STAGING_RUNTIME=RETAINED_PENDING_SEPARATE_PROD_PLAN"
            echo "CLOUDFLARE_REMOTE_WRITES=0"
            echo "MAIN_AND_MADRE=UNMODIFIED"
          } > dist/uab/CANDIDATE_PROVENANCE.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
      - name: Upload APK ZIP and exact candidate provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-CANDIDATA-LAB46-CLEAN
          path: |
            dist/uab/apk/MusicLab-Turbo-CANDIDATA-LAB46.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-CANDIDATA-LAB46-APK.zip
            dist/uab/CANDIDATE_PROVENANCE.txt
            dist/uab/BUILD_SHA.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
