name: TEMP MusicLab LAB13 Final Build
on:
  push:
    branches: [uab-build/musiclab-meld-upstream-sync-13]
permissions:
  contents: read
concurrency:
  group: musiclab-lab13-final-build
  cancel-in-progress: false
jobs:
  build:
    if: contains(github.event.head_commit.message, 'LAB13 final build trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uab-build/musiclab-meld-upstream-sync-13
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Crea keystore debug temporaneo
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build LAB13
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          UAB_BUILD_ID: b20260929lab13final
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-MELD-UPSTREAM-SYNC-13
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
