name: MusicLab Turbo R11 Scudo360 r40 quality native pilot
on:
  pull_request:
    branches:
      - motorlab/active-musiclab-turbo
permissions:
  contents: read
  actions: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-protobuf
      - name: Prepare original same-family R11 Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-r11-scudo360-regression-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33084"' uab-project.env
      - name: Execute existing full JVM suite with r39 exact class attribution
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source uab-project.env
          set +a
          node .motorlab/regression/scudo360-gate-r40-pilot.mjs .motorlab/scudo360-contracts.json lab .motorlab/scudo360-r40-native.json
      - name: Verify permanent exact historical baseline and native workflow wiring
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const load=p=>JSON.parse(readFileSync(p,'utf8'));
          const plan=load('.motorlab/scudo360-r40-plan.json');
          const before=load(plan.baselineReportPath);
          if(before.commit!==plan.baselineCommit||before.passed!==true||
             !before.provenance?.runId||!before.provenance?.artifactId)
            throw Error('SCUDO_R40_ARCHIVED_ORIGINAL_BASELINE_INVALID');
          for(const file of [".github/workflows/musiclab-turbo-r10-empty-packet-apk.yml"]){
            const content=readFileSync(file,'utf8');
            const gate=content.indexOf('scudo360-gate.mjs');
            const quality=content.indexOf('scudo360-quality-r40.mjs',gate+1);
            if(gate<0||quality<gate||!content.slice(gate,quality).includes('scudo360-report.json'))
              throw Error('SCUDO_R40_NATIVE_WORKFLOW_BYPASS:'+file);
          }
          console.log('SCUDO_R40_PERMANENT_NATIVE_WIRING_VERIFIED');
          NODE
      - name: R40 audit existing executed suite without rerunning Gradle
        env:
          SCUDO360_R40_PROMOTION: '1'
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-r40-native.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-r40-quality.json
      - name: Preserve all proof including failed native tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scudo-r40-musiclab-native-proof
          path: |
            .motorlab/scudo360-r40-native.json
            .motorlab/scudo360-r40-quality.json
            app/build/test-results/testFossDebugUnitTest/*.xml
          if-no-files-found: warn
