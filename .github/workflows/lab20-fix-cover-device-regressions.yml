name: LAB20 One-shot Cover device regression fix

on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - '.github/workflows/lab20-fix-cover-device-regressions.yml'

permissions:
  contents: write

concurrency:
  group: lab20-one-shot-cover-device-regressions
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: uab-build/musiclab-ai-brain-20

      - name: Patch coverage projection and exact playback title identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt')
          text = path.read_text()
          old = "    val reviewResults = selectedTabResults.filter { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN }\n    val selectedResults = AiCoverageFilter.visibleItems(\n        selectedTabResults.filterNot { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN },\n        selectedCoverageMode,\n    ) { it.candidate }\n"
          new = "    val coverageVisibleResults = AiCoverageFilter.visibleItems(\n        selectedTabResults,\n        selectedCoverageMode,\n    ) { it.candidate }\n    val reviewResults = coverageVisibleResults.filter { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN }\n    val selectedResults = coverageVisibleResults.filterNot { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN }\n"
          if text.count(old) != 1:
              raise SystemExit(f'CoverSearchScreen coverage anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('app/src/main/kotlin/com/metrolist/music/ui/component/AiCoverSearchEngine.kt')
          text = path.read_text()
          anchor = "    private suspend fun searchAndPick(\n"
          helper_lines = [
              '    internal fun isPlaybackTitleCompatible(',
              '        candidate: AiCoverCandidate,',
              '        rawSongTitle: String,',
              '    ): Boolean {',
              '        val targetTitle = canonicalTitle(candidate.title)',
              '        if (targetTitle.isBlank()) return false',
              '',
              '        var resolvedTitle = canonicalTitle(rawSongTitle)',
              '        val targetArtist = canonicalArtist(candidate.artist)',
              '        if (targetArtist.isNotBlank()) {',
              '            resolvedTitle = when {',
              '                resolvedTitle.startsWith("$targetArtist ") -> resolvedTitle.removePrefix("$targetArtist ").trim()',
              '                resolvedTitle.endsWith(" $targetArtist") -> resolvedTitle.removeSuffix(" $targetArtist").trim()',
              '                else -> resolvedTitle',
              '            }',
              '        }',
              '        return resolvedTitle == targetTitle',
              '    }',
              '',
              '    private suspend fun searchAndPick(',
          ]
          helper = '\n'.join(helper_lines) + '\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'AiCoverSearchEngine helper anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper, 1)
          score_anchor = "    ): Int {\n        val songTitle = canonicalTitle(song.title)\n        val artistNames = song.artists.map { canonicalArtist(it.name) }\n"
          score_new = "    ): Int {\n        if (!isPlaybackTitleCompatible(candidate, song.title)) return 0\n\n        val songTitle = canonicalTitle(song.title)\n        val artistNames = song.artists.map { canonicalArtist(it.name) }\n"
          if text.count(score_anchor) != 1:
              raise SystemExit(f'AiCoverSearchEngine score anchor count={text.count(score_anchor)}')
          path.write_text(text.replace(score_anchor, score_new, 1))

          path = Path('cloudflare/music-intelligence/test/android-brain-contract-source.test.mjs')
          text = path.read_text()
          start = text.index("test('Cover separates UNCERTAIN review before coverage")
          end = text.index("test('Originali preserves Brain metadata", start)
          block_lines = [
              "test('Cover applies coverage to the complete tab before review split and pagination without joining discovery keys', () => {",
              "  assert.ok(coverScreen.includes('var selectedCoverageMode by remember(sessionKey) { mutableStateOf(AiCoverageMode.DEFAULT) }'));",
              "  assert.ok(compactCoverScreen.includes('val coverageVisibleResults = AiCoverageFilter.visibleItems( selectedTabResults, selectedCoverageMode,'));",
              "  assert.ok(compactCoverScreen.includes('val reviewResults = coverageVisibleResults.filter { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN }'));",
              "  assert.ok(compactCoverScreen.includes('val selectedResults = coverageVisibleResults.filterNot { it.candidate.brainStatus == AiBrainDecisionStatus.UNCERTAIN }'));",
              "  assert.ok(coverScreen.includes('AiCoverageSelector(\\n                                selected = selectedCoverageMode'));",
              "  const projectionIndex = coverScreen.indexOf('val coverageVisibleResults = AiCoverageFilter.visibleItems(');",
              "  const reviewIndex = coverScreen.indexOf('val reviewResults = coverageVisibleResults.filter');",
              "  const paginationIndex = coverScreen.indexOf('selectedResults.take(visibleResultCount)');",
              "  assert.ok(projectionIndex >= 0 && reviewIndex > projectionIndex);",
              "  assert.ok(paginationIndex > reviewIndex);",
              "  const discoveryEffectStart = coverScreen.indexOf('LaunchedEffect(\\n        sessionKey,');",
              "  const discoveryEffectBody = coverScreen.indexOf('    ) {', discoveryEffectStart);",
              "  assert.ok(discoveryEffectStart >= 0 && discoveryEffectBody > discoveryEffectStart);",
              "  const discoveryKeys = coverScreen.slice(discoveryEffectStart, discoveryEffectBody);",
              "  assert.ok(!discoveryKeys.includes('selectedCoverageMode'));",
              "});",
              '',
          ]
          block = '\n'.join(block_lines) + '\n'
          path.write_text(text[:start] + block + text[end:])
          PY
          git diff --check
          grep -n -A8 -B3 'coverageVisibleResults' app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt
          grep -n -A20 -B3 'isPlaybackTitleCompatible' app/src/main/kotlin/com/metrolist/music/ui/component/AiCoverSearchEngine.kt

      - name: Commit only Cover regression fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt app/src/main/kotlin/com/metrolist/music/ui/component/AiCoverSearchEngine.kt cloudflare/music-intelligence/test/android-brain-contract-source.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(lab20): close Cover device regressions'
          git push origin HEAD:uab-build/musiclab-ai-brain-20
