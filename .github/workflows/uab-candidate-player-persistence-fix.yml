name: UAB Candidate Player Persistence Fix

on:
  push:
    branches:
      - candidate/musiclab-swipe-player-sync-02
    paths:
      - .github/workflows/uab-candidate-player-persistence-fix.yml

permissions:
  contents: write

concurrency:
  group: uab-musiclab-candidate-player-persistence
  cancel-in-progress: true

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/musiclab-swipe-player-sync-02
          submodules: recursive
          fetch-depth: 0

      - name: Apply player persistence fix
        shell: bash
        run: python3 .uab/candidate_player_persistence_fix.py

      - name: Verify candidate app diff
        shell: bash
        run: |
          git fetch origin mother/musiclab-112726
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/mother/musiclab-112726 -- app/src/main/kotlin)
          printf 'App files vs Mother:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -qx 'app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt'
          printf '%s\n' "${changed[@]}" | grep -qx 'app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt'
          test -z "$(git diff origin/mother/musiclab-112726 -- app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt)"
          grep -q 'fun collapsePlayerBeforeNavigation()' app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt
          grep -q 'snapTo(playerBottomSheetState.collapsedBound)' app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt

      - name: Commit corrected candidate source
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt
          git commit -m "fix(player): collapse expanded player before navigation"
          git push origin HEAD:candidate/musiclab-swipe-player-sync-02

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create isolated debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Prepare isolated candidate config
        shell: bash
        run: |
          printf '%s\n' \
            'UAB_TASK=":app:assembleFossDebug"' \
            'UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"' \
            'UAB_OUTPUT_NAME="MusicLab-CANDIDATA-SWIPE-02-PERSISTENZA"' \
            'UAB_GRADLE_ARGS="-x lint"' \
            'UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"' \
            'UAB_PARALLEL_INSTALL="on"' \
            'UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.candidate"' \
            'UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"' \
            'UAB_APP_NAME_BASE="MusicLab Candidata Swipe 02 P"' \
            'UAB_APP_NAME_ENV="METROLIST_APP_NAME"' \
            'export PULL_REQUEST="false"' \
            > /tmp/uab-candidate-persistence.env

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build candidate APK and ZIP
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-candidate-persistence.env
          UAB_BUILD_ID: swipe02persistence
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .

      - name: Verify parallel package identity
        shell: bash
        run: |
          APK="$(find dist/uab/apk -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='it.verlezza.musiclab.candidate.swipe02persistence'" /tmp/apk-badging.txt

      - name: Upload candidate APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-CANDIDATA-SWIPE-02-PERSISTENZA
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary candidate tooling
        if: success()
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git rm -f .github/workflows/uab-candidate-player-persistence-fix.yml .uab/candidate_player_persistence_fix.py
          git commit -m "chore(uab): remove temporary candidate persistence tooling"
          git push origin HEAD:candidate/musiclab-swipe-player-sync-02
