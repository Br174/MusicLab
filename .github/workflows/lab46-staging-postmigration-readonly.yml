name: LAB46 isolated staging post-migration schema audit (read-only)

on:
  push:
    branches:
      - uab-build/musiclab-turbo-lab46-cloud-behavior-progressive-family-02
    paths:
      - .github/workflows/lab46-staging-postmigration-readonly.yml
      - cloudflare/music-intelligence/lab46-staging-only/staging_schema_postmigration_readonly.mjs
      - cloudflare/music-intelligence/lab46-staging-only/music_schema_additive_once.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab46-staging-postmigration-readonly
  cancel-in-progress: false

jobs:
  exact-schema-inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MUSICLAB_LAB46_CF_PREFLIGHT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '5781b597517f6f7fe25751170a99b9ab'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch, pristine checkout and exact SQL source
        run: |
          test "$(git branch --show-current)" = "uab-build/musiclab-turbo-lab46-cloud-behavior-progressive-family-02" || test "$GITHUB_REF_NAME" = "uab-build/musiclab-turbo-lab46-cloud-behavior-progressive-family-02"
          git diff --quiet
          test "$(git hash-object cloudflare/music-intelligence/lab46-staging-only/music_schema_additive_once.sql)" = "f847c5fe17d7b2280b0f64b90edc01a52f795526"
          node --check cloudflare/music-intelligence/lab46-staging-only/staging_schema_postmigration_readonly.mjs
      - name: Verify remotely applied LAB46 schema using exact D1 READ token
        run: node cloudflare/music-intelligence/lab46-staging-only/staging_schema_postmigration_readonly.mjs
