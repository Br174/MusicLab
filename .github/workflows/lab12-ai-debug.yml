name: MusicLab LAB12 - Debug AI Canonica

on:
  push:
    branches:
      - uab-build/musiclab-canonical-ai-repair-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout LAB12
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Interroga Gemini sul caso reale
        run: python3 .github/scripts/lab12_debug_ai.py
