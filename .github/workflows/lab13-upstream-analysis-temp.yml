name: TEMP LAB13 Upstream Analysis
on:
  push:
    branches:
      - uab-build/musiclab-upstream-guardian-13
permissions:
  contents: read
jobs:
  analyze:
    if: contains(github.event.head_commit.message, 'LAB13: analisi compatibilita upstream')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Meld upstream
        shell: bash
        run: |
          git remote add meld https://github.com/FrancescoGrazioso/Meld.git
          git fetch --no-tags meld main
          git fetch meld refs/tags/v0.8.9:refs/tags/meld-v0.8.9
          git fetch meld refs/tags/v0.9.2:refs/tags/meld-v0.9.2
      - name: Analyze ancestry and overlap
        shell: bash
        run: |
          set -e
          echo "## MusicLab ↔ Meld upstream analysis" | tee analysis.md
          echo "" | tee -a analysis.md
          echo "MusicLab head: $(git rev-parse HEAD)" | tee -a analysis.md
          echo "Meld base: $(git rev-parse meld-v0.8.9)" | tee -a analysis.md
          echo "Meld target: $(git rev-parse meld-v0.9.2)" | tee -a analysis.md
          echo "" | tee -a analysis.md
          if BASE=$(git merge-base HEAD meld-v0.8.9 2>/dev/null); then
            echo "Common ancestry: YES ($BASE)" | tee -a analysis.md
          else
            echo "Common ancestry: NO" | tee -a analysis.md
          fi
          git diff --name-only meld-v0.8.9..meld-v0.9.2 | sort -u > /tmp/upstream_files.txt
          if git merge-base HEAD meld-v0.8.9 >/tmp/base 2>/dev/null; then
            BASE=$(cat /tmp/base)
            git diff --name-only "$BASE"..HEAD | sort -u > /tmp/musiclab_files.txt
            comm -12 /tmp/upstream_files.txt /tmp/musiclab_files.txt > /tmp/overlap.txt
          else
            : > /tmp/musiclab_files.txt
            : > /tmp/overlap.txt
          fi
          echo "Upstream changed files: $(wc -l < /tmp/upstream_files.txt)" | tee -a analysis.md
          echo "MusicLab changed files since shared base: $(wc -l < /tmp/musiclab_files.txt)" | tee -a analysis.md
          echo "Directly overlapping files: $(wc -l < /tmp/overlap.txt)" | tee -a analysis.md
          echo "" | tee -a analysis.md
          echo "### Overlapping files" | tee -a analysis.md
          cat /tmp/overlap.txt | tee -a analysis.md
          echo "" | tee -a analysis.md
          echo "### Meld commits v0.8.9 → v0.9.2" | tee -a analysis.md
          git log --oneline --no-merges meld-v0.8.9..meld-v0.9.2 | tee -a analysis.md
          echo "" | tee -a analysis.md
          echo "### Upstream files" | tee -a analysis.md
          cat /tmp/upstream_files.txt | tee -a analysis.md
          cp analysis.md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: LAB13-Meld-0.9.2-analysis
          path: analysis.md
