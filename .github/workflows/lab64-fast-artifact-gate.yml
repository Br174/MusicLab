name: LAB64 Fast Artifact + LAB64 Update Artifact Gate

on:
  push:
    branches:
      - uab-build/musiclab-lab64-aggiornamento-family-01
    paths-ignore:
      - LAB64_BUILD_STATUS.txt
  pull_request:
    branches:
      - uab-build/musiclab-lab57-aggiornamento-family-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab64-fast-artifact-v1
  cancel-in-progress: true

jobs:
  validate:
    name: validate-once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact LAB64 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run retained LAB46-LAB64 behavioral contracts in one process
        run: |
          node --test cloudflare/music-intelligence/test/lab46-originals-retry-player-contract.test.mjs cloudflare/music-intelligence/test/lab46-red-retry-originals-player-contract.test.mjs cloudflare/music-intelligence/test/lab48-player-isolation-contract.test.mjs cloudflare/music-intelligence/test/lab49-cancellable-background-contract.test.mjs cloudflare/music-intelligence/test/lab50-direct-play-background-barrier-contract.test.mjs cloudflare/music-intelligence/test/lab51-cover-admission-score20-contract.test.mjs cloudflare/music-intelligence/test/lab52-cover-video-page-contract.test.mjs cloudflare/music-intelligence/test/lab53-cover-card-decisions-contract.test.mjs cloudflare/music-intelligence/test/lab54-cover-playback-pagination-card-contract.test.mjs cloudflare/music-intelligence/test/lab55-original-first-vertical-prefetch-playback-contract.test.mjs cloudflare/music-intelligence/test/lab56-opera-identity-collapsible-header-contract.test.mjs cloudflare/music-intelligence/test/lab57-work-ranking-playready-adaptive-audio-contract.test.mjs cloudflare/music-intelligence/test/lab58-compacted-ranked-fives-and-full-suite-contract.test.mjs cloudflare/music-intelligence/test/lab59-four-pillars-speed-fluidity-quantity-quality-contract.test.mjs cloudflare/music-intelligence/test/lab60-no-prestream-discogs-bounded-contract.test.mjs cloudflare/music-intelligence/test/lab61-ten-ranked-slots-playback-fluidity-contract.test.mjs cloudflare/music-intelligence/test/lab62-upstream-meld-player-and-cover-preview-contract.test.mjs cloudflare/music-intelligence/test/lab63-three-second-retry-stable-artwork-contract.test.mjs cloudflare/music-intelligence/test/lab64-ranked-video-original-first-cover-swipe-stability-contract.test.mjs

      - name: Prove experimental player is exact upstream Meld (no LAB41 alternate resolver)
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_PATH="app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt"
          MELD_BLOB="03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"
          test "$(git hash-object "$PLAYER_PATH")" = "$MELD_BLOB"
          ! grep -q 'LAB07_FAST_LANE_TIMEOUT_MS' "$PLAYER_PATH"
          grep -q 'bundle().extractor.extract(' "$PLAYER_PATH"

  build-update:
    name: build-update-first
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact LAB64 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-overwrite-existing: true
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB 64 aggiornamento
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify LAB 64 update identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-LAB64-aggiornamento.apk"
          ZIP="dist/uab/MusicLab-LAB64-aggiornamento-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.labupdate01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='6401'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB 64 aggiornamento'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=01"
            echo "APPLICATION_ID=it.verlezza.musiclab.labupdate01"
            echo "VERSION_CODE=6401"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "MELD_ORIGINAL_PLAYER_BLOB_SHA=03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"
            echo "MELD_UPSTREAM_COMMIT=9cb6105a5fe9077c6d4430b978209556f9405da3"
            echo "PAIRED_SAFETY=LAB61 immutata"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload LAB 64 aggiornamento immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB64-aggiornamento
          path: |
            dist/uab/apk/MusicLab-LAB64-aggiornamento.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB64-aggiornamento-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload separate diagnostics if present
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB64-build-diagnostics
          path: dist/uab/logs/*.log
          if-no-files-found: ignore
