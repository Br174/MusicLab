name: UAB CORE - MusicLab Originali AI Credits Performance LAB 08

on:
  push:
    branches:
      - 'uab-build/musiclab-originali-ai-credits-performance-08'

permissions:
  contents: read

concurrency:
  group: uab-musiclab-originali-ai-credits-performance-08
  cancel-in-progress: true

jobs:
  build:
    name: UAB MusicLab Originali AI Credits Performance LAB 08
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact LAB source
        uses: actions/checkout@v4
        with:
          ref: 1d6ca5044808cc4778ad4d0faf6b8d5e923f747a
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Configure LAB UAB identity
        shell: bash
        run: |
          cat > uab-project.env <<'EOF'
          UAB_TASK=":app:assembleFossDebug"
          UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"
          UAB_FILE_VERSION="ORIGINALI-AI-CREDITS-PERFORMANCE-08"
          UAB_OUTPUT_NAME="MusicLab-LAB-${UAB_FILE_VERSION}"
          UAB_BUILD_ID="originaliaicreditsperformance08"
          UAB_GRADLE_ARGS="-x lint --build-cache"
          UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"
          UAB_PARALLEL_INSTALL="on"
          UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.lab"
          UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"
          UAB_APP_NAME_BASE="MusicLab LAB Originali 08"
          UAB_APP_NAME_ENV="METROLIST_APP_NAME"
          export PULL_REQUEST="false"
          EOF

      - name: Create isolated debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Upload LAB APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-ORIGINALI-AI-CREDITS-PERFORMANCE-08
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
