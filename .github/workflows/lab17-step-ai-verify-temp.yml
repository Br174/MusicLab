name: MusicLab LAB17 - step AI verify temp

on:
  push:
    branches:
      - 'uab-build/musiclab-ai-step-player-17'

permissions:
  contents: write

concurrency:
  group: musiclab-lab17-step-ai
  cancel-in-progress: true

jobs:
  verify:
    name: LAB17 transform + regression + UAB
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout LAB17
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply LAB17 approved transformation
        shell: bash
        run: |
          python .github/scripts/lab17_transform.py
          git diff --check
          git status --short

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create isolated LAB debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt

      - name: Generate protobuf classes
        shell: bash
        run: bash .uab/pre-build.sh .

      - name: Run real regression JVM tests
        shell: bash
        run: ./gradlew --console=plain :app:testFossDebugUnitTest :innertube:testDebugUnitTest --warning-mode summary

      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB17 APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          UAB_BUILD_ID: lab17
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify LAB17 outputs
        shell: bash
        run: |
          test -n "$(find dist/uab/apk -maxdepth 1 -name '*.apk' -print -quit)"
          test -f dist/uab/MusicLab-LAB-17-APK.zip
          unzip -tq dist/uab/MusicLab-LAB-17-APK.zip
          cat dist/uab/apk/SHA256SUMS.txt

      - name: Persist verified LAB17 source
        shell: bash
        run: |
          git config user.name "Br174"
          git config user.email "brunoverlezza@gmail.com"
          git add \
            app/src/main/kotlin/com/metrolist/music/MainActivity.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/GeminiAiCoverDiscovery.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/AiCoverSearchEngine.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/GeminiOriginalDiscovery.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/OriginalVersionSearchEngine.kt \
            app/src/main/kotlin/com/metrolist/music/ui/component/OriginalVersionScreen.kt
          git commit -m "LAB17: AI a step, dettagli on demand e player globale"
          git push origin HEAD:uab-build/musiclab-ai-step-player-17

      - name: Upload LAB17 APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-17-APK-ZIP
          path: |
            dist/uab/apk/*.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB-17-APK.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
