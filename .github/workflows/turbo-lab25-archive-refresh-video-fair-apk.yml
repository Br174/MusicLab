name: MusicLab Turbo LAB25 — Archive Refresh + Fair Video Verification APK ZIP

on:
  push:
    branches:
      - uab-build/musiclab-turbo-lab25-archive-refresh-video-fair-family-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-turbo-lab25-archive-refresh-video-fair-family-02
  cancel-in-progress: false

jobs:
  validate:
    name: validate-once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout LAB25 two-phase source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify LAB24 regressions and LAB25 archive refresh contracts
        shell: bash
        run: node --test cloudflare/music-intelligence/test/turbo-lab24-audio-fair-original.test.mjs cloudflare/music-intelligence/test/turbo-lab25-archive-refresh-video-fair.test.mjs

      - name: Verify only approved LAB25 files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 2958b2b6a4c81b6b2a2d10428b7b58b824b0add2..HEAD | sort > /tmp/lab25-changed.txt
          cat /tmp/lab25-changed.txt
          while IFS= read -r f; do
            case "$f" in
              app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt|app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt|cloudflare/music-intelligence/test/turbo-lab24-audio-fair-original.test.mjs|cloudflare/music-intelligence/test/turbo-lab25-archive-refresh-video-fair.test.mjs|tools/universal-apk-builder/prepare-turbo-lab24-env.py|tools/universal-apk-builder/prepare-turbo-lab25-env.py|.github/workflows/turbo-lab24-audio-50-original-apk.yml|.github/workflows/turbo-lab25-archive-refresh-video-fair-apk.yml) ;;
              *) echo "FORBIDDEN CHANGE: $f"; exit 1 ;;
            esac
          done < /tmp/lab25-changed.txt
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt)" = "03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"

      - name: Prepare LAB25 version metadata in runner checkout
        run: python3 tools/universal-apk-builder/prepare-turbo-lab25-env.py

      - name: Verify LAB25 signing identity, update-in-place and version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="1025"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VISIBLE_NAME="Turbo LAB 25"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
          grep -Fq 'export METROLIST_APP_NAME="MusicLab Turbo LAB 25"' uab-project.env
          grep -Fq 'export MUSICLAB_VERSION_CODE="1025"' uab-project.env
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt)" = "03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"

      - name: Prove experimental player is exact upstream Meld (no LAB41 alternate resolver)
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_PATH="app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt"
          MELD_BLOB="03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"
          test "$(git hash-object "$PLAYER_PATH")" = "$MELD_BLOB"
          ! grep -q 'LAB07_FAST_LANE_TIMEOUT_MS' "$PLAYER_PATH"
          grep -q 'bundle().extractor.extract(' "$PLAYER_PATH"



  build-update:
    name: build-update-first
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact Turbo LAB25 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-overwrite-existing: true
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: Prepare LAB25 version metadata in runner checkout
        run: python3 tools/universal-apk-builder/prepare-turbo-lab25-env.py

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build Turbo LAB25
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify Turbo LAB25 update identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-Turbo-LAB25.apk"
          ZIP="dist/uab/MusicLab-Turbo-LAB25-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='1025'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab Turbo LAB 25'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=turbo01"
            echo "APPLICATION_ID=it.verlezza.musiclab.turbo01"
            echo "VERSION_CODE=1025"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "MELD_ORIGINAL_PLAYER_BLOB_SHA=03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"
            echo "MELD_UPSTREAM_COMMIT=9cb6105a5fe9077c6d4430b978209556f9405da3"
            echo "PAIRED_SAFETY=LAB68 unchanged; independent Turbo experimental family"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload Turbo LAB25 immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB25
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB25.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-LAB25-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload separate diagnostics if present
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB25-build-diagnostics
          path: dist/uab/logs/*.log
          if-no-files-found: ignore
