name: TEMP LAB13 Guardian Final Test

on:
  push:
    branches:
      - uab-build/musiclab-upstream-meld-guardian-13

permissions:
  contents: read

concurrency:
  group: musiclab-lab13-final-test
  cancel-in-progress: true

jobs:
  test-build:
    if: contains(github.event.head_commit.message, 'LAB13 final guardian build test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e19ee926b7d4fcdcbb1a75cbc28948a1d7f98aa
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-protobuf
      - name: Crea keystore debug temporaneo
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Verifica policy updater
        shell: bash
        run: |
          ! grep -R "getDownloadUrlForCurrentVariant(releaseInfo)" \
            app/src/main/kotlin/com/metrolist/music/MainActivity.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AccountSettings.kt
          grep -q 'IMPORTED_MELD_VERSION = "0.8.9"' app/src/main/kotlin/com/metrolist/music/utils/Updater.kt
          grep -q 'FrancescoGrazioso/Meld' .upstream/meld.json
          grep -q 'scheduled_polling.*false' .upstream/meld.json
      - name: Test Guardian su Meld 0.9.2
        shell: bash
        run: |
          mkdir -p dist/upstream-meld-review
          python3 tools/upstream-meld/review_update.py --to-tag v0.9.2 --out-dir dist/upstream-meld-review
          grep -q '"to_tag": "v0.9.2"' dist/upstream-meld-review/report.json
      - name: Diagnostica UAB
        run: bash tools/universal-apk-builder/diagnose.sh .
      - name: Build APK LAB13
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .
      - name: Upload artefatto
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-UPSTREAM-MELD-GUARDIAN-13
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/upstream-meld-review/**
          if-no-files-found: error
          retention-days: 14
