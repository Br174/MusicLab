name: TMP Fix Originali Weight

on:
  push:
    branches:
      - lab/musiclab-playback-403-recovery-01
    paths:
      - .github/workflows/_tmp_fix_originali_weight.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0
      - name: Fix Compose weight import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/metrolist/music/ui/component/OriginalVersionScreen.kt')
          t = p.read_text()
          old = 'import androidx.compose.foundation.layout.weight\n'
          if t.count(old) != 1:
              raise SystemExit(f'Expected one weight import, found {t.count(old)}')
          p.write_text(t.replace(old, '', 1))
          PY
          rm -f .github/workflows/_tmp_fix_originali_weight.yml
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(originali): use ColumnScope weight extension"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
