name: TMP Originali Labels

on:
  push:
    branches:
      - lab/musiclab-playback-403-recovery-01
    paths:
      - .github/workflows/_tmp_originali_labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/musiclab-playback-403-recovery-01
          fetch-depth: 0
      - name: Rename Originali section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/metrolist/music/ui/component/OriginalVersionScreen.kt')
          t = p.read_text()
          old = 'VersionSectionTitle("Altre versioni dello stesso artista")'
          new = 'VersionSectionTitle("Altre versioni")'
          if t.count(old) != 1:
              raise SystemExit(f'Expected exactly one label, found {t.count(old)}')
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
          rm -f .github/workflows/_tmp_originali_labels.yml
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(originali): label alternate recordings clearly"
          git push origin HEAD:lab/musiclab-playback-403-recovery-01
