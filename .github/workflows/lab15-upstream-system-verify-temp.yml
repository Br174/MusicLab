name: TEMP LAB15 Guardian Final Verify

on:
  push:
    branches:
      - uab-build/musiclab-meld-upstream-system-15

permissions:
  contents: read

concurrency:
  group: lab15-upstream-system-final-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verifica logica permanente
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/meld_upstream_analyzer.py .github/scripts/meld_record_verified_integration.py
          python3 - <<'PY'
          import json
          cfg=json.load(open('.github/upstream/meld.json'))
          ledger=json.load(open('.github/upstream/meld-integrations.json'))
          assert cfg['source_repo'] == 'FrancescoGrazioso/Meld'
          assert cfg['direct_metrolist_enabled'] is False
          assert cfg['accepted_baseline_tag'] == 'v0.9.2'
          assert cfg['accepted_baseline_commit'] == 'dc7a27224acee33fa475ab70e1935dc03d3ef4ef'
          assert cfg['promotion_policy'] == 'never_promote_without_bruno_approval'
          assert ledger['integrations'][0]['tag'] == 'v0.9.2'
          PY
          grep -q 'finalize_current_lab' .github/workflows/meld-upstream-review.yml
          grep -q ':app:testFossDebugUnitTest :spotify:test :betterlyrics:test' .github/workflows/meld-upstream-review.yml
          grep -q 'meld_record_verified_integration.py' .github/workflows/meld-upstream-review.yml
          grep -q 'Registra baseline verificata nella LAB' .github/workflows/meld-upstream-review.yml
          git fetch origin uab-build/musiclab-meld-0.9.2-integration-14:refs/remotes/origin/lab14
          APP_DIFF="$(git diff --name-only refs/remotes/origin/lab14..HEAD -- app || true)"
          [ -z "$APP_DIFF" ] || { echo "File app inattesi: $APP_DIFF" >&2; exit 51; }

      - name: Self-test recorder baseline
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp .github/upstream/meld.json "$TMP/meld.json"
          cp .github/upstream/meld-integrations.json "$TMP/ledger.json"
          python3 .github/scripts/meld_record_verified_integration.py \
            --config "$TMP/meld.json" \
            --ledger "$TMP/ledger.json" \
            --tag v9.9.9 \
            --upstream-commit 1111111111111111111111111111111111111111 \
            --branch uab-build/test-meld-999 \
            --musiclab-head 2222222222222222222222222222222222222222 \
            --build-run-id 123456 \
            --artifact-name MusicLab-TEST
          python3 - "$TMP" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          cfg=json.load(open(p/'meld.json'))
          ledger=json.load(open(p/'ledger.json'))
          assert cfg['accepted_baseline_tag'] == 'v9.9.9'
          assert cfg['accepted_baseline_commit'] == '1111111111111111111111111111111111111111'
          rec=[x for x in ledger['integrations'] if x['upstream_commit']=='1111111111111111111111111111111111111111']
          assert len(rec) == 1
          assert rec[0]['status'] == 'integrated_lab_build_verified'
          assert rec[0]['promotion']['mother'] is False
          original=json.load(open('.github/upstream/meld.json'))
          assert original['accepted_baseline_tag'] == 'v0.9.2'
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/setup-protobuf

      - name: Test regressione JVM MusicLab
        shell: bash
        env:
          MELD_UPSTREAM_BASELINE: 0.9.2
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: ./gradlew --console=plain :app:testFossDebugUnitTest :spotify:test :betterlyrics:test --warning-mode summary
