name: TEMP LAB15 Upstream System Verify

on:
  push:
    branches:
      - uab-build/musiclab-meld-upstream-system-15

permissions:
  contents: read

concurrency:
  group: lab15-upstream-system-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verifica stato Guardian
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/meld_upstream_analyzer.py
          python3 - <<'PY'
          import json
          cfg=json.load(open('.github/upstream/meld.json'))
          ledger=json.load(open('.github/upstream/meld-integrations.json'))
          assert cfg['source_repo'] == 'FrancescoGrazioso/Meld'
          assert cfg['direct_metrolist_enabled'] is False
          assert cfg['accepted_baseline_tag'] == 'v0.9.2'
          assert cfg['accepted_baseline_commit'] == 'dc7a27224acee33fa475ab70e1935dc03d3ef4ef'
          assert cfg['merge_policy'] == 'auto_apply_safe_only_in_isolated_lab'
          assert cfg['promotion_policy'] == 'never_promote_without_bruno_approval'
          assert ledger['integrations'][0]['tag'] == 'v0.9.2'
          assert ledger['integrations'][0]['status'] == 'integrated_lab_verified'
          PY
          git fetch origin uab-build/musiclab-meld-0.9.2-integration-14:refs/remotes/origin/lab14
          APP_DIFF="$(git diff --name-only refs/remotes/origin/lab14..HEAD -- app || true)"
          if [ -n "$APP_DIFF" ]; then
            echo "LAB15 ha modificato file applicativi inattesi:" >&2
            echo "$APP_DIFF" >&2
            exit 41
          fi
          grep -q 'workflow_dispatch:' .github/workflows/meld-upstream-review.yml
          ! grep -q '^  schedule:' .github/workflows/meld-upstream-review.yml
          grep -q 'tools/universal-apk-builder/build-apk.sh' .github/workflows/meld-upstream-review.yml
          grep -q 'Crea keystore debug temporaneo' .github/workflows/meld-upstream-review.yml
          grep -q 'LOCAL_RELEASE=2026.09.30-r8' .motorlab/MOTORLAB_SYNC_STATE.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/setup-protobuf

      - name: Crea keystore debug temporaneo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepara ambiente UAB LAB15
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat > /tmp/uab-lab15.env <<'EOF'
          UAB_TASK=":app:assembleFossDebug"
          UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"
          UAB_OUTPUT_NAME="MusicLab-LAB-UPSTREAM-SYSTEM-15"
          UAB_GRADLE_ARGS="-x lint"
          UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"
          UAB_PARALLEL_INSTALL="on"
          UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.lab"
          UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"
          UAB_APP_NAME_BASE="MusicLab LAB"
          UAB_APP_NAME_ENV="METROLIST_APP_NAME"
          export PULL_REQUEST="false"
          EOF

      - name: Build LAB15 isolata via UAB
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-lab15.env
          UAB_BUILD_ID: upstream15
          MELD_UPSTREAM_BASELINE: 0.9.2
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .

      - name: Verifica APK, ZIP e applicationId
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-LAB-UPSTREAM-SYSTEM-15.apk"
          ZIP="dist/uab/MusicLab-LAB-UPSTREAM-SYSTEM-15-APK.zip"
          test -f "$APK"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='it.verlezza.musiclab.lab.upstream15'" /tmp/badging.txt
          sha256sum "$APK" "$ZIP" | tee dist/uab/SHA256SUMS.txt

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-UPSTREAM-SYSTEM-15-VERIFY
          path: |
            dist/uab/apk/MusicLab-LAB-UPSTREAM-SYSTEM-15.apk
            dist/uab/MusicLab-LAB-UPSTREAM-SYSTEM-15-APK.zip
            dist/uab/SHA256SUMS.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
