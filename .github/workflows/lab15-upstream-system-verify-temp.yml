name: TEMP LAB15 Upstream System Verify

on:
  push:
    branches:
      - uab-build/musiclab-meld-upstream-system-15

permissions:
  contents: read

concurrency:
  group: lab15-upstream-system-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica stato Guardian
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/meld_upstream_analyzer.py
          python3 - <<'PY'
          import json
          cfg=json.load(open('.github/upstream/meld.json'))
          ledger=json.load(open('.github/upstream/meld-integrations.json'))
          assert cfg['source_repo'] == 'FrancescoGrazioso/Meld'
          assert cfg['direct_metrolist_enabled'] is False
          assert cfg['accepted_baseline_tag'] == 'v0.9.2'
          assert cfg['accepted_baseline_commit'] == 'dc7a27224acee33fa475ab70e1935dc03d3ef4ef'
          assert cfg['merge_policy'] == 'auto_apply_safe_only_in_isolated_lab'
          assert cfg['promotion_policy'] == 'never_promote_without_bruno_approval'
          assert ledger['integrations'][0]['tag'] == 'v0.9.2'
          assert ledger['integrations'][0]['status'] == 'integrated_lab_verified'
          PY
          git fetch origin uab-build/musiclab-meld-0.9.2-integration-14:refs/remotes/origin/lab14
          APP_DIFF="$(git diff --name-only refs/remotes/origin/lab14..HEAD -- app || true)"
          if [ -n "$APP_DIFF" ]; then
            echo "LAB15 ha modificato file applicativi inattesi:" >&2
            echo "$APP_DIFF" >&2
            exit 41
          fi
          grep -q 'workflow_dispatch:' .github/workflows/meld-upstream-review.yml
          ! grep -q '^  schedule:' .github/workflows/meld-upstream-review.yml

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pre-build UAB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew .uab/pre-build.sh
          .uab/pre-build.sh "$PWD"

      - name: Build FossDebug isolata
        shell: bash
        env:
          METROLIST_APPLICATION_ID: it.verlezza.musiclab.lab.upstream15
          METROLIST_APP_NAME: MusicLab LAB Upstream 15
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: push
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'FrancescoGrazioso/Meld' }}
        run: ./gradlew :app:assembleFossDebug -x lint --build-cache --console=plain

      - name: Package APK + ZIP
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -path '*/foss/debug/*.apk' | head -1)"
          [ -f "$APK" ] || { echo 'APK FossDebug non trovato' >&2; exit 42; }
          mkdir -p dist/uab/apk
          OUT_APK=dist/uab/apk/MusicLab-LAB-UPSTREAM-SYSTEM-15.apk
          OUT_ZIP=dist/uab/MusicLab-LAB-UPSTREAM-SYSTEM-15-APK.zip
          cp "$APK" "$OUT_APK"
          (cd dist/uab/apk && zip -9 ../MusicLab-LAB-UPSTREAM-SYSTEM-15-APK.zip MusicLab-LAB-UPSTREAM-SYSTEM-15.apk)
          unzip -t "$OUT_ZIP"
          sha256sum "$OUT_APK" "$OUT_ZIP" | tee dist/uab/SHA256SUMS.txt

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-UPSTREAM-SYSTEM-15-VERIFY
          path: |
            dist/uab/apk/MusicLab-LAB-UPSTREAM-SYSTEM-15.apk
            dist/uab/MusicLab-LAB-UPSTREAM-SYSTEM-15-APK.zip
            dist/uab/SHA256SUMS.txt
          retention-days: 14
