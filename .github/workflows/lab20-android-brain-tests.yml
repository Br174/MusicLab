name: LAB21 Android Deep Locator Contract

on:
  push:
    branches:
      - uab-build/musiclab-deep-locator-21
    paths:
      - 'app/src/main/kotlin/com/metrolist/music/ui/component/**'
      - 'app/src/main/kotlin/com/metrolist/music/App.kt'
      - 'app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt'
      - 'app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt'
      - 'app/src/test/kotlin/com/metrolist/music/ui/component/**'
      - 'cloudflare/music-intelligence/test/device-regression-contract.test.mjs'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/lab20-android-brain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-deep-locator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fast Android source contracts
        run: node --test cloudflare/music-intelligence/test/android-brain-contract-source.test.mjs cloudflare/music-intelligence/test/device-regression-contract.test.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android Brain and deep playback-locator contract tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --tests com.metrolist.music.ui.component.AiBrainMetadataTest --tests com.metrolist.music.ui.component.AiCoverageModeTest --tests com.metrolist.music.ui.component.AiCoverSearchEngineTest --tests com.metrolist.music.ui.component.AiCoverFlowResolverTest --tests com.metrolist.music.ui.component.OriginalVersionSearchEngineTest --warning-mode summary
