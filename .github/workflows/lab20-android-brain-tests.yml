name: LAB20 Android Brain Contract

on:
  push:
    branches:
      - uab-build/musiclab-ai-brain-20
    paths:
      - 'app/src/main/kotlin/com/metrolist/music/ui/component/**'
      - 'app/src/test/kotlin/com/metrolist/music/ui/component/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/lab20-android-brain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-brain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android Brain contract test
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --tests com.metrolist.music.ui.component.AiBrainMetadataTest --warning-mode summary
