name: MusicLab Turbo LAB38 — Compilation Theme Navigation APK ZIP

on:
  push:
    branches:
      - uab-build/musiclab-turbo-lab38-compilation-theme-navigation-family-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-turbo-lab38-compilation-theme-navigation-family-02
  cancel-in-progress: true

jobs:
  validate:
    name: validate-once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact LAB38 compilation theme navigation source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify only approved LAB38 UI and build/test files change
        shell: bash
        run: |
          set -euo pipefail
          BASE="f6b79315690d880b13bbf9b42a4edf2fc1c34297"
          git diff --name-only "$BASE"..HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r f; do
            case "$f" in
              app/src/main/kotlin/com/metrolist/music/ui/component/CompilationScreen.kt|app/src/main/kotlin/com/metrolist/music/ui/component/AppNavigation.kt|app/src/main/res/drawable/cover_microphone.xml|app/src/main/res/drawable/compilation_disc_search.xml|cloudflare/music-intelligence/test/lab31-player-veloce-compilation-ui-contract.test.mjs|cloudflare/music-intelligence/test/turbo-lab38-compilation-theme-nav.test.mjs|tools/universal-apk-builder/prepare-turbo-lab38-compilation-theme-nav-env.py|.github/workflows/turbo-lab38-compilation-theme-nav-apk.yml) ;;
              *) echo "FORBIDDEN CHANGE: $f"; exit 1 ;;
            esac
          done < /tmp/changed.txt


      - name: Preserve Cover layout, player and search engines bit-for-bit
        shell: bash
        run: |
          set -euo pipefail
          BASE="f6b79315690d880b13bbf9b42a4edf2fc1c34297"
          for file in \
            app/src/main/kotlin/com/metrolist/music/ui/component/DiscogsDirectVersionBrowser.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/Screens.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt \
            app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt; do
            test "$(git hash-object "$file")" = "$(git rev-parse "$BASE:$file")"
          done
          echo "COVER/PLAYER INTACT: verified against LAB37."

      - name: Run retained LAB32 contracts
        shell: bash
        run: |
          node --test             cloudflare/music-intelligence/test/turbo-lab24-audio-fair-original.test.mjs             cloudflare/music-intelligence/test/turbo-lab25-archive-refresh-video-fair.test.mjs             cloudflare/music-intelligence/test/turbo-lab26-video-coverage-scheduler.test.mjs             cloudflare/music-intelligence/test/turbo-lab27-video-first-batch-refill.test.mjs             cloudflare/music-intelligence/test/turbo-lab28-crash-guards.test.mjs             cloudflare/music-intelligence/test/turbo-lab29-cover-ui-gesture.test.mjs             cloudflare/music-intelligence/test/turbo-lab30-theme-selected-cover.test.mjs             cloudflare/music-intelligence/test/turbo-lab31-readonly-audio-diagnostics.test.mjs             cloudflare/music-intelligence/test/turbo-lab32-header-spacing-arrow.test.mjs cloudflare/music-intelligence/test/turbo-lab34-approved-cover-header.test.mjs cloudflare/music-intelligence/test/turbo-lab35-five-filters-fit.test.mjs cloudflare/music-intelligence/test/turbo-lab36-final-approved-cover.test.mjs cloudflare/music-intelligence/test/turbo-lab37-slim-chips-only.test.mjs cloudflare/music-intelligence/test/turbo-lab38-compilation-theme-nav.test.mjs

      - name: Prepare LAB38 compilation theme navigation metadata
        run: python3 tools/universal-apk-builder/prepare-turbo-lab38-compilation-theme-nav-env.py

      - name: Verify update-family compilation theme navigation identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33038"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_VISIBLE_NAME="Turbo LAB 38"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_CERT_SHA256="9A:2F:67:CF:B3:C1:99:83:68:13:AD:DB:F7:BD:FB:0F:A6:5E:DC:76:5F:FA:CE:4B:6D:F9:49:0B:B0:96:27:49"' uab-project.env
          grep -Fq 'export METROLIST_APP_NAME="MusicLab Turbo LAB 38"' uab-project.env
          grep -Fq 'export MUSICLAB_VERSION_CODE="33038"' uab-project.env
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt)" = "03138a7b0d6771e4c7dde0ecc9ab11a8046990ff"

  build-update:
    name: build-update-first
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact Turbo LAB38 compilation theme navigation source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-overwrite-existing: true
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: Prepare LAB38 compilation theme navigation metadata
        run: python3 tools/universal-apk-builder/prepare-turbo-lab38-compilation-theme-nav-env.py

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build Turbo LAB38 compilation theme navigation update
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify install-over identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-Turbo-LAB38.apk"
          ZIP="dist/uab/MusicLab-Turbo-LAB38-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33038'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab Turbo LAB 38'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=turbo01"
            echo "APPLICATION_ID=it.verlezza.musiclab.turbo01"
            echo "VERSION_CODE=33038"
            echo "PREVIOUS_LAB37_VERSION_CODE=33037"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "PREVIOUS_LAB37_SOURCE_SHA=f6b79315690d880b13bbf9b42a4edf2fc1c34297"
            echo "PURPOSE=Compilation search/filter visual unification and exact white Cover/Compilation navigation icons with theme palette; preserve Cover/audio/search engines"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload Turbo LAB38 immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB38
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB38.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-Turbo-LAB38-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload separate diagnostics if present
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB38-build-diagnostics
          path: dist/uab/logs/*.log
          if-no-files-found: ignore
