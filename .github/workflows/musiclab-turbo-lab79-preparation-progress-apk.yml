name: MusicLab Turbo LAB79 Preparation-Progress APK ZIP
on:
  push:
    branches:
      - lab/musiclab-turbo-lab79-preparation-progress-20261028
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musiclab-lab79-preparation-progress-v1
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Guard delivered LAB78 results, poster layout and player
        run: python3 tools/universal-apk-builder/verify-r8-cover-scope.py
      - name: Native audio and recording identity contracts
        run: node --test cloudflare/music-intelligence/test/turbo-lab49-audio-stability-contract.test.mjs cloudflare/music-intelligence/test/turbo-lab46-recording-identity.test.mjs
      - name: Canonical behavior consistency
        run: |
          python3 - <<'PYGUARD'
          import json
          memory=json.load(open('behaviors/musiclab-cover.json'))
          rules={r['id']:r for r in memory['rules']}
          assert len(rules)==len(memory['rules'])
          for disposition in memory['conflictDispositions']:
              assert rules[disposition['oldRule']]['status']=='retired'
              assert rules[disposition['replacementRule']]['status']=='active'
          assert rules['musiclab.cover.six-rounds.v1']['status']=='active'
          assert memory['approvedNextSpecification']['rounds']==6
          assert memory['approvedNextSpecification']['cycleSizes']==[10,20,20]
          PYGUARD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-protobuf
      - name: Prepare same-family Android 33081
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          python3 tools/universal-apk-builder/prepare-turbo-lab79-preparation-progress-env.py
          grep -Fq 'UAB_UPDATE_FAMILY_VERSION_CODE="33081"' uab-project.env
          grep -Fq 'UAB_UPDATE_FAMILY_APPLICATION_ID="it.verlezza.musiclab.turbo01"' uab-project.env
      - name: Android JVM regressions full
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source uab-project.env
          set +a
          ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary
      - name: Build signed LAB79 APK ZIP
        if: contains(github.event.head_commit.message, '[build-apk]')
        run: |
          bash tools/universal-apk-builder/diagnose.sh .
          bash tools/universal-apk-builder/build-apk.sh .
      - name: Verify Android package, signing certificate and ZIP
        if: contains(github.event.head_commit.message, '[build-apk]')
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/uab/apk/MusicLab-Turbo-LAB79-Revisione-8.apk
          ZIP=dist/uab/MusicLab-Turbo-LAB79-Revisione-8-APK.zip
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          apk=Path('dist/uab/apk/MusicLab-Turbo-LAB79-Revisione-8.apk')
          archive=Path('dist/uab/MusicLab-Turbo-LAB79-Revisione-8-APK.zip')
          digest=lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(archive) as z:
              names=[n for n in z.namelist() if n.lower().endswith('.apk')]
              assert len(names)==1, names
              assert digest(z.read(names[0]))==digest(apk.read_bytes()), 'ZIP APK differs from signed standalone APK'
          Path('dist/uab/SHA256SUMS.txt').write_text(''.join(digest(p.read_bytes())+'  '+p.name+'\n' for p in (apk,archive)))
          PY
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.turbo01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='33081'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          CERT="$(grep -i -m1 'certificate SHA-256 digest:' /tmp/signature.txt | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$CERT" = '9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749'
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt
      - name: Publish installable APK and ZIP
        if: contains(github.event.head_commit.message, '[build-apk]')
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Turbo-LAB79-Revisione-8-Preparation-Progress-APK-ZIP
          path: |
            dist/uab/apk/MusicLab-Turbo-LAB79-Revisione-8.apk
            dist/uab/MusicLab-Turbo-LAB79-Revisione-8-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
