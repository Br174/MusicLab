name: TEMP MusicLab LAB11 AI Engine Build

on:
  push:
    branches:
      - uab-build/musiclab-global-ai-engine-11

permissions:
  contents: read

concurrency:
  group: musiclab-lab11-temp-build
  cancel-in-progress: true

jobs:
  build:
    name: Build LAB11 pinned source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout LAB11 functional source
        uses: actions/checkout@v4
        with:
          ref: 586ceeb7717525df4b1c5553c0a8c2817012c018
          submodules: recursive
          fetch-depth: 1
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf
      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: UAB preflight diagnostics
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .
      - name: Build APK and ZIP with UAB
        shell: bash
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-GLOBAL-AI-ENGINE-11-CHECK
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14
