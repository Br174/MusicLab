name: LAB58 Fast Artifact + Sicurezza 57 Gate

on:
  push:
    branches:
      - uab-build/musiclab-lab58-aggiornamento-family-01
    paths-ignore:
      - LAB58_BUILD_STATUS.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab58-fast-artifact-v1
  cancel-in-progress: true

jobs:
  validate:
    name: validate-once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact LAB58 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run retained LAB46-LAB58 behavioral contracts in one process
        run: |
          node --test cloudflare/music-intelligence/test/lab46-originals-retry-player-contract.test.mjs cloudflare/music-intelligence/test/lab46-red-retry-originals-player-contract.test.mjs cloudflare/music-intelligence/test/lab48-player-isolation-contract.test.mjs cloudflare/music-intelligence/test/lab49-cancellable-background-contract.test.mjs cloudflare/music-intelligence/test/lab50-direct-play-background-barrier-contract.test.mjs cloudflare/music-intelligence/test/lab51-cover-admission-score20-contract.test.mjs cloudflare/music-intelligence/test/lab52-cover-video-page-contract.test.mjs cloudflare/music-intelligence/test/lab53-cover-card-decisions-contract.test.mjs cloudflare/music-intelligence/test/lab54-cover-playback-pagination-card-contract.test.mjs cloudflare/music-intelligence/test/lab55-original-first-vertical-prefetch-playback-contract.test.mjs cloudflare/music-intelligence/test/lab56-opera-identity-collapsible-header-contract.test.mjs cloudflare/music-intelligence/test/lab58-work-ranking-playready-adaptive-audio-contract.test.mjs cloudflare/music-intelligence/test/lab58-compacted-ranked-fives-and-full-suite-contract.test.mjs

      - name: Prove Player buono LAB41 is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          GOOD_SHA="329e663061d46928dc4d58a946c0d3d2f88881b3"
          PLAYER_PATH="app/src/main/kotlin/com/metrolist/music/utils/InnerTubeXPlayer.kt"
          git show "$GOOD_SHA:$PLAYER_PATH" > /tmp/player-buono.kt
          cmp /tmp/player-buono.kt "$PLAYER_PATH"
          grep -F 'LAB07_FAST_LANE_TIMEOUT_MS = 1_800L' "$PLAYER_PATH"

  build-update:
    name: build-update-first
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload_update.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_update.outputs.artifact-digest }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact LAB58 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-overwrite-existing: true
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB 58 aggiornamento
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify LAB 58 update identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-LAB58-aggiornamento.apk"
          ZIP="dist/uab/MusicLab-LAB58-aggiornamento-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.labupdate01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='5801'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB 58 aggiornamento'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true)"
          APK_CERT="$(printf '%s\n' "$CERT_OUTPUT" | grep -i -m1 'certificate SHA-256 digest:' | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test "$APK_CERT" = "$EXPECTED"

          {
            echo "UPDATE_FAMILY_ID=01"
            echo "APPLICATION_ID=it.verlezza.musiclab.labupdate01"
            echo "VERSION_CODE=5801"
            echo "SIGNING_CERT_SHA256=$APK_CERT"
            echo "PLAYER_BUONO_SOURCE_SHA=329e663061d46928dc4d58a946c0d3d2f88881b3"
            echo "PAIRED_SAFETY=LAB di sicurezza 57"
          } > dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Upload LAB 58 aggiornamento immediately
        id: upload_update
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB58-aggiornamento
          path: |
            dist/uab/apk/MusicLab-LAB58-aggiornamento.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB58-aggiornamento-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload separate diagnostics if present
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB58-build-diagnostics
          path: dist/uab/logs/*.log
          if-no-files-found: ignore
