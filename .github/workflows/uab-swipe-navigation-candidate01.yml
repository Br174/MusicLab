name: UAB MusicLab Swipe Navigation Candidate 01

on:
  push:
    branches:
      - candidate/musiclab-swipe-navigation-01
    paths:
      - .github/workflows/uab-swipe-navigation-candidate01.yml

permissions:
  contents: write

concurrency:
  group: uab-musiclab-swipe-navigation-candidate01
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/musiclab-swipe-navigation-01
          submodules: recursive
          fetch-depth: 0

      - name: Verify candidate diff
        shell: bash
        run: |
          git diff --check origin/mother/musiclab-112726...HEAD
          mapfile -t changed < <(git diff --name-only origin/mother/musiclab-112726...HEAD | grep '^app/' || true)
          printf 'App files changed:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -qx 'app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt'
          printf '%s\n' "${changed[@]}" | grep -qx 'app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create isolated debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Prepare candidate build config
        shell: bash
        run: |
          printf '%s\n' \
            'UAB_TASK=":app:assembleFossDebug"' \
            'UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"' \
            'UAB_OUTPUT_NAME="MusicLab-CANDIDATA-SWIPE-NAV-01"' \
            'UAB_GRADLE_ARGS="-x lint"' \
            'UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"' \
            'UAB_PARALLEL_INSTALL="on"' \
            'UAB_APPLICATION_ID_BASE="it.verlezza.musiclab.candidate"' \
            'UAB_APPLICATION_ID_ENV="METROLIST_APPLICATION_ID"' \
            'UAB_APP_NAME_BASE="MusicLab Candidata Swipe 01"' \
            'UAB_APP_NAME_ENV="METROLIST_APP_NAME"' \
            'export PULL_REQUEST="false"' \
            > /tmp/uab-candidate.env

      - name: UAB preflight
        shell: bash
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build candidate APK and ZIP
        shell: bash
        env:
          UAB_CONFIG_FILE: /tmp/uab-candidate.env
          UAB_BUILD_ID: swipenav01
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}
        run: bash tools/universal-apk-builder/build-apk.sh .

      - name: Verify package identity
        shell: bash
        run: |
          APK="$(find dist/uab/apk -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='it.verlezza.musiclab.candidate.swipenav01'" /tmp/apk-badging.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-CANDIDATA-SWIPE-NAV-01
          path: |
            dist/uab/apk/*.apk
            dist/uab/*.zip
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name "UAB Bot"
          git config user.email "uab-bot@users.noreply.github.com"
          git rm -f .github/workflows/uab-swipe-navigation-candidate01.yml
          git commit -m "chore(uab): remove temporary candidate workflow"
          git push origin HEAD:candidate/musiclab-swipe-navigation-01
