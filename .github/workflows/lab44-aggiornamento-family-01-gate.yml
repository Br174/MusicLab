name: LAB44 Aggiornamento Family 01 Gate

on:
  push:
    branches:
      - uab-build/musiclab-lab44-aggiornamento-family-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musiclab-lab44-aggiornamento-family-01
  cancel-in-progress: true

jobs:
  verify-update-family:
    name: verify-update-family
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || secrets.LASTFM_KEY || vars.LASTFM_API_KEY || vars.LASTFM_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || secrets.LASTFM_SHARED_SECRET || vars.LASTFM_SECRET || vars.LASTFM_SHARED_SECRET }}

    steps:
      - name: Checkout exact family source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prove application source is identical to LAB44
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 8a458f8f4d1e560736d81f78de551664998619f9 -- app/src app/build.gradle.kts innertube
          echo "Application/runtime source unchanged from LAB44."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run update-family and safety contract
        run: node --test cloudflare/music-intelligence/test/lab44-update-family-contract.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Configure Android SDK and Last.fm build inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [[ -n "$LASTFM_API_KEY" ]]; then
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          fi
          if [[ -n "$LASTFM_SECRET" ]]; then
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          fi

      - name: UAB preflight diagnostics
        run: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build LAB 44 aggiornamento
        run: bash tools/universal-apk-builder/build-apk.sh .
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}

      - name: Verify LAB 44 aggiornamento package version and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/uab/apk/MusicLab-LAB44-aggiornamento.apk"
          ZIP="dist/uab/MusicLab-LAB44-aggiornamento-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.labupdate01'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='4401'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB 44 aggiornamento'"

          EXPECTED="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          KEY_CERT="$(keytool -list -v -keystore dist/uab/.signing/01.jks -storepass android -alias musiclab_lab_family_01 | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':')"
          test "$APK_CERT" = "$EXPECTED"
          test "$KEY_CERT" = "$EXPECTED"
          test "$APK_CERT" = "$KEY_CERT"

          echo "UPDATE_FAMILY_ID=01" > dist/uab/UPDATE_FAMILY.txt
          echo "APPLICATION_ID=it.verlezza.musiclab.labupdate01" >> dist/uab/UPDATE_FAMILY.txt
          echo "VERSION_CODE=4401" >> dist/uab/UPDATE_FAMILY.txt
          echo "SIGNING_CERT_SHA256=$APK_CERT" >> dist/uab/UPDATE_FAMILY.txt
          printf '%s\n' "$GITHUB_SHA" > dist/uab/BUILD_SHA.txt

      - name: Build LAB di sicurezza 44 from same source
        shell: bash
        run: |
          set -euo pipefail
          SAFETY_KEY="$RUNNER_TEMP/musiclab-safety-44.jks"
          SAFETY_CONFIG="$RUNNER_TEMP/musiclab-safety-44.env"
          SAFETY_OUT="$GITHUB_WORKSPACE/dist/safety44"

          keytool -genkeypair             -keystore "$SAFETY_KEY"             -storepass android             -alias musiclab_safety_44             -keypass android             -dname "CN=MusicLab LAB di sicurezza 44,O=MotorLab Test,C=IT"             -keyalg RSA             -keysize 2048             -validity 36500             -noprompt

          cat > "$SAFETY_CONFIG" <<'EOF'
          UAB_TASK=":app:assembleFossDebug"
          UAB_APK_GLOB="app/build/outputs/apk/foss/debug/*.apk"
          UAB_FILE_VERSION="LAB_DI_SICUREZZA_44"
          UAB_OUTPUT_NAME="MusicLab-LAB-di-sicurezza-44"
          UAB_GRADLE_ARGS="-x lint"
          UAB_PRE_BUILD_SCRIPT=".uab/pre-build.sh"
          UAB_PARALLEL_INSTALL="off"
          export METROLIST_APPLICATION_ID="it.verlezza.musiclab.safety44"
          export METROLIST_APP_NAME="MusicLab LAB di sicurezza 44"
          export MUSICLAB_VERSION_CODE="4401"
          export MUSICLAB_VERSION_NAME="0.9.2-safety44"
          export PULL_REQUEST="false"
          EOF

          UAB_CONFIG_FILE="$SAFETY_CONFIG"           UAB_OUTPUT_DIR="$SAFETY_OUT"           METROLIST_DEBUG_KEYSTORE_PATH="$SAFETY_KEY"           METROLIST_DEBUG_KEYSTORE_PASSWORD="android"           METROLIST_DEBUG_KEY_ALIAS="musiclab_safety_44"           METROLIST_DEBUG_KEY_PASSWORD="android"           CRASH_REPORT_TOKEN="${{ secrets.CRASH_REPORT_TOKEN }}"           CRASH_REPORT_REPO="${{ vars.CRASH_REPORT_REPO || 'Br174/MusicLab' }}"           bash tools/universal-apk-builder/build-apk.sh .

      - name: Verify LAB di sicurezza 44 independent identity
        shell: bash
        run: |
          set -euo pipefail
          SAFETY_OUT="$GITHUB_WORKSPACE/dist/safety44"
          APK="$SAFETY_OUT/apk/MusicLab-LAB-di-sicurezza-44.apk"
          ZIP="$SAFETY_OUT/MusicLab-LAB-di-sicurezza-44-APK.zip"
          test -s "$APK"
          test -s "$ZIP"
          unzip -tq "$ZIP"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='it.verlezza.musiclab.safety44'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='4401'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'MusicLab LAB di sicurezza 44'"

          SAFETY_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          MAIN_CERT="9A2F67CFB3C199836813ADDBF7BDFB0FA65EDC765FFACE4B6DF9490BB0962749"
          test -n "$SAFETY_CERT"
          test "$SAFETY_CERT" != "$MAIN_CERT"

          {
            echo "SAFETY_LABEL=LAB di sicurezza 44"
            echo "PAIRED_UPDATE_LABEL=LAB 44 aggiornamento"
            echo "PAIRED_UPDATE_SHA=$GITHUB_SHA"
            echo "APPLICATION_ID=it.verlezza.musiclab.safety44"
            echo "VERSION_CODE=4401"
            echo "SIGNING_CERT_SHA256=$SAFETY_CERT"
            echo "IMMUTABLE=yes"
          } > "$SAFETY_OUT/SAFETY_44.txt"

          printf '%s\n' "$GITHUB_SHA" > "$SAFETY_OUT/BUILD_SHA.txt"
          sha256sum "$APK" "$ZIP" > "$SAFETY_OUT/SAFETY_SHA256SUMS.txt"

      - name: Upload LAB 44 aggiornamento
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB44-aggiornamento
          path: |
            dist/uab/apk/MusicLab-LAB44-aggiornamento.apk
            dist/uab/apk/SHA256SUMS.txt
            dist/uab/MusicLab-LAB44-aggiornamento-APK.zip
            dist/uab/BUILD_SHA.txt
            dist/uab/UPDATE_FAMILY.txt
            dist/uab/logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload LAB di sicurezza 44
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-di-sicurezza-44
          path: |
            dist/safety44/apk/MusicLab-LAB-di-sicurezza-44.apk
            dist/safety44/apk/SHA256SUMS.txt
            dist/safety44/MusicLab-LAB-di-sicurezza-44-APK.zip
            dist/safety44/BUILD_SHA.txt
            dist/safety44/SAFETY_44.txt
            dist/safety44/SAFETY_SHA256SUMS.txt
            dist/safety44/logs/*.log
          if-no-files-found: error
          retention-days: 30
