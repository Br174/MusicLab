workflows:
  uab-musiclab-lab:
    name: Universal APK Builder - MusicLab LAB
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      java: 21
      groups:
        - uab_delivery
      vars:
        UAB_OUTPUT_NAME: "MusicLab-LAB"
        UAB_MANIFEST_REPOSITORY: "Br174/Chatgpt"
        UAB_MANIFEST_BRANCH: "main"
        UAB_MANIFEST_PATH: "uab-artifacts/{project}/latest.json"
        UAB_ARTIFACT_PUBLIC_TTL_DAYS: "30"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Initialize submodules
        script: git submodule update --init --recursive

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: UAB preflight diagnostics
        script: bash tools/universal-apk-builder/diagnose.sh .

      - name: Build APK and ZIP with UAB
        script: bash tools/universal-apk-builder/build-apk.sh .

    artifacts:
      - dist/uab/apk/*.apk
      - dist/uab/*.zip
      - dist/uab/logs/*.log

    publishing:
      scripts:
        - name: Publish APK and ZIP manifest to GitHub
          script: python3 tools/universal-apk-builder/publish-github-manifest.py
