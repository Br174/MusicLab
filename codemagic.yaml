workflows:
  uab-musiclab-lab:
    name: Universal APK Builder - MusicLab LAB
    instance_type: mac_mini_m2
    max_build_duration: 30

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'universal-apk-builder'
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      java: 21
      groups:
        - uab_delivery
      vars:
        UAB_OUTPUT_NAME: "MusicLab-LAB-01"
        UAB_MANIFEST_REPOSITORY: "Br174/Chatgpt"
        UAB_MANIFEST_BRANCH: "main"
        UAB_MANIFEST_PATH: "uab-artifacts/{project}/latest.json"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Initialize submodules
        script: git submodule update --init --recursive

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: UAB preflight diagnostics
        script: bash tools/universal-apk-builder/diagnose.sh .

      - name: UAB GitHub delivery preflight
        script: python3 tools/universal-apk-builder/publish-github-manifest.py --preflight

      - name: Build APK and ZIP with UAB
        script: bash tools/universal-apk-builder/build-apk.sh .

    artifacts:
      - dist/uab/apk/*.apk
      - dist/uab/*.zip
      - dist/uab/logs/*.log

    publishing:
      scripts:
        - name: Publish APK and ZIP to central GitHub release
          script: |
            if ! python3 tools/universal-apk-builder/publish-github-manifest.py; then
              echo "[UAB] Delivery bridge failed, but APK/ZIP build remains valid."
              exit 0
            fi
